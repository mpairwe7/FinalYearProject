    - id: "ASI09"
      name: "Human-Agent Trust Exploitation"
      status: "mitigated"
      browser_agent_assurance: "ADR-0038: an approval needs a session of the caller's own and the SHA-256 of the fields shown, and is appended to the ledger with the evidence of the confirmation before the portal is reached; before this no portal decision reached the ledger at all (G541, G543). No identity field has a default and a value the taxpayer did not give is marked as assumed (G544). The app may be framed only by itself and huggingface.co, Allow needs a browser-raised click and is held back when the card appears, and a decision from another site is refused (G548, G549)."
      call_screens_assurance: "ADR-0042: the pre-call notice that an AI answers and may read the tone of the voice is shown in all five languages (G607; Art. 50 transparency), every caller-facing call error is translated from a code rather than shown as server English, a refused call says why instead of thanking the caller (G605), and the time limit is announced before it ends a call (G602). The Luganda, Runyankole, Acholi and Swahili strings added have not been reviewed by first-language speakers."
      control_integrity: "ADR-0022: a streamed figure is held until the guards have read it, a fallback or incomplete answer says so, the reply names inputs assumed from memory, and the route to a person cannot be gated (G335, G353, G355, G358). Limitation: the figure lock measures rather than enforces outside the reasoning tier (G360), and vernacular number words are not held (G364)."
      live_web_assurance: "ADR-0021: a failed live check is disclosed on every serving path, commentary and search summaries are labelled as such, and a market rate is described as an estimate. Disclosures reach the audit row."
      receptionist_assurance: "ADR-0020: draft notes explicitly leave resolution and understanding unverified; recorded officer speech does not establish statutory advice. Wrap-up ownership/atomic writes remain G305."
      call_handoff_assurance: "ADR-0039: the call says an officer is coming only after the transfer has checked the queue flag and staffing, and offers none while handoffs are off (G572); it ends a call only on a goodbye that is not a question, never during a caller's reply to the closing line (G573); an answer finished after the caller went on hold is dropped (G574); an answer the spoken-figure guard withholds is put on screen as written and the caller is told so, instead of the turn crashing (G575)."
      officer_evidence_assurance: "ADR-0051: an officer taking over a case sees whether the AI's answer was checked (claim check, withheld figure, judge revision and confidence labelled as a model's, sources reviewed) and a reused ticket carries the answers given since, the new reason and the latest evidence (G640, G641); if that refresh fails it is logged, counted (ticket_refresh_failed_total) and flagged on the handoff (ticket_refresh_failed), and the ticket keeps its earlier snapshot; a machine translation of the taxpayer is labelled (G642)."
      staff_controls_assurance: "ADR-0050: a hotfix that changes what the model treats as law needs a statute and shows its effect before it applies, and every write is audited (G634); a translation that loses a figure is not sent (G635); canned replies cannot be sent while a [[…]] part remains, so the officer writes each result; the composer does not verify what is written or record a check (G636); the overrides and flags consoles state their real reach and durability (G637, G638); review findings are kept (G639). Limitation: discrepancies and answer overrides are not tenant-scoped (G634, G637)."
      human_handoff_assurance: "ADR-0049: a ticket any turn opens is followed in the chat (G625); no route promises an officer without a ticket (G627); a lost case hands the taxpayer back to the assistant instead of leaving them with a dead officer chat (G626); the case room states the real status (G628); an officer's machine-translated message is labelled with the original one click away (G631)."
      officer_takeover_assurance: "ADR-0055: once an officer has the call the caller hears and sees only the officer (G657). The bridge clears the AI's speech already queued in the output transport, and waits at most 1 s, before the joining line; the output gate and the caller's socket writer hold back the AI's audio and captions once bridged or ended and any queue place or transferring status from a wait that is over; the brain sends the waiting screen only if the call still waits; asking for an officer interrupts the AI; the officer audio socket's hang-up is the desk's End (closing line, the caller told, a wrap-up owed); on the WebSocket transport an ended call stops its pipeline and closes the caller's socket. Limit: on LiveKit one 40 ms chunk being written when the interruption lands can still reach the caller."
      call_records_assurance: "ADR-0040: every call turn the AI handles writes one audit row of what the caller was told, in the call's language, with its disposition, crisis turns and handoffs included (G585); a Luganda answer carries the checked answer's figures and no others (G586, G588); the end-of-call summary no longer stamps a ticket's first response or replaces an officer's note, and does not call a crisis-only call answered (G587)."
      evidence: "App/backend/app/web_fx.py, App/backend/app/service.py, App/backend/app/receptionist/brain.py, App/backend/app/escalation_policy.py, plugins/apps/common_ui.py, App/frontend/src/components/ChatMessage.tsx, App/frontend/src/components/PortalCopilotCard.tsx"
      graph_approval_integrity: "ADR-0030: a graph approval names the SHA-256 digest of the action shown, is HMAC-sealed over thread, owner, tenant, time and action, expires after GRAPH_APPROVAL_TTL_S, and is claimed so it runs once (G468-G472)."
      controls: "Fail-closed spoken action confirmation (G177), explicit AI disclosure (G170), simulation headers (live=false), and transparent 5-locale CXP operating-hours disclosure (G174/G196). Only current completed replies offer workflow/portal actions; interrupted replies retain a warning without a grounding badge. Portal approval requires a local digest; unknown execution outcomes cannot appear successful (ADR-0018)."
      limitations: "Nothing in a page proves that an approval came from a person rather than an agent driving the browser, so a high-value approval is a checkbox, not proof of presence (G551, ADR-0038). Reviewed translations and manual accessibility acceptance remain UI-11 (G275). See docs/plans/browser-agent-assurance-2026-11-10.md and docs/plans/intelligent-ui-integration-audit-2026-10.md."
