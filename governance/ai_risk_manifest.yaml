# =============================================================================
# OWASP LLM Top 10 (2025 IDs — living registry still uses this numbering)
# 2026 edition (published 2026-08-04) remumbers several entries; see
# owasp_llm_2026_crosswalk below. Do not treat LLM06 here as 2026
# Unbounded Consumption.
# Reference (archive): https://owasp.org/www-project-top-10-for-large-language-model-applications/
# Current: https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/
# =============================================================================
owasp_llm:
  - id: "LLM01"
    name: "Prompt Injection"
    status: "mitigated"
    evidence: "App/backend/app/guardrails.py:InputGuard"
    controls: "Regex pattern detection, input length limits"
  - id: "LLM02"
    name: "Sensitive Information Disclosure"
    status: "mitigated"
    evidence: "App/backend/app/guardrails.py:OutputGuard.redact_pii(), App/backend/app/service.py (_state_conversation_id)"
    controls: "PII pattern redaction (UG phone, TIN, 14-character NIN (G247), email, CC); stated case facts, calculator memory and workflow state are read back only under the caller's owner-scoped key, never by conversation id alone (ADR-0013 A)"
    verified_by:
      - "tests/agents/test_nin_redaction.py"
  - id: "LLM03"
    name: "Supply Chain Vulnerabilities"
    status: "mitigated"
    evidence: ".github/workflows/security-trivy.yml (Trivy, CycloneDX SBOM), .github/workflows/ci-ml-pipeline.yml (SHA-pinned actions)"
    controls: "Dependency scanning, pinned versions, SBOM"
  - id: "LLM04"
    name: "Data and Model Poisoning"
    status: "mitigated"
    evidence: "ml/pipelines/validate_data.py, ml/scripts/data_aug/dedup.py"
    controls: "Data validation, deduplication, source allowlist"
  - id: "LLM05"
    name: "Improper Output Handling"
    status: "mitigated"
    evidence: "App/backend/app/guardrails.py:OutputGuard.sanitize(), App/frontend/src/components/Markdown.tsx"
    controls: "Backend HTML/script strip + PII redact; frontend Markdown is React nodes with an http(s)/mailto/tel URL allowlist (javascript: rejected)"
  - id: "LLM06"
    name: "Excessive Agency"
    status: "mitigated"
    evidence: "App/backend/app/mcp/policy.py, App/backend/app/flags.py, threat-model T28"
    controls: "MCP allowlist, unknown-tool errors without registry leak, bounded ReAct (one retrieve hop). FLAG_TOOL_USE / FLAG_AGENTIC_MODE / FLAG_TOOL_RAG default off. Calculators and workflows are deterministic, not model-chosen write actions."
  - id: "LLM07"
    name: "System Prompt Leakage"
    status: "mitigated"
    evidence: "App/backend/app/guardrails.py:InputGuard + OutputGuard.check_prompt_leakage()"
    controls: "Blocks reveal-prompt probes; scrubs signature phrases from replies. A system prompt IS used (llm.py) — confidentiality of that prompt is not treated as a security boundary (OWASP LLM08:2026 Hidden Context)."
  - id: "LLM08"
    name: "Vector and Embedding Weaknesses"
    status: "mitigated"
    evidence: "App/backend/app/indexer.py (trusted sources), App/backend/app/retriever.py (cross-encoder reranking)"
    controls: "Embeddings computed from trusted URA documents only. Cross-encoder reranking validates semantic relevance. INDEX_API_KEY required for re-indexing."
  - id: "LLM09"
    name: "Misinformation"
    status: "mitigated"
    evidence: "App/backend/app/guardrails.py:OutputGuard.check_grounding(), App/backend/app/premise_guard.py, App/backend/app/tools/portal_navigator_data.py"
    controls: "Runtime faithfulness scoring, low-confidence disclaimer, calibrated abstention; false-premise guard pinned for recall on fabricated taxes as well as precision on real ones (G244); declarative portal steps must cite corpus or ura.go.ug sources and link only to URA hosts (G246)"
    verified_by:
      - "tests/agents/test_premise_guard_recall.py"
      - "tests/agents/test_portal_knowledge_pack_integrity.py"
  - id: "LLM10"
    name: "Unbounded Consumption"
    status: "mitigated"
    evidence: "App/backend/app/main.py (INDEX_API_KEY auth), App/backend/app/models.py (input limits)"
    controls: "Input length capped at 2000 chars, top_k bounded 1-10, index endpoint requires auth token, request timeouts enforced"

# 2026-08-04 remumbering. Same controls; different official IDs.
# https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/README.md
owasp_llm_2026_crosswalk:
  edition: "OWASP GenAI LLM Top 10 2026"
  published: "2026-08-04"
  note: >
    Registry and owasp_llm[] above keep 2025 IDs so CI
    (validate_threats.py, compliance_check.py) stays stable. This table
    is the examiner-facing map to the current list.
  map:
    - from_2025: "LLM01 Prompt Injection"
      to_2026: "LLM01:2026 Prompt Injection"
      project_status: "mitigated"
    - from_2025: "LLM02 Sensitive Information Disclosure"
      to_2026: "LLM02:2026 Sensitive Information Disclosure"
      project_status: "mitigated"
    - from_2025: "LLM06 Excessive Agency"
      to_2026: "LLM03:2026 Excessive Agency"
      project_status: "mitigated (tools exist; flags default off; MCP allowlist)"
    - from_2025: "LLM03 Supply Chain"
      to_2026: "LLM04:2026 Supply Chain"
      project_status: "mitigated"
    - from_2025: "LLM04 Data and Model Poisoning"
      to_2026: "LLM05:2026 Data and Model Poisoning"
      project_status: "mitigated (PDF structural guards + hash manifest; no ClamAV)"
    - from_2025: "LLM10 Unbounded Consumption"
      to_2026: "LLM06:2026 Unbounded Consumption"
      project_status: "mitigated"
    - from_2025: "LLM09 Misinformation"
      to_2026: "LLM07:2026 Misinformation"
      project_status: "mitigated"
    - from_2025: "LLM07 System Prompt Leakage"
      to_2026: "LLM08:2026 Hidden Context Exposure"
      project_status: "partial — leakage scrub exists; prompt/tool schemas are not secrets; no credentials in prompts"
    - from_2025: "LLM08 Vector and Embedding Weaknesses"
      to_2026: "LLM09:2026 Vector and Embedding Weaknesses"
      project_status: "partial — trusted index + rerank + freshness hash; no embedding encryption/DP"
    - from_2025: "LLM05 Improper Output Handling"
      to_2026: "LLM10:2026 Improper Output Handling"
      project_status: "mitigated"

# =============================================================================
# EU AI Act Compliance (full applicability 2 Aug 2026)
# Reference: https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai
# =============================================================================
eu_ai_act:
  classification: "Limited risk (Art. 6 — not in Annex III high-risk list)"
  gpai_obligations: "N/A — system uses locally fine-tuned models, not a GPAI provider"
  transparency_obligations:
    - requirement: "Art. 50(1) — Users informed they are interacting with AI"
      status: "implemented"
      evidence: "App/frontend/ (UI branding as AI chatbot)"
    - requirement: "Art. 50(2) — AI-generated content marked"
      status: "partial"
      evidence: >
        App/backend/app/ai_disclosure.py — every synthesised WAV carries a RIFF INFO chunk
        with the IPTC digitalSourceType trainedAlgorithmicMedia (machine-readable metadata
        layer of the 2026 Code of Practice). Text replies name their model (ChatResponse.model).
      verified_by:
        - "App/backend/tests/test_observability_endpoints.py::test_marked_wav_keeps_its_audio"
      gap: >
        Non-WAV audio carries no marker: the MP3 from edge-tts (the English fallback after
        local TTS) and any non-WAV cloud TTS output (Sunbird, Workers AI) leave unmarked.
        No imperceptible audio watermark (the Code of Practice's second layer). Applies as a
        benchmark: the deployment is in Uganda.
  human_oversight:
    - requirement: "Human review channel available"
      status: "implemented"
      evidence: "App/backend/app/main.py (feedback endpoint)"
  risk_management:
    - requirement: "Risk management system proportionate to risk level"
      status: "implemented"
      evidence: "governance/ai_risk_manifest.yaml, governance/compliance_check.py"
  record_keeping:
    - requirement: "Logging of AI system operation (Art. 12-style traceability; ISO/IEC 42001 A.6.2.8)"
      status: "implemented"
      evidence: >
        App/backend/app/audit/turns.py — one hash-chained `generate` row per answer on every
        transport (REST, SSE, WebSocket, voice, calls) with sources, citation digests, build,
        prompt and corpus provenance; App/backend/app/audit/tsa.py — RFC 3161 timestamps on
        seals; structured logs with request and trace ids (App/backend/app/logging_config.py).
      verified_by:
        - "tests/test_observability_integration.py::test_rest_turn_is_audited_with_the_served_reply"
        - "tests/test_observability_integration.py::test_streamed_turn_is_audited_and_counted"
        - "App/backend/tests/test_audit_tsa.py::test_seal_is_timestamped_and_verified"

# =============================================================================
# DevSecOps Threat Modelling (2026 Industry Standard)
# Tools: pytm, Semgrep, Bandit, pip-audit, Checkov, OWASP ZAP, OSSF Scorecard
# =============================================================================
devsecops_threat_modelling:
  methodology:
    - framework: "STRIDE"
      tool: "pytm (Pythonic Threat Modeling)"
      status: "implemented"
      evidence: "threat-model/tm.py"
      description: >
        Automated threat model as code generating DFDs, STRIDE per-element
        threat analysis, and sequence diagrams from architecture definition.
    - framework: "OWASP LLM Top 10 (2025 IDs; 2026 crosswalk in this file)"
      tool: "Custom threat registry + Semgrep rules"
      status: "implemented"
      evidence: "threat-model/validate_threats.py, .semgrep/ura-chatbot-rules.yaml"
      description: >
        28 threats mapped to OWASP LLM 2025 categories with evidence-based
        mitigation validation in CI (10/10 LLM IDs; T21 accepted).
        2026 remumbering is documented in owasp_llm_2026_crosswalk.
    - framework: "MITRE ATLAS"
      tool: "Threat registry with ATLAS technique IDs"
      status: "implemented"
      evidence: "threat-model/validate_threats.py"
      description: >
        Adversarial ML threats mapped to MITRE ATLAS techniques (AML.T*)
        for alignment with industry threat intelligence.

  sast:
    - tool: "Semgrep v1.114+"
      type: "Multi-language SAST"
      status: "implemented"
      evidence: ".github/workflows/devsecops-sast-dast.yml, .semgrep/"
      languages: ["python", "typescript", "javascript"]
      rule_sets:
        - "Community: OWASP Top 10, security-audit, gitleaks, docker, supply-chain"
        - "Custom: LLM-specific rules (prompt injection, PII detection, output handling)"
        - "Custom: Uganda-specific PII rules (TIN, NIN)"
    - tool: "Bandit v1.8+"
      type: "Python SAST"
      status: "implemented"
      evidence: ".github/workflows/devsecops-sast-dast.yml, .bandit.yaml"
      focus: "AST-based analysis for Python security anti-patterns"

  sca:
    - tool: "pip-audit"
      type: "Python SCA"
      status: "implemented"
      evidence: ".github/workflows/devsecops-sast-dast.yml"
      description: "OSV/PyPI vulnerability database auditing for Python dependencies"
    - tool: "Trivy"
      type: "Multi-ecosystem SCA"
      status: "implemented"
      evidence: ".github/workflows/security-trivy.yml"

  dast:
    - tool: "OWASP ZAP v2.15+"
      type: "DAST baseline scan"
      status: "implemented"
      evidence: ".github/workflows/devsecops-sast-dast.yml, .zap-rules.tsv"
      description: >
        Automated baseline scan against live API in CI. Configured with
        custom rule severity (FAIL for XSS/SQLi, WARN for headers).

  iac_security:
    - tool: "Checkov"
      type: "IaC compliance"
      status: "implemented"
      evidence: ".github/workflows/devsecops-sast-dast.yml, .checkov.yaml"
      frameworks: ["Dockerfile", "GitHub Actions", "docker-compose"]
      benchmarks: ["CIS Docker", "NIST 800-190"]
    - tool: "Trivy config"
      type: "IaC misconfiguration"
      status: "implemented"
      evidence: ".github/workflows/security-trivy.yml"

  supply_chain:
    - tool: "OSSF Scorecard"
      type: "Supply chain scoring"
      status: "implemented"
      evidence: ".github/workflows/devsecops-sast-dast.yml"
      description: "OpenSSF supply chain security posture scoring"
    - tool: "SLSA v1.2 provenance + Sigstore keyless signing"
      status: "implemented"
      evidence: ".github/workflows/container-sign-provenance.yml, .github/workflows/ura-chatbot-build-push.yml (sign job)"
      description: "Signing and SLSA attestation run after each landwind/ura-chatbot push from dev, main or a v* tag (sign job); not yet a deployment gate, so a failed signing does not block rollout (G233a); the first run failed before signing (G238). cosign verify is pinned to this repository's signing workflow at those refs only (ADR-0011 A2, A9)"
    - tool: "zizmor + actionlint"
      type: "GitHub Actions static audit (template injection, credential persistence, dangerous triggers, unpinned images, Dependabot cooldown, impostor commits)"
      status: "implemented"
      evidence: ".github/workflows/actions-security.yml, tests/test_ci_supply_chain_policy.py"
    - tool: "Dependabot cooldown"
      type: "Dependency release-age gate"
      status: "implemented"
      evidence: ".github/dependabot.yml"
      description: "7-day cooldown on every ecosystem (30 for majors) before auto-mergeable version updates; security updates not delayed"

  pre_commit_hooks:
    - tool: "Semgrep"
      purpose: "SAST on staged changes"
      status: "implemented"
      evidence: ".pre-commit-config.yaml"
    - tool: "Bandit"
      purpose: "Python security lint on staged changes"
      status: "implemented"
      evidence: ".pre-commit-config.yaml"
    - tool: "TruffleHog + Gitleaks + detect-secrets + ggshield"
      purpose: "4-layer secret detection"
      status: "implemented"
      evidence: ".pre-commit-config.yaml, .github/workflows/secret-scanning.yml"

  threat_registry:
    total_threats: 28
    stride_coverage: "6/6 categories"
    owasp_llm_coverage: "10/10 (LLM06 → T28)"
    mitre_atlas_techniques: 10
    mitre_atlas_mappings: 19
    statuses:
      mitigated: 27
      accepted: 1
    validation: "CI gate in .github/workflows/devsecops-sast-dast.yml (threat-model job)"

# =============================================================================
# OWASP Top 10 for Agentic Applications 2026 (ASI01–ASI10) & AIBOM Inventory
# Reference: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
# =============================================================================
owasp_agentic_2026:
  edition: "OWASP Top 10 for Agentic Applications 2026"
  risks:
    - id: "ASI01"
      name: "Agent Goal Hijack"
      status: "mitigated"
      evidence: "App/backend/app/guardrails.py, App/backend/app/agents/supervisor.py"
      controls: "Cross-lingual prompt-injection & harmful-intent screening (en, lg, sw, nyn, ach) prior to supervisor routing and tool dispatch"
      verified_by:
        - "tests/agents/test_agentic_voice_2026_enhancements.py::test_phase41_trase_grounding_single_pass_retrieval_and_multilingual_guardrails"
    - id: "ASI02"
      name: "Tool Misuse and Exploitation"
      status: "mitigated"
      evidence: "App/backend/app/mcp/policy.py, App/backend/app/tools/__init__.py"
      controls: "Allow-listed ToolRegistry and MCP policy engine with per-tool risk tiers, required scopes, and bounded tool-call budgets"
      verified_by:
        - "App/backend/tests/test_mcp_policy.py"
    - id: "ASI03"
      name: "Identity and Privilege Abuse"
      status: "mitigated"
      evidence: "App/backend/app/auth.py, App/backend/app/main.py"
      controls: "Strict role separation (_require_live_officer, _desk_writer) ensuring only ura_staff handle live taxpayer queues/calls while admins/auditors are read/audit-only; guided-workflow state adopted on sign-in only from the anonymous session the request proves (compare-and-swap re-key), with signed-in state decided per request (ADR-0013); case facts, calculator memory and workflow lookups bound to the same owner-scoped key, with no bare-conversation-id fallback (ADR-0013 A)"
      verified_by:
        - "tests/agents/test_auth.py"
        - "tests/agents/test_journey_copilot_session_binding.py"
        - "tests/agents/test_conversation_state_owner_binding.py"
    - id: "ASI04"
      name: "Agentic Supply Chain"
      status: "mitigated"
      evidence: "governance/ai_risk_manifest.yaml, App/backend/app/mcp/client.py"
      controls: "Pinned model and dependency manifests (aibom_inventory), Mcp-Name verification, disabled dynamic remote MCP registration, SLSA/Trivy CI gates, SHA-pinned actions with zizmor/actionlint gate, digest-pinned base images, Dependabot cooldown, and Sigstore-signed images (ADR-0011)"
      verified_by:
        - "App/backend/tests/test_mcp_hardening.py"
        - "tests/agents/test_mcp_2026_october_audit.py"
        - "tests/test_ci_supply_chain_policy.py"
    - id: "ASI05"
      name: "Unexpected Code Execution (RCE)"
      status: "mitigated"
      evidence: "App/backend/app/documents.py, .bandit.yaml"
      controls: "No eval/exec tool execution; isolated subprocess document parsing (DOCUMENT_PARSE_ISOLATED) and PDF structural/malware guards"
      verified_by:
        - "App/backend/tests/test_pdf_guards.py"
    - id: "ASI06"
      name: "Memory and Context Poisoning"
      status: "mitigated"
      evidence: "App/backend/app/memory/service.py, App/backend/app/officer_handoff.py, App/backend/app/memory/procedural.py"
      controls: "Tenant- and user-scoped 4-tier cognitive memory, low-ASR-confidence memory write suppression, and _-prefixed internal workflow state exclusion (G171); procedural memory reaches prompts only through reviewed curated triggers, as an operating sequence with no legal citations, and recorded or imported trajectories are validated, PII-redacted, bounded and barred from curated ids (G245)"
      verified_by:
