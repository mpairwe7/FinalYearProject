# =============================================================================
# OWASP Top 10 for Agentic Applications 2026 (ASI01–ASI10) & AIBOM Inventory
# Reference: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
# =============================================================================
owasp_agentic_2026:
  edition: "OWASP Top 10 for Agentic Applications 2026"
  risks:
    - id: "ASI01"
      name: "Agent Goal Hijack"
      status: "mitigated"
      browser_agent_assurance: "ADR-0038: DOM telemetry from a page chooses nothing. A selector comes from the server's own map, a field name that is not an identifier is dropped, text is folded to one line, cleared of instruction phrases, the fence tag and untrusted links, and quoted in the reply as what the page shows (G545, G547). Limitation: the phrase screen is one layer and misses sentences it does not know (a Luganda row in the eval shows this); the structural rules do not depend on it."
      live_web_assurance: "ADR-0021: search control flow is decided from the question, not by the model, which has no search tool. Web text reaches the model only as labelled, spotlighted passages, never the prompt or verified_facts, and instruction-shaped results are dropped. Regex screening can be evaded; the boundary is what holds when it misses. ADR-0027: the passage body cannot close that spotlight, header fields cannot open a prompt section, and the cloud fallback uses the same fence."
      evidence: "App/backend/app/web_research.py, App/backend/app/llm.py, App/backend/app/guardrails.py, App/backend/app/service.py, App/backend/app/agents/supervisor.py"
      controls: "Cross-lingual prompt-injection & harmful-intent screening (en, lg, sw, nyn, ach) prior to supervisor routing and tool dispatch, on de-obfuscated and decoded views; directives addressed to an AI removed from passages, tool output and uploads (G460, G461); spotlight delimiter fence on every prompt path (G458) and on uploads (G463); answer links limited to trusted hosts (G462)"
      verified_by:
        - "tests/agents/test_browser_agent_assurance_2026_11.py::test_a_selector_sent_by_the_page_is_not_sent_back"
        - "tests/agents/test_browser_agent_assurance_2026_11.py::test_a_field_name_cannot_write_a_selector"
        - "tests/agents/test_browser_agent_assurance_2026_11.py::test_the_page_cannot_close_the_telemetry_fence"
        - "tests/agents/test_browser_agent_assurance_2026_11.py::test_a_link_on_the_page_is_not_passed_on"
        - "tests/agents/test_browser_agent_assurance_2026_11.py::test_page_text_is_shown_as_the_pages_words"
        - "tests/agents/test_portal_copilot_adversarial_eval.py"
        - "tests/agents/test_web_evidence_boundary.py"
        - "tests/agents/test_web_research_adversarial_eval.py"
        - "tests/agents/test_agentic_voice_2026_enhancements.py::test_phase41_trase_grounding_single_pass_retrieval_and_multilingual_guardrails"
        - "tests/agents/test_spotlight_fence.py"
        - "tests/agents/test_grok_pending_gap_closures.py"
        - "tests/agents/test_ai_security_layer_2026_11.py"
        - "tests/agents/test_web_research_integrity_2026_11.py"
        - "tests/agents/test_harness_prompt_contract.py"
        - "tests/agents/test_web_egress_2026_11.py"
      egress_assurance: "ADR-0035 (T43): every fetch on a turn (PDF sandbox, search providers, FX engine) goes through app/egress.py, which resolves a host once, requires every DNS answer to be publicly routable and connects to those validated addresses, so DNS rebinding cannot move a fetch to an internal address; default https port only; the one exception is the operator-configured SearXNG (SEARXNG_URL), which may resolve privately and use its own scheme and port, still pinned and counted, and no page- or result-supplied address is ever exempt; provider bodies capped before decompression allocates; markup stripping keeps chat-template tokens and results carry their raw text, both screened; every request counted by purpose, bounded host group and outcome. Scope: the backend web agents; the CI crawler is not yet on it (G533)."
    - id: "ASI02"
      name: "Tool Misuse and Exploitation"
      status: "mitigated"
      browser_agent_assurance: "ADR-0038: one approval runs a portal task once: a lease on the shared row, taken in one statement on SQLite and Postgres, decides which worker runs it, and a store that cannot be read or written refuses the decision (G542). Every dom_actions list leaves through harden_dom_actions: a click waits for the taxpayer, nothing targets a credential field, an unknown kind is dropped (G546). A lookup nobody confirmed is no longer recorded as confirmed, and the action is recorded under the caller's tenant (G544)."
      control_integrity: "ADR-0022: a tool's declared tier is the floor of the autonomy gate, a gate that cannot decide fails closed, a refusal does not depend on its record, and every call is recorded as what actually happened, including failures (G333, G334, G336, G337). ADR-0028: when enabled, high/critical actions require a durable intent row before execution, and reasoner/T1 fallback share a single tool budget (G366, G368). Calls with effects run one at a time. Limitation: intent_confidence is a constant, so the 0.80 floor is inert (G361)."
      live_web_assurance: "ADR-0021: planned tools run under ToolCallBudget and a wall-clock deadline; the route decision binds REST as well as SSE (G309)."
      evidence: "App/backend/app/scenario_planner.py, App/backend/app/mcp/policy.py, App/backend/app/mcp/mrtr.py, App/backend/app/mcp/validation.py, App/backend/app/portal_copilot.py, App/backend/app/tools/__init__.py"
      controls: "Allow-listed ToolRegistry and MCP policy engine with per-tool risk tiers, required scopes, context-bound HMAC-SHA256 requestState (_binding), user-scoped idempotency conflict detection, pre-authz schema coercion, 4-tier portal task policy engine (ADR-0014, ADR-0015), and bounded tool-call budgets"
      verified_by:
        - "tests/agents/test_browser_agent_assurance_2026_11.py::test_a_tier_that_reads_holds_only_tools_that_read"
        - "tests/agents/test_browser_agent_assurance_2026_11.py::test_an_edit_retires_the_proposal_it_replaces"
