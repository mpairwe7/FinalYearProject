        - "tests/agents/test_mcp_2026_october_audit.py"
        - "tests/test_ci_supply_chain_policy.py"
    - id: "ASI05"
      name: "Unexpected Code Execution (RCE)"
      status: "mitigated"
      evidence: "App/backend/app/documents.py, App/backend/app/document_worker.py, App/backend/app/ephemeral_pdf_sandbox.py, App/backend/app/tax/schedule_sandbox.py, .bandit.yaml"
      controls: "No eval/exec tool execution; isolated subprocess document parsing (DOCUMENT_PARSE_ISOLATED, document_worker.py with secret env scrubbing, POSIX RLIMITs, SIGKILL escalation, and parent-process pure-Python PDF pre-checks; ephemeral_pdf_sandbox.py — ADR-0008, ADR-0024), capability-restricted Decimal AST schedule sandbox (schedule_sandbox.py), and PDF structural/malware guards"
      verified_by:
