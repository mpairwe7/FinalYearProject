# =============================================================================
# AI Risk Manifest — NIST AI RMF 1.0 + ISO/IEC 42001:2023 + EU AI Act
# URA AI Chatbot — Retrieval-Augmented Generation System
# Updated: 2026-11-12 (one call process addendum, ADR-0043)
# =============================================================================

system:
  name: "URA AI Chatbot"
  version: "2.0.0"
  classification: "Limited-risk AI system (EU AI Act Art. 6)"
  description: >
    Customer-facing chatbot for Uganda Revenue Authority (URA) that answers
    tax-related and cross-agency Non-Tax Revenue (NTR) questions using
    retrieval-augmented generation over official URA documents, Parliamentary
    Tax Bills (FY2026-27), ULII statutes, 10 Ugandan MDA fee schedules
    (186 PDFs, 5,639 chunks, 7,251 Qdrant hybrid vectors — ADR-0008/ADR-0009),
    72 deterministic MCP 2026-07-28 tools across 18 namespaces, and 21 guided
    taxpayer journeys (ADR-0010).
  intended_users: "URA taxpayers, tax agents, general public"
  deployment_regions: ["UG"]
  languages: ["en", "lg", "sw", "nyn", "ach"]

# =============================================================================
# NIST AI RMF 1.0 + Generative AI Profile
# Reference: https://www.nist.gov/artificial-intelligence/ai-risk-management-framework
# =============================================================================
nist_ai_rmf:
  govern:
    - control: "GOVERN 1.1 – Legal and regulatory requirements identified"
      status: "implemented"
      evidence: "governance/ai_risk_manifest.yaml"
    - control: "GOVERN 1.2 – Trustworthy AI characteristics prioritised"
      status: "implemented"
      evidence: "SECURITY.md, App/backend/app/guardrails.py"
    - control: "GOVERN 2.1 – Roles and responsibilities defined"
      status: "implemented"
      evidence: "CODEOWNERS"
    - control: "GOVERN 4.1 – Organisational practices for AI risk"
      status: "implemented"
      evidence: ".github/workflows/ci-ml-pipeline.yml (quality gates)"
    - control: "GOVERN 6.1 – Policies for GAI content provenance"
      status: "implemented"
      evidence: "App/backend/app/retriever.py (citations), App/backend/app/guardrails.py (grounding)"

  map:
    - control: "MAP 1.1 – Intended purpose documented"
      status: "implemented"
      evidence: "docs/API_REFERENCE.md, governance/ai_risk_manifest.yaml"
    - control: "MAP 1.6 – System interactions mapped"
      status: "implemented"
      evidence: "docs/data-schema-and-eval.md"
    - control: "MAP 2.1 – Known limitations documented"
      status: "implemented"
      evidence: "App/backend/app/guardrails.py (low-faithfulness disclaimer)"
    - control: "MAP 5.1 – GAI-specific risks (hallucination, CBRN) assessed"
      status: "implemented"
      evidence: "App/backend/app/guardrails.py (LLM09 grounding check)"

  measure:
    - control: "MEASURE 1.1 – Appropriate methods and metrics identified"
      status: "implemented"
      evidence: "ml/pipelines/evaluate_rag.py, ml/pipelines/corpus_coverage.py"
    - control: "MEASURE 2.1 – AI system evaluated using test sets"
      status: "implemented"
      evidence: "tests/test_api.py, tests/test_ml_pipeline.py, Results/"
    - control: "MEASURE 2.5 – Acquired components assessed"
      status: "implemented"
      evidence: "requirements.txt (pinned), .github/workflows/security-trivy.yml (Trivy), .github/workflows/ci-ml-pipeline.yml"
    - control: "MEASURE 2.6 – Computational bias assessment"
      status: "partial"
      evidence: "scripts/bias_fairness_audit.py (language + taxpayer type parity)"
      gap: "Formal fairness report needed for demographic groups"
    - control: "MEASURE 4.1 – Measurement approaches applied regularly"
      status: "implemented"
      evidence: >
        .github/workflows/ci-ml-pipeline.yml — the production gate is blocking and fails
        a regression past ml/configs/quality_baseline.json; App/backend/app/main.py runs the
        online evaluation every ONLINE_EVAL_INTERVAL_SECONDS (ura_eval_metric_passed, alert
        UraEvalRegression).
      verified_by:
        - "tests/test_ml_pipeline.py::test_regression_below_baseline_fails_even_above_the_floor"
        - "monitoring/tests/alerting-rules.test.yml"

  manage:
    - control: "MANAGE 1.1 – Deployment approval with risk review"
      status: "implemented"
      evidence: "ml/pipelines/quality_gates.py, ml/pipelines/evaluate_rag.py"
    - control: "MANAGE 2.1 – Mechanisms for human oversight"
      status: "implemented"
      evidence: "App/backend/app/main.py (feedback endpoint), App/backend/app/database.py"
    - control: "MANAGE 3.1 – Incidents logged and responded to"
      status: "implemented"
      evidence: >
        monitoring/alerting-rules.yml routed by monitoring/alertmanager.yml; security events
        (App/backend/app/security_events.py); incident playbooks in docs/MONITORING.md §10.
      verified_by:
        - "App/backend/tests/test_observability_endpoints.py::test_denied_metrics_scrape_is_a_logged_counted_event"
        - "tests/test_monitoring_config.py::test_alerts_are_routable_and_actionable"
    - control: "MANAGE 4.1 – Post-deployment monitoring, incident response and decommissioning"
      status: "partial"
      evidence: >
        SLOs (monitoring/slo/ura-chatbot.openslo.yaml), burn-rate alerts, Grafana dashboard,
        real-user monitoring (/v1/telemetry/*), docs/MONITORING.md. Containerised, can be stopped.
      verified_by:
        - "tests/test_monitoring_config.py::test_slo_objectives_match_the_burn_rate_rules"
        - "tests/test_observability_integration.py::test_streamed_turn_is_audited_and_counted"
        - "tests/agents/test_turn_terminal_contract.py"
      gap: "Formal decommission runbook"

