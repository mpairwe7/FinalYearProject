# =============================================================================
# AI Risk Manifest — NIST AI RMF 1.0 + ISO/IEC 42001:2023 + EU AI Act
# URA AI Chatbot — Retrieval-Augmented Generation System
# Updated: 2026-08-17
# =============================================================================

system:
  name: "URA AI Chatbot"
  version: "2.0.0"
  classification: "Limited-risk AI system (EU AI Act Art. 6)"
  description: >
    Customer-facing chatbot for Uganda Revenue Authority (URA) that answers
    tax-related questions using retrieval-augmented generation over official
    URA documents, FAQ databases, and taxation handbooks.
  intended_users: "URA taxpayers, tax agents, general public"
  deployment_regions: ["UG"]
  languages: ["en", "lg"]

