# =============================================================================
# OWASP LLM Top 10 (2025 IDs — living registry still uses this numbering)
# 2026 edition (published 2026-08-04) remumbers several entries; see
# owasp_llm_2026_crosswalk below. Do not treat LLM06 here as 2026
# Unbounded Consumption.
# Reference (archive): https://owasp.org/www-project-top-10-for-large-language-model-applications/
# Current: https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/
# =============================================================================
owasp_llm:
  - id: "LLM01"
    name: "Prompt Injection"
    status: "mitigated"
    evidence: "App/backend/app/guardrails.py:InputGuard, App/backend/app/guardrails.py:scan_retrieved_text, App/backend/app/guard_friction.py, App/backend/app/service.py:_guard_both_forms"
    controls: "Patterns matched on raw, canonical, de-obfuscated (leetspeak, spaced letters, typoglycemia) and decoded (Base64, hex, ROT13) views; verb-by-target override, persona-swap and prompt-extraction rules that require an assistant-addressed target (G460); directives addressed to an AI in third-party text removed to the end of their line (G461); upload fence shares the passage-fence normalization (G463); a principal tripping the guard 5 times in 10 minutes is paused (G464); input length limits. ADR-0029."
    limitations: "Recognition is bypassable by an adaptive attacker (arXiv:2510.09023); the spotlight fences, output guards and tool tiers are the controls that hold. No prompt-injection classifier model is deployed. Strike state is per replica."
    verified_by:
      - "tests/agents/test_ai_security_layer_2026_11.py"
      - "App/backend/tests/test_redteam_corpus.py"
      - "tests/agents/test_spotlight_fence.py"
  - id: "LLM02"
    name: "Sensitive Information Disclosure"
    status: "mitigated"
    evidence: "App/backend/app/guardrails.py:OutputGuard.redact_pii(), App/backend/app/service.py (_state_conversation_id)"
    controls: "PII pattern redaction (UG phone, TIN, 14-character NIN (G247), email, CC); stated case facts, calculator memory and workflow state are read back only under the caller's owner-scoped key, never by conversation id alone (ADR-0013 A)"
    verified_by:
      - "tests/agents/test_nin_redaction.py"
      - "tests/agents/test_kernel_core_2026_11.py"
      - "tests/agents/test_kernel_advanced_2026_11.py"
  - id: "LLM03"
    name: "Supply Chain Vulnerabilities"
    status: "mitigated"
    evidence: ".github/workflows/security-trivy.yml (Trivy, CycloneDX SBOM), .github/workflows/ci-ml-pipeline.yml (SHA-pinned actions)"
    controls: "Dependency scanning, pinned versions, SBOM"
  - id: "LLM04"
    name: "Data and Model Poisoning"
    status: "mitigated"
    evidence: "ml/pipelines/validate_data.py, ml/scripts/data_aug/dedup.py"
    controls: "Data validation, deduplication, source allowlist"
  - id: "LLM05"
    name: "Improper Output Handling"
    status: "mitigated"
    evidence: "App/backend/app/guardrails.py:OutputGuard.sanitize(), App/frontend/src/components/Markdown.tsx, App/frontend/src/lib/safeUrl.ts, App/frontend/src/lib/turnMeta.ts"
    controls: "Backend HTML/script strip + PII redact; link provenance: every URL in an answer whose parsed host is not *.go.ug, a Tier-1 research host, a corpus host or OUTPUT_LINK_ALLOWED_HOSTS is de-linked, identifiers are dropped from trusted queries, and the final reply is re-checked with any removal sent as a revision (G462, ADR-0029); frontend Markdown is React nodes with an http(s)/mailto/tel URL allowlist (javascript: rejected). Structured source URLs are parsed; portal action links require HTTPS URA domains. Invalid/withdrawn grounding scores and evidence are cleared (ADR-0018)."
    limitations: "Full nested workflow, portal and persisted-history schemas remain open (UI-08 in docs/plans/intelligent-ui-integration-audit-2026-10.md)."
    verified_by:
      - "App/frontend/src/__tests__/lib/safeUrl.test.ts"
      - "App/frontend/src/__tests__/lib/turnMeta.test.ts"
      - "App/frontend/src/__tests__/components/Markdown.test.tsx"
      - "App/frontend/src/__tests__/components/Markdown.links.test.tsx"
      - "App/backend/tests/test_output_guard.py"
      - "tests/agents/test_ai_security_layer_2026_11.py"
      - "tests/agents/test_kernel_advanced_2026_11.py"
  - id: "LLM06"
    name: "Excessive Agency"
    status: "mitigated"
    evidence: "App/backend/app/mcp/policy.py, App/backend/app/flags.py, threat-model T28"
    controls: "MCP allowlist, unknown-tool errors without registry leak, bounded ReAct (one retrieve hop). FLAG_TOOL_USE / FLAG_AGENTIC_MODE / FLAG_TOOL_RAG default off. Calculators and workflows are deterministic, not model-chosen write actions."
  - id: "LLM07"
    name: "System Prompt Leakage"
    status: "mitigated"
    evidence: "App/backend/app/guardrails.py:InputGuard + OutputGuard.check_prompt_leakage()"
    controls: "Blocks reveal-prompt and extraction probes; scrubs signature phrases that a test keeps in sync with the live prompts, and flags a reply sharing two word 8-grams with llm.SYSTEM_PROMPT outside its sanctioned refusal/contact text (G465, ADR-0029). A system prompt IS used (llm.py) — confidentiality of that prompt is not treated as a security boundary (OWASP LLM08:2026 Hidden Context)."
    verified_by:
      - "tests/agents/test_ai_security_layer_2026_11.py"
      - "App/backend/tests/test_output_guard.py"
  - id: "LLM08"
    name: "Vector and Embedding Weaknesses"
    status: "mitigated"
    evidence: "App/backend/app/indexer.py (trusted sources, payload indexes), App/backend/app/retriever.py (cross-encoder reranking, exact tombstones, in-force editions), App/backend/app/cache.py (generation-keyed semantic cache), App/backend/app/index_lifecycle.py (staged /v1/index)"
    controls: "Embeddings computed from trusted URA documents only. Cross-encoder reranking validates semantic relevance; gates read the calibrated score, never ranking boosts (G284). INDEX_API_KEY required for re-indexing, which runs the staged lifecycle with a canary gate and atomic alias swap (G286). Cached answers are keyed on the index stamp, bound corpus, tombstone digest and fiscal year, and a hit needs the same question terms (G277). Tombstones withdraw exact documents and survive store outages (G279)."
    limitations: "Ingested PDFs carry no per-chunk signature, and a running retriever does not re-bind after an alias swap (G292); valid-from/valid-to versioning is not modelled (G294)."
    verified_by:
      - "App/backend/tests/test_cache_generation_and_guard.py"
      - "App/backend/tests/test_retrieval_temporal_and_tombstones.py"
      - "App/backend/tests/test_retrieval_gates_and_merge.py"
  - id: "LLM09"
    name: "Misinformation"
    status: "mitigated"
    evidence: "App/backend/app/guardrails.py:OutputGuard.check_grounding(), App/backend/app/premise_guard.py, App/backend/app/tools/portal_navigator_data.py"
    controls: "Runtime faithfulness scoring, low-confidence disclaimer, calibrated abstention; false-premise guard pinned for recall on fabricated taxes as well as precision on real ones (G244); declarative portal steps must cite corpus or ura.go.ug sources and link only to URA hosts (G246); the query rewriter never 'corrects' a corpus word (G282); passages name their edition and the model prefers the one in force (G278, G287); a passage stating a figure the rate table records as replaced is left out on every retrieval path, and an unresolved disagreement is disclosed with both figures (G534, G535); what the taxpayer sees follows the verdicts: badges follow the judge's confidence band, a table answer using an unverified or provisional figure is `medium` and says so, the browser keeps the server's closing disclosures, a stream abstention withdraws its early sources, the offline page gives no figure, machine-read document totals are labelled as such (G618–G624, ADR-0048)"
    limitations: "A wrong figure in the question is exempt from contradiction (G288) and a money amount in the message approves unsupported claims (G289). The replaced-figure screen fails open: if it raises, passages pass unscreened with a logged warning, and only the corrected corpus stands between a replaced figure and the answer (G535)."
    verified_by:
      - "tests/agents/test_premise_guard_recall.py"
      - "tests/agents/test_portal_knowledge_pack_integrity.py"
      - "App/backend/tests/test_query_spelling_corpus_guard.py"
      - "App/backend/tests/test_retrieval_temporal_and_tombstones.py"
      - "tests/agents/test_statutory_kernel_2026_11.py"
      - "tests/agents/test_kernel_core_2026_11.py"
      - "tests/agents/test_rate_table_verification_2026_11.py"
      - "tests/agents/test_kernel_freshness_2026_11.py"
      - "tests/agents/test_kernel_review_fixes_2026_11.py"
      - "tests/agents/test_kernel_precedence_superseded_2026_11.py"
      - "tests/agents/test_kernel_former_value_screen_2026_11.py"
      - "App/backend/tests/test_figure_confirmation_signals.py"
      - "App/backend/tests/test_deterministic_streaming_parity.py"
      - "App/frontend/src/__tests__/store/cleanResponse.test.ts"
      - "App/frontend/src/__tests__/public/offlinePortal.test.ts"
      - "App/frontend/src/__tests__/components/ChatMessage.test.tsx"
  - id: "LLM10"
    name: "Unbounded Consumption"
    status: "mitigated"
    evidence: "App/backend/app/main.py (INDEX_API_KEY auth, slowapi), App/backend/app/models.py (input limits), App/backend/app/guard_friction.py"
    controls: "Input length capped at 2000 chars, top_k bounded 1-10, index endpoint requires auth token, request timeouts enforced, per-IP rate limits, and a per-principal cool-down after repeated guard refusals that answers without a model call (G464)"
    verified_by:
      - "tests/agents/test_ai_security_layer_2026_11.py"
      - "App/backend/tests/test_flag_rollout.py"

# 2026-08-04 remumbering. Same controls; different official IDs.
# https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/README.md
owasp_llm_2026_crosswalk:
  edition: "OWASP GenAI LLM Top 10 2026"
  published: "2026-08-04"
  note: >
    Registry and owasp_llm[] above keep 2025 IDs so CI
    (validate_threats.py, compliance_check.py) stays stable. This table
    is the examiner-facing map to the current list.
  map:
    - from_2025: "LLM01 Prompt Injection"
      to_2026: "LLM01:2026 Prompt Injection"
      project_status: "mitigated"
    - from_2025: "LLM02 Sensitive Information Disclosure"
      to_2026: "LLM02:2026 Sensitive Information Disclosure"
      project_status: "mitigated"
    - from_2025: "LLM06 Excessive Agency"
      to_2026: "LLM03:2026 Excessive Agency"
      project_status: "mitigated (tools exist; flags default off; MCP allowlist)"
    - from_2025: "LLM03 Supply Chain"
      to_2026: "LLM04:2026 Supply Chain"
      project_status: "mitigated"
    - from_2025: "LLM04 Data and Model Poisoning"
      to_2026: "LLM05:2026 Data and Model Poisoning"
      project_status: "mitigated (PDF structural guards + hash manifest; no ClamAV)"
    - from_2025: "LLM10 Unbounded Consumption"
      to_2026: "LLM06:2026 Unbounded Consumption"
      project_status: "mitigated"
    - from_2025: "LLM09 Misinformation"
      to_2026: "LLM07:2026 Misinformation"
      project_status: "mitigated"
    - from_2025: "LLM07 System Prompt Leakage"
      to_2026: "LLM08:2026 Hidden Context Exposure"
      project_status: "partial — signature + prompt-fingerprint leakage scrub (G465); prompt/tool schemas are not secrets; no credentials in prompts"
    - from_2025: "LLM08 Vector and Embedding Weaknesses"
      to_2026: "LLM09:2026 Vector and Embedding Weaknesses"
      project_status: "partial — trusted index + rerank + freshness hash; no embedding encryption/DP"
    - from_2025: "LLM05 Improper Output Handling"
      to_2026: "LLM10:2026 Improper Output Handling"
      project_status: "mitigated"

# =============================================================================
# EU AI Act Compliance. An engineering reference: the Act does not bind URA.
# Annex III high-risk obligations moved from 2 Aug 2026 to 2 Dec 2027 under the
# Digital Omnibus on AI (Regulation (EU) 2026/1744). Source: Orrick, 29 Jul 2026,
# a secondary source; the Official Journal text could not be read on 2026-10-31.
# Reference: https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai
# =============================================================================
eu_ai_act:
  classification: "Limited risk (Art. 6 — not in Annex III high-risk list)"
  gpai_obligations: "N/A — system uses locally fine-tuned models, not a GPAI provider"
  transparency_obligations:
    - requirement: "Art. 50(1) — Users informed they are interacting with AI"
      status: "implemented"
      evidence: "App/frontend/ (UI branding as AI chatbot)"
    - requirement: "Art. 50(2) — AI-generated content marked"
      status: "partial"
      evidence: >
        App/backend/app/ai_disclosure.py — every synthesised WAV carries a RIFF INFO chunk
        with the IPTC digitalSourceType trainedAlgorithmicMedia (machine-readable metadata
        layer of the 2026 Code of Practice). Text replies name their model (ChatResponse.model).
      verified_by:
        - "App/backend/tests/test_observability_endpoints.py::test_marked_wav_keeps_its_audio"
      gap: >
        Non-WAV audio carries no marker: the MP3 from edge-tts (the English fallback after
        local TTS) and any non-WAV cloud TTS output (Sunbird, Workers AI) leave unmarked.
        No imperceptible audio watermark (the Code of Practice's second layer). Applies as a
        benchmark: the deployment is in Uganda.
  human_oversight:
    - requirement: "Human review channel available"
      status: "implemented"
      evidence: "App/backend/app/main.py (feedback endpoint)"
  risk_management:
    - requirement: "Risk management system proportionate to risk level"
      status: "implemented"
      evidence: "governance/ai_risk_manifest.yaml, governance/compliance_check.py"
  record_keeping:
    - requirement: "Logging of AI system operation (Art. 12-style traceability; ISO/IEC 42001 A.6.2.8)"
      status: "implemented"
      evidence: >
        App/backend/app/audit/turns.py — one hash-chained `generate` row per turn on every
        transport (REST, SSE, WebSocket, voice, calls), including turns that failed or were
        cut short, with a disposition, what generated the reply, sources, citation digests,
        build, prompt and corpus provenance; App/backend/app/audit/tsa.py — RFC 3161 timestamps on
        seals; structured logs with request and trace ids (App/backend/app/logging_config.py).
      verified_by:
        - "tests/test_observability_integration.py::test_rest_turn_is_audited_with_the_served_reply"
        - "tests/test_observability_integration.py::test_streamed_turn_is_audited_and_counted"
        - "tests/agents/test_turn_terminal_contract.py"
        - "App/backend/tests/test_audit_tsa.py::test_seal_is_timestamped_and_verified"

# =============================================================================
# DevSecOps Threat Modelling (2026 Industry Standard)
# Tools: pytm, Semgrep, Bandit, pip-audit, Checkov, OWASP ZAP, OSSF Scorecard
# =============================================================================
devsecops_threat_modelling:
  methodology:
    - framework: "STRIDE"
      tool: "pytm (Pythonic Threat Modeling)"
      status: "implemented"
      evidence: "threat-model/tm.py"
      description: >
        Automated threat model as code generating DFDs, STRIDE per-element
        threat analysis, and sequence diagrams from architecture definition.
    - framework: "OWASP LLM Top 10 (2025 IDs; 2026 crosswalk in this file)"
      tool: "Custom threat registry + Semgrep rules"
      status: "implemented"
      evidence: "threat-model/validate_threats.py, .semgrep/ura-chatbot-rules.yaml"
      description: >
        45 threats mapped to OWASP LLM 2025 categories with evidence-based
        mitigation validation in CI (10/10 LLM IDs; T21 accepted).
        2026 remumbering is documented in owasp_llm_2026_crosswalk.
    - framework: "MITRE ATLAS"
      tool: "Threat registry with ATLAS technique IDs"
      status: "implemented"
      evidence: "threat-model/validate_threats.py"
      description: >
        Adversarial ML threats mapped to MITRE ATLAS techniques (AML.T*)
        for alignment with industry threat intelligence.

  sast:
    - tool: "Semgrep v1.114+"
      type: "Multi-language SAST"
      status: "implemented"
      evidence: ".github/workflows/devsecops-sast-dast.yml, .semgrep/"
      languages: ["python", "typescript", "javascript"]
      rule_sets:
        - "Community: OWASP Top 10, security-audit, gitleaks, docker, supply-chain"
        - "Custom: LLM-specific rules (prompt injection, PII detection, output handling)"
        - "Custom: Uganda-specific PII rules (TIN, NIN)"
    - tool: "Bandit v1.8+"
      type: "Python SAST"
      status: "implemented"
      evidence: ".github/workflows/devsecops-sast-dast.yml, .bandit.yaml"
      focus: "AST-based analysis for Python security anti-patterns"

  sca:
    - tool: "pip-audit"
      type: "Python SCA"
      status: "implemented"
      evidence: ".github/workflows/devsecops-sast-dast.yml"
      description: "OSV/PyPI vulnerability database auditing for Python dependencies"
    - tool: "Trivy"
      type: "Multi-ecosystem SCA"
      status: "implemented"
      evidence: ".github/workflows/security-trivy.yml"

  dast:
    - tool: "OWASP ZAP v2.15+"
      type: "DAST baseline scan"
      status: "implemented"
      evidence: ".github/workflows/devsecops-sast-dast.yml, .zap-rules.tsv"
      description: >
        Automated baseline scan against live API in CI. Configured with
        custom rule severity (FAIL for XSS/SQLi, WARN for headers).

  iac_security:
    - tool: "Checkov"
      type: "IaC compliance"
      status: "implemented"
      evidence: ".github/workflows/devsecops-sast-dast.yml, .checkov.yaml"
      frameworks: ["Dockerfile", "GitHub Actions", "docker-compose"]
      benchmarks: ["CIS Docker", "NIST 800-190"]
    - tool: "Trivy config"
      type: "IaC misconfiguration"
      status: "implemented"
      evidence: ".github/workflows/security-trivy.yml"

  supply_chain:
    - tool: "OSSF Scorecard"
      type: "Supply chain scoring"
      status: "implemented"
