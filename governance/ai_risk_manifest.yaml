        - "tests/agents/test_portal_copilot.py"
    - id: "ASI03"
      name: "Identity and Privilege Abuse"
      status: "mitigated"
      browser_agent_assurance: "ADR-0038: a portal account task is refused unless the sign-in is bound to the TIN it names; the check used to pass any sign-in whose subject was not a TIN and was not applied to signed-in writes (G557). The consent a task names and the roles its tool allows are checked before it runs. The public TIN lookup returns public fields only (G558). Limitation: an identity provider's subject carries no verified TIN, so real sign-ins are refused account tasks until it issues one (G565)."
      control_integrity: "ADR-0022: an identifier never binds from a tool's output, a suspended thread can only be resumed by its owner, and tickets keep their tenant (G339, G352, G355). ADR-0028: staff ticket reads, writes, lists, aggregates, and live event delivery are constrained to the authenticated tenant when multi_tenant is enabled (G362)."
      receptionist_assurance: "ADR-0020: revoke media before requeue, terminate on revocation failure; preserve tenant on wrap-up tickets. Self-hosted token replay remains G303; session expiry remains G304."
      call_handoff_assurance: "ADR-0039: a call transfer's ticket is created in the caller's tenant (it fell back to 'default', G571); a call passed to a named officer can be claimed only by that officer until the reservation lapses, enforced in the room and in the claim's conditional update (G580)."
      call_records_assurance: "ADR-0040: a call's wrap-up is accepted only from an officer who handled it, once they are off it (G305); officer presence, its board, its staffing count and its lobby event are scoped to the tenant, and a lobby event that names no tenant reaches no tenant-scoped console (G584); staff sockets close when the token that opened them expires and are admitted under per-user caps (G304)."
      session_revocation_assurance: "ADR-0053: a session can be revoked before its token expires (G304). `revoked_sessions` keeps one cutoff per person; every process reads it before it serves (in production an unreadable store refuses to start) and re-reads it every 5 s; a token whose iat is before it gets 401 'session revoked' on the API, is refused at socket sign-in, and closes an open staff, chat or voice socket or a signed-in caller's call (4401) within about 10 s (up to 5 s for another process's sync plus up to 5 s for the socket's check; about 5 s on the process that took it); a revoked officer's LiveKit media is revoked at once and refused if it rejoins. A token with no usable iat is refused as invalid, so every accepted token can be revoked. POST /v1/me/logout (sign out everywhere, called by the browser's sign-outs) and POST /v1/admin/users/{user_id}/revoke (ura_admin) are audited. Limits (G656): an open live ticket stream is not closed; the MCP server's bearer check does not read the list; the identity provider's session is not ended by an administrator's revocation. The admin route takes either id /v1/me shows: an internal user id is resolved to its sub, and the answer and audit name the sub revoked (ADR-0055, G657)."
      call_startup_assurance: "ADR-0041: a call-drop resume ticket is signed only with RECEPTIONIST_RESUME_SECRET in production, never the development secret (G599); a receptionist flag switched on at runtime is held to the same production engine checks as one set in the environment (G597); the LiveKit signer uses the credentials as the gate validated them (G600). Resume tickets are single-use within one process only; a full list of used tickets refuses new resumes rather than forgetting one."
      evidence: "App/backend/app/auth.py, App/backend/app/main.py"
      controls: "Strict role separation (_require_live_officer, _desk_writer) ensuring only ura_staff handle live taxpayer queues/calls while admins/auditors are read/audit-only; guided-workflow state adopted on sign-in only from the anonymous session the request proves (compare-and-swap re-key), with signed-in state decided per request (ADR-0013); case facts, calculator memory and workflow lookups bound to the same owner-scoped key, with no bare-conversation-id fallback (ADR-0013 A)"
      verified_by:
        - "tests/agents/test_browser_agent_assurance_2026_11.py::test_a_sign_in_with_no_tin_is_bound_to_no_account"
        - "tests/agents/test_browser_agent_assurance_2026_11.py::test_a_signed_in_write_is_refused_for_another_taxpayers_tin"
