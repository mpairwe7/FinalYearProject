        - "tests/agents/test_ephemeral_pdf_sandbox.py"
        - "tests/agents/test_agentic_rag_context_sandbox_2026_11.py"
        - "tests/agents/test_november_2026_gap_closures.py"
        - "tests/agents/test_phase43_agentic_tools_hardening.py"
    - id: "ASI06"
      name: "Memory & Context Poisoning"
      status: "mitigated"
      crawl_write_path: "ADR-0023: every crawl write to the corpus is validated before commit and merged by a person. Only the publisher's live https site qualifies; hidden markup is stripped and instruction-bearing pages quarantined; a mass rewrite, removal or rollback holds the run; a page unverified for 45 days expires, measured from the last complete crawl; and older never replaces newer. G331, the live-sync path, stays off in production because it would bypass this gate."
      live_web_assurance: "ADR-0021: time-sensitive turns neither read nor write the semantic cache. auto_qdrant_web_sync can change the corpus from a user turn, and a compose overlay defaults it on, so production also requires WEB_SYNC_PRODUCTION_APPROVED. Outside production the flag alone suffices. A human review step for each change remains open (G331)."
      evidence: "App/backend/app/web_research.py, App/backend/app/memory/service.py, App/backend/app/officer_handoff.py, App/backend/app/memory/procedural.py"
      controls: "Tenant- and user-scoped 4-tier cognitive memory, low-ASR-confidence memory write suppression, and _-prefixed internal workflow state exclusion (G171); procedural memory reaches prompts only through reviewed curated triggers, as an operating sequence with no legal citations, and recorded or imported trajectories are validated, PII-redacted, bounded and barred from curated ids (G245)"
      verified_by:
        - "tests/agents/test_live_research_planning.py"
        - "tests/agents/test_web_research_integrity_2026_11.py"
        - "App/backend/tests/test_memory_lifecycle.py"
        - "App/backend/tests/test_mcp_2026_october_audit_and_corpus.py"
        - "tests/agents/test_procedural_memory_safety.py"
        - "tests/test_crawler.py"
        - "tests/test_crawl_gate.py"
        - "App/backend/tests/test_crawl_corpus.py"
    - id: "ASI07"
      name: "Insecure Inter-Agent Communication"
      status: "mitigated"
      evidence: "App/backend/app/agents/graphs/main_graph.py, App/backend/app/memory/resolution_ledger.py, App/backend/app/mcp/auth.py, App/backend/app/mcp/transport.py"
      controls: "Typed AgentGraphState and HandoffEnvelope v2.1 schema validation across specialist nodes (CUSTOMS_SPECIALIST, TAX_SPECIALIST, TOOLS), failed-observation pruning across specialist handoffs, and RFC 8693 OBO + RFC 8707 audience-bound Mcp-Actor-Assertion headers (ADR-0024)"
      verified_by:
        - "tests/agents/test_phase38_cx.py"
        - "tests/agents/test_november_2026_gap_closures.py"
        - "tests/agents/test_phase43_agentic_tools_hardening.py"
    - id: "ASI08"
      name: "Cascading Failures"
      status: "mitigated"
      control_integrity: "ADR-0022: the half-open probe is a lease so no caller can wedge a dependency; each tier has its own breaker; one deadline bounds every stage on every transport; a cancel scope stops an abandoned tool loop; blocking work runs off the event loop (G341 to G348). Limitation: the receptionist's direct model call has no breaker (G365)."
      live_web_assurance: "ADR-0021: search providers fail over behind a breaker each, under a turn deadline and a bulkhead pool; one failed planned step costs only that step. Hosted adapters are unproven against live APIs (G326)."
      receptionist_assurance: "ADR-0020: cleanup independent of reporting, current-task-safe timer cancellation, cooperative media shutdown deadlines. Durable reconciliation and process-loss recovery remain G306."
      call_handoff_assurance: "ADR-0039: the lobby event and the waiting caller's countdown never wait on a transcript, row, ticket or presence write, and the officer's End always hangs up (G569, G570, G583); the row follows the room when an officer's connection lapses, so the next claim succeeds (G568); translation, ticket creation and the at-risk scan run off the event loop (G577, G578); LiveKit administration has a 5 s deadline (G579). No call failure metrics or alerts yet (G595); a receptionist that cannot start still stops the API (G373)."
      call_process_assurance: "ADR-0043 (on the Space since 2026-11-12, sha-4609a1c; live probes passed; a real officer handoff not yet run): every call request is routed to the one process that holds the call, so a call's room, desk lock, claim timer and event hub are never split across the Space's two processes: nginx sends every call path to a single-worker call process, and the chat process starts no receptionist, so restarting it cannot end a call (G306, for one container). A call request that reaches the chat process anyway is refused (HTTP 421, or a WebSocket closed 1013), logged at ERROR and counted; the UraCallMisrouted alert fires only where that counter is scraped, and the Space is not (G614), so there the ERROR log is the signal. The chat process reports the call process's own state on /ready, and the roll workflow and the hourly keepalive workflow fail while it reads \"unavailable: the call process ...\" (G614). Limitations: more than one replica needs durable call ownership (G613); an admin-API flag override reached only the process that answered it (G612), closed by ADR-0044: every process re-reads the stored overrides every FLAG_SYNC_INTERVAL_SECONDS, so the console's calls switch reaches the call process, with the Space secret as the fallback; a dead call process is alerted on by UraCallProcessDown (ADR-0045, the chat process's receptionist_call_process_up gauge), but only where the API is scraped, and nothing scrapes the Space (G614); the call process's restart still ends its calls."
      call_startup_assurance: "ADR-0041: a receptionist that cannot start is unavailable and reported on /ready instead of stopping the API (G373); the single-worker gate reads every variable an image may start workers from (G593); a recognizer or voice failure on a call reaches the brain, which hands the call to an officer after two in a row, and is never recorded as caller silence (G594); the call path exports counters on closed label vocabularies with four alert rules (G595); every call duration has a validated range (G596); rows a dead process left are ended at startup and owed callbacks flagged (G306). The production Space runs two processes outside the gate; ADR-0043 sends every call request to the call process only (call_process_assurance, on the Space since 2026-11-12); process-loss recovery beyond the startup sweep remains open."
      call_cancel_assurance: "ADR-0046: a superseded call turn (talked over, replaced by a new turn, moved to another language, or past the 25 s answer timeout) stops its model run at the next stage boundary instead of running to the end on pools every other call shares: a cancel token in the run's context is checked at every pipeline stage, the local model call, each continuation round, the agentic loop, each cloud hop and translation, and a run stopped inside the model call releases its breaker slot rather than recording a failure. The chat path sets no token. Limitation: an HTTP request already in flight runs to its own timeout."
      evidence: "App/backend/app/web_search_providers.py, App/backend/app/resilience.py, App/backend/app/quality_circuit_breaker.py, App/frontend/src/lib/chatStream.ts, App/frontend/src/app/page.tsx, App/backend/app/process_role.py, App/deploy/cranecloud/nginx.conf, App/deploy/cranecloud/uvicorn-role.sh"
      controls: "Provider circuit breakers, bounded ReAct/revision loops, and runtime quality circuit breaker throttling autonomy on grounding degradation. Bounded SSE requires explicit completion; ambiguous stateful chat failures are not automatically replayed; response writes are conversation-bound (ADR-0018)."
