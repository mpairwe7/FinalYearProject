# =============================================================================
# URA Chatbot - Project Configuration
# =============================================================================

[project]
name = "ura-chatbot"
version = "1.2.0"
description = "AI-powered customer service assistant for Uganda Revenue Authority"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# =============================================================================
# Test Suite Configuration
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["App/tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
    "--basetemp=/tmp/pytest-fyp",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "ml: Machine learning tests",
    "asyncio: mark test as asyncio",
]

[tool.coverage.run]
source = ["App/ml", "App/backend"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "App/ml/pipelines/evaluate_rag.py",
    "App/ml/pipelines/evaluate_rag_offline.py",
    "App/ml/pipelines/validate_data.py",
    "App/ml/pipelines/quality_gates.py",
    "App/ml/pipelines/export_feedback.py",
    "App/ml/scripts/data_aug/loaders.py",
    "App/ml/scripts/data_aug/chunkers.py",
    "App/ml/scripts/data_aug/dedup.py",
    "App/ml/scripts/data_aug/formatters.py",
    "App/ml/scripts/data_aug/pipeline.py",
    "App/ml/scripts/data_aug/quality.py",
    "App/ml/scripts/data_aug/provenance.py",
    "App/ml/scripts/lang_id.py",
    # Offline retrieval-measurement scripts, same character as the training
    # scripts above: no unit tests, but eval_retrieval.py is itself a CI gate
    # (the "Retrieval ranking gate" step runs it with --min-hit1), so its
    # behaviour is verified by execution rather than by coverage.
    "App/ml/scripts/eval_retrieval.py",
    "App/ml/scripts/static_dense.py",
    # On-device ASR/MT/TTS inference wrappers speech_service.py imports
    # lazily for the local backend tier; hardware/model-file dependent,
    # exercised by App/backend/tests but not measured for line coverage.
    "App/ml/scripts/asr/*",
    "App/ml/scripts/tts/*",
    "App/ml/scripts/mt/*",
    "App/ml/scripts/speech/*",
    # Backend runtime modules (require full app / integration tests)
    "App/backend/app/main.py",
    "App/backend/app/rag/generator.py",
    "App/backend/app/ingestion/indexer.py",
    "App/backend/app/evaluation.py",
    "App/backend/app/rag/cache.py",
    "App/backend/app/rag/corrective_rag.py",
    "App/backend/app/speech_service.py",
    "App/backend/app/resilience.py",
    "App/backend/app/observability/tracing.py",
    "App/backend/app/rag/retriever.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# =============================================================================
# Code Formatting & Linting
# =============================================================================

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | __pycache__
    | artifacts
    | node_modules
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".git", ".venv", "__pycache__", "artifacts", "node_modules"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "artifacts",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security lints)
    "T20", # flake8-print (no print() in production code)
    "PIE", # flake8-pie (misc. lints)
    "PT",  # flake8-pytest-style
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking (TYPE_CHECKING blocks)
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "S101",  # assert usage (OK in tests)
    "S603",  # subprocess calls (audited case-by-case)
    "S607",  # partial path in subprocess (audited)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# ML scripts & pipelines are CLI tools that use print() for output
"App/ml/scripts/**" = ["T201", "S311", "S110", "S112", "S310", "S324", "E402", "E741"]
# Operator tooling under App/scripts/ is the same shape — stdout IS the interface.
# Only T201, unlike the blanket list above: the security and correctness lints
# stay on, because these run against live deployments and real credentials.
"App/scripts/**" = ["T201"]
"App/governance/**" = ["T201"]
"App/threat-model/**" = ["T201"]
"App/ml/pipelines/**" = ["T201", "S311", "S110", "S112", "S310", "E741"]
# Backend CLI entry-points (audit verifier, etc.)
"App/backend/app/audit/verifier.py" = ["T201"]
# Best-effort exception handlers are intentional in resilience code
"App/backend/app/observability/analytics.py" = ["S110"]
"App/backend/app/rag/cache.py" = ["S110"]
"App/backend/app/audit/ledger.py" = ["S110", "SIM105"]
"App/backend/app/speech_service.py" = ["S110"]
# URL opens use known http(s) schemes only
"App/backend/app/rag/generator.py" = ["S310", "S112", "E402"]
"App/backend/tests/**" = ["PT009"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_equality = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = [
    "artifacts",
    "node_modules",
    ".venv",
    "tests",
    "Notebooks",
]

# Gradual adoption: strict for backend, relaxed for ML experimentation
[[tool.mypy.overrides]]
module = "ml.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "App.app"
disallow_untyped_defs = false
