# =============================================================================
# URA Chatbot - Project Configuration
# =============================================================================

[project]
name = "ura-chatbot"
version = "1.1.0"
description = "AI-powered customer service assistant for Uganda Revenue Authority"
requires-python = ">=3.11"
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# =============================================================================
# Test Suite Configuration
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "ml: Machine learning tests",
]

[tool.coverage.run]
source = ["ml", "backend"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# =============================================================================
# Code Formatting & Linting
# =============================================================================

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | __pycache__
    | artifacts
    | node_modules
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".git", ".venv", "__pycache__", "artifacts", "node_modules"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "artifacts",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security lints)
    "T20", # flake8-print (no print() in production code)
    "PIE", # flake8-pie (misc. lints)
    "PT",  # flake8-pytest-style
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking (TYPE_CHECKING blocks)
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "S101",  # assert usage (OK in tests)
    "S603",  # subprocess calls (audited case-by-case)
    "S607",  # partial path in subprocess (audited)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_equality = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = [
    "artifacts",
    "node_modules",
    ".venv",
    "tests",
    "Notebooks",
]

# Gradual adoption: strict for backend, relaxed for ML experimentation
[[tool.mypy.overrides]]
module = "ml.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "App.app"
disallow_untyped_defs = false
