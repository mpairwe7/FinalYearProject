# =============================================================================
# URA Chatbot - Project Configuration
# =============================================================================

[project]
name = "ura-chatbot"
version = "1.1.0"
description = "AI-powered customer service assistant for Uganda Revenue Authority"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# =============================================================================
# Test Suite Configuration
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
    "--basetemp=/tmp/pytest-fyp",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "ml: Machine learning tests",
]

[tool.coverage.run]
source = ["ml", "App/backend"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "ml/scripts/data_augmentation.py",
    "ml/scripts/fine_tune_gemma.py",
    "ml/scripts/export_tpu_ready_data.py",
    "ml/scripts/teacher_qa_generation.py",
    "ml/scripts/train_quality_classifier.py",
    "ml/scripts/train_all.py",
    "ml/scripts/merge_lora_adapter.py",
    "ml/scripts/monitor_kaggle.py",
    "ml/scripts/prepare_kaggle_notebook.py",
    "ml/scripts/process_kaggle_output.py",
    "ml/scripts/repro.py",
    "ml/scripts/benchmark_inference.py",
    "ml/scripts/asr/*",
    "ml/scripts/tts/*",
    "ml/scripts/mt/*",
    "ml/scripts/speech/*",
    "ml/scripts/data_aug/crawler.py",
    "ml/scripts/data_aug/dataset_downloader.py",
    "ml/scripts/data_aug/faq_translator.py",
    "ml/scripts/data_aug/quality_classifier.py",
    "ml/scripts/data_aug/mt_loaders.py",
    "ml/scripts/data_aug/asr_loaders.py",
    "ml/scripts/data_aug/speech_schema.py",
    "ml/pipelines/continuous_training.py",
    "ml/pipelines/train.py",
    "ml/pipelines/push_to_hub.py",
    "ml/pipelines/evaluate.py",
    "ml/pipelines/evaluate_rag.py",
    "ml/pipelines/evaluate_rag_offline.py",
    "ml/pipelines/evaluate_safety.py",
    "ml/pipelines/evaluate_speech.py",
    "ml/pipelines/evaluate_mt.py",
    "ml/pipelines/evaluate_tts.py",
    "ml/pipelines/benchmark_mobile.py",
    "ml/pipelines/redteam_voice.py",
    "ml/pipelines/calibrate.py",
    "ml/pipelines/generate_model_card.py",
    "ml/pipelines/audit_tokenizer.py",
    "ml/pipelines/validate_data.py",
    "ml/pipelines/quality_gates.py",
    "ml/pipelines/export_feedback.py",
    "ml/scripts/data_aug/loaders.py",
    "ml/scripts/data_aug/chunkers.py",
    "ml/scripts/data_aug/dedup.py",
    "ml/scripts/data_aug/formatters.py",
    "ml/scripts/data_aug/pipeline.py",
    "ml/scripts/data_aug/quality.py",
    "ml/scripts/data_aug/provenance.py",
    "ml/scripts/lang_id.py",
    # Offline retrieval-measurement scripts, same character as the training
    # scripts above: no unit tests, but eval_retrieval.py is itself a CI gate
    # (the "Retrieval ranking gate" step runs it with --min-hit1), so its
    # behaviour is verified by execution rather than by coverage.
    "ml/scripts/eval_retrieval.py",
    "ml/scripts/build_static_index.py",
    "ml/scripts/static_dense.py",
    "ml/huggingface/*",
    "ml/plots/*",
    # Backend runtime modules (require full app / integration tests)
    "App/backend/app/main.py",
    "App/backend/app/llm.py",
    "App/backend/app/indexer.py",
    "App/backend/app/evaluation.py",
    "App/backend/app/cache.py",
    "App/backend/app/corrective_rag.py",
    "App/backend/app/speech_service.py",
    "App/backend/app/resilience.py",
    "App/backend/app/tracing.py",
    "App/backend/app/retriever.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# =============================================================================
# Code Formatting & Linting
# =============================================================================

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | __pycache__
    | artifacts
    | node_modules
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".git", ".venv", "__pycache__", "artifacts", "node_modules"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "artifacts",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security lints)
    "T20", # flake8-print (no print() in production code)
    "PIE", # flake8-pie (misc. lints)
    "PT",  # flake8-pytest-style
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking (TYPE_CHECKING blocks)
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "S101",  # assert usage (OK in tests)
    "S603",  # subprocess calls (audited case-by-case)
    "S607",  # partial path in subprocess (audited)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# ML scripts & pipelines are CLI tools that use print() for output
"ml/scripts/**" = ["T201", "S311", "S110", "S112", "S310", "S324", "E402", "E741"]
"ml/pipelines/**" = ["T201", "S311", "S110", "S112", "S310", "E741"]
"ml/plots/**" = ["T201", "E741"]
"ml/huggingface/**" = ["T201"]
# Backend CLI entry-points (audit verifier, etc.)
"App/backend/app/audit/verifier.py" = ["T201"]
# Best-effort exception handlers are intentional in resilience code
"App/backend/app/analytics.py" = ["S110"]
"App/backend/app/cache.py" = ["S110"]
"App/backend/app/audit/ledger.py" = ["S110", "SIM105"]
"App/backend/app/speech_service.py" = ["S110"]
# URL opens use known http(s) schemes only
"App/backend/app/llm.py" = ["S310", "S112", "E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_equality = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = [
    "artifacts",
    "node_modules",
    ".venv",
    "tests",
    "Notebooks",
]

# Gradual adoption: strict for backend, relaxed for ML experimentation
[[tool.mypy.overrides]]
module = "ml.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "App.app"
disallow_untyped_defs = false
