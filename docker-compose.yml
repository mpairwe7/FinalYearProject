# =============================================================================
# URA Chatbot - Docker Compose Configuration
# Development and Production environments
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Redis — shared rate-limit buckets + distributed semantic cache
  # (multi-worker / multi-replica correctness)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: ura-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - ura-network

  # ---------------------------------------------------------------------------
  # PostgreSQL — optional multi-replica analytics store
  # Enable with: docker compose --profile postgres up
  # Then set in .env: ANALYTICS_BACKEND=postgres
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16.6-alpine
    container_name: ura-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ura}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ura}
      - POSTGRES_DB=${POSTGRES_DB:-ura_analytics}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ura} -d $${POSTGRES_DB:-ura_analytics}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles:
      - postgres
    networks:
      - ura-network

  # ---------------------------------------------------------------------------
  # Qdrant Vector Store (first-class RAG dependency)
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: ura-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 'passed' <&3"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - ura-network

  # ---------------------------------------------------------------------------
  # Backend API Service
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ${DOCKER_IMAGE:-landwind/ura-chatbot-api}:${IMAGE_TAG:-latest}
    container_name: ura-chatbot-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - PORT=8000
      - WORKERS=${WORKERS:-2}
      - HF_MODEL_REPO=${HF_MODEL_REPO:-mpairweLandwind/ura-chatbot}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ANALYTICS_DB_DIR=/app/data_store
      - QDRANT_URL=http://qdrant:6333
      # Redis-backed rate limit + semantic cache (Phase 7)
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SLOWAPI_STORAGE_URI=${SLOWAPI_STORAGE_URI:-redis://redis:6379/1}
      - CACHE_BACKEND=${CACHE_BACKEND:-redis}
    env_file:
      - .env
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/cache
    volumes:
      - ./artifacts/models:/app/models:ro
      - api_logs:/app/logs
      - analytics_data:/app/data_store
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ura-network

  # ---------------------------------------------------------------------------
  # Development API (with hot-reload)
  # ---------------------------------------------------------------------------
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ${DOCKER_IMAGE:-landwind/ura-chatbot-api}:dev
    container_name: ura-chatbot-api-dev
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_ENV=development
      - PORT=8000
      - WORKERS=1
      - LOG_LEVEL=debug
    volumes:
      - ./App/backend:/app:ro
      - ./artifacts/models:/app/models:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    profiles:
      - dev
    networks:
      - ura-network

  # ---------------------------------------------------------------------------
  # vLLM — high-throughput LLM inference server (profile: vllm)
  # Enable with: docker compose --profile vllm up
  # Then set in .env: LLM_BACKEND=vllm VLLM_BASE_URL=http://vllm:8001/v1
  # Requires an NVIDIA GPU + nvidia-container-toolkit on the host.
  # ---------------------------------------------------------------------------
  vllm:
    image: vllm/vllm-openai:v0.6.6
    container_name: ura-vllm
    command: >
      --model ${LLM_MODEL:-Qwen/Qwen2.5-3B-Instruct}
      --port 8001
      --max-model-len ${VLLM_MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${VLLM_GPU_MEM_UTIL:-0.85}
      --dtype ${VLLM_DTYPE:-auto}
    ports:
      - "${VLLM_PORT:-8001}:8001"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/v1/models', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - vllm
    networks:
      - ura-network

  # ---------------------------------------------------------------------------
  # Caddy — automatic-TLS reverse proxy (profile: tls)
  # Enable with: docker compose --profile tls up
  # Point DNS at the host; Caddy auto-provisions Let's Encrypt certs.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: ura-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 QUIC
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-localhost}
      - CADDY_ACME_EMAIL=${CADDY_ACME_EMAIL:-admin@example.com}
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    profiles:
      - tls
    networks:
      - ura-network

  # ---------------------------------------------------------------------------
  # Model Training Service (for local training)
  # ---------------------------------------------------------------------------
  trainer:
    build:
      context: .
      dockerfile: Dockerfile.ml
    image: ${DOCKER_IMAGE:-landwind/ura-chatbot-trainer}:latest
    container_name: ura-chatbot-trainer
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-mlruns}
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    volumes:
      - ./Data/dataset:/app/datasets:ro
      - ./ml:/app/ml:ro
      - ./artifacts:/app/artifacts
    command: python ml/pipelines/train.py --config ml/configs/training_config.yaml
    profiles:
      - training
    networks:
      - ura-network

  # ---------------------------------------------------------------------------
  # Frontend Service
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./App/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: ${DOCKER_IMAGE_FRONTEND:-landwind/ura-chatbot-frontend}:${IMAGE_TAG:-latest}
    container_name: ura-chatbot-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ura-network

  # ---------------------------------------------------------------------------
  # Prometheus — metrics scraping (profile: monitoring)
  # Enable with: docker compose --profile monitoring up
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: ura-prometheus
    profiles: [monitoring]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ura-network

  # ---------------------------------------------------------------------------
  # Grafana — dashboards and alerting (profile: monitoring)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:11.6.0
    container_name: ura-grafana
    profiles: [monitoring]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-ura2026}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ura-network

  # ---------------------------------------------------------------------------
  # Jaeger — distributed tracing (profile: monitoring)
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/jaeger:2.6.0
    container_name: ura-jaeger
    profiles: [monitoring]
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"     # UI
      - "${JAEGER_OTLP_PORT:-4317}:4317"     # OTLP gRPC
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318" # OTLP HTTP
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ura-network

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  ura-network:
    driver: bridge

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  api_logs:
  analytics_data:
  qdrant_data:
  redis_data:
  postgres_data:
  hf_cache:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
