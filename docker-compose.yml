# =============================================================================
# URA Chatbot - Docker Compose Configuration
# Development and Production environments
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend API Service
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ${DOCKER_IMAGE:-landwind/ura-chatbot-api}:${IMAGE_TAG:-latest}
    container_name: ura-chatbot-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - PORT=8000
      - WORKERS=${WORKERS:-2}
      - HF_MODEL_REPO=${HF_MODEL_REPO:-mpairweLandwind/ura-chatbot}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ANALYTICS_DB_DIR=/app/data_store
    env_file:
      - .env
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/cache
    volumes:
      - ./artifacts/models:/app/models:ro
      - api_logs:/app/logs
      - analytics_data:/app/data_store
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - ura-network

  # ---------------------------------------------------------------------------
  # Development API (with hot-reload)
  # ---------------------------------------------------------------------------
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ${DOCKER_IMAGE:-landwind/ura-chatbot-api}:dev
    container_name: ura-chatbot-api-dev
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_ENV=development
      - PORT=8000
      - WORKERS=1
      - LOG_LEVEL=debug
    volumes:
      - ./App/backend:/app:ro
      - ./artifacts/models:/app/models:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    profiles:
      - dev
    networks:
      - ura-network

  # ---------------------------------------------------------------------------
  # Model Training Service (for local training)
  # ---------------------------------------------------------------------------
  trainer:
    build:
      context: .
      dockerfile: Dockerfile.ml
    image: ${DOCKER_IMAGE:-landwind/ura-chatbot-trainer}:latest
    container_name: ura-chatbot-trainer
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-mlruns}
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    volumes:
      - ./Data/dataset:/app/datasets:ro
      - ./ml:/app/ml:ro
      - ./artifacts:/app/artifacts
    command: python ml/pipelines/train.py --config ml/configs/training_config.yaml
    profiles:
      - training
    networks:
      - ura-network

  # ---------------------------------------------------------------------------
  # Frontend Service
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./App/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: ${DOCKER_IMAGE_FRONTEND:-landwind/ura-chatbot-frontend}:${IMAGE_TAG:-latest}
    container_name: ura-chatbot-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ura-network

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  ura-network:
    driver: bridge

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  api_logs:
  analytics_data:
