name: Deploy Frontend (Vercel)

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_PROJECT_DIR: ${{ vars.VERCEL_PROJECT_DIR || '.' }}
    steps:
      - name: Ensure Vercel secrets are present
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Missing Vercel secrets"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ${{ env.VERCEL_PROJECT_DIR }}
        run: |
          if [ -f package.json ]; then
            bun install
          else
            echo "No package.json found" && exit 1
          fi

      - name: Build frontend
        working-directory: ${{ env.VERCEL_PROJECT_DIR }}
        run: bun run build

      - name: Deploy to Vercel
        working-directory: ${{ env.VERCEL_PROJECT_DIR }}
        run: |
          bunx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          bunx vercel build --prod --token "$VERCEL_TOKEN"
          bunx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
