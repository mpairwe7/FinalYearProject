# Kaggle Remote Training Pipeline
# Triggers training on Kaggle notebooks via API

name: Kaggle Training Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'Notebooks/**'
      - 'Data/**'
      - 'ml/**'
      - '.github/workflows/kaggle-training.yml'
  workflow_dispatch:
    inputs:
      notebook:
        description: 'Kaggle notebook to run'
        required: true
        default: 'ura-training'
        type: choice
        options:
          - ura-training
          - embedding-fine-tune
          - full-pipeline
      gpu:
        description: 'Use GPU accelerator'
        required: false
        default: true
        type: boolean

jobs:
  # ============================================
  # Stage 1: Prepare & Trigger Training
  # ============================================
  prepare-kaggle:
    name: Prepare Kaggle Notebook
    runs-on: ubuntu-latest
    outputs:
      kernel-id: ${{ steps.push.outputs.kernel-id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Free up disk space (cleanup)
        run: |
          echo "Freeing up disk space before pip install..."
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo docker image prune -a -f || true
          df -h

      - name: Install Kaggle CLI
        run: |
          pip install kaggle
          mkdir -p ~/.kaggle
          echo '{"username":"${{ secrets.KAGGLE_USERNAME }}","key":"${{ secrets.KAGGLE_API_TOKEN }}"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Prepare Kaggle kernel
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          # Check if secrets are set
          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "Error: KAGGLE_USERNAME secret is not set"
            exit 1
          fi
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Error: KAGGLE_API_TOKEN secret is not set"
            exit 1
          fi

      - name: Prepare notebook metadata
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          # First, prepare training data
          pip install pandas PyPDF2 langchain-text-splitters pymupdf4llm openpyxl
          mkdir -p artifacts
          python ml/scripts/data_augmentation.py \
            --csv-dir Data/dataset \
            --pdf-dir Data/pdfs \
            --luganda-dir Data/TTT \
            --output artifacts/training_data.jsonl \
            --gemma-output artifacts/gemma_training.jsonl
          
          # Generate teacher QA if PDFs exist (optional - may take time)
          if [ -d "Data/pdfs" ] && [ "$(ls -A Data/pdfs/*.pdf 2>/dev/null)" ]; then
            echo "Generating teacher QA from PDFs..."
            pip install torch transformers accelerate
            python ml/scripts/teacher_qa_generation.py \
              --output artifacts/teacher_qa \
              --chunks 50 \
              --questions 3 \
              --formats jsonl,gemma || echo "Teacher QA generation skipped (model not available)"
          fi
          
          # Create a temporary directory for the dataset
          mkdir -p kaggle_dataset/Data
          cp -r Data/* kaggle_dataset/Data/
          
          # Copy all JSONL files to artifacts/data subfolder inside Data folder for the zip
          mkdir -p kaggle_dataset/Data/artifacts/
          cp -v artifacts/*.jsonl kaggle_dataset/Data/artifacts/ 2>/dev/null || echo "No JSONL files to copy"
          
          # Debug: show what's in the dataset directory
          echo "Dataset structure to be uploaded:"
          find kaggle_dataset -type f | head -50
          
          # Initialize or update Kaggle dataset with auto-incrementing title
          cd kaggle_dataset
          kaggle datasets init -p .

          BASE_TITLE="ura-tax-data-v2"
          MAX_ATTEMPTS=5
          DATASET_ID=""
          CREATED=0

          for i in $(seq 1 $MAX_ATTEMPTS); do
            if [ "$i" -eq 1 ]; then
              TITLE="$BASE_TITLE"
            else
              TITLE="$BASE_TITLE-$i"
            fi
            SLUG="$KAGGLE_USERNAME/$TITLE"

            export TITLE SLUG
            python3 -c "import json, os; p='dataset-metadata.json'; d=json.load(open(p)); d['title']=os.environ['TITLE']; d['id']=os.environ['SLUG']; d['licenses']=[{'name':'CC-BY-4.0'}]; d['description']='URA tax assistant dataset'; json.dump(d, open(p,'w'), indent=2); print('Updated metadata:', d['title'], d['id'])"

            echo "Attempt $i: trying $SLUG"
            
            # First try to version existing dataset
            echo "  Trying to version existing dataset..."
            if kaggle datasets version -p . --dir-mode zip -m "Update from GitHub Actions run ${{ github.run_id }}" 2>&1; then
              echo "  ✓ Dataset versioned successfully"
              DATASET_ID="$SLUG"
              CREATED=1
              break
            fi
            
            # If versioning failed, try to create new
            echo "  Trying to create new dataset..."
            if kaggle datasets create -p . --dir-mode zip --public 2>&1; then
              echo "  ✓ Dataset created successfully"
              DATASET_ID="$SLUG"
              CREATED=1
              break
            fi
            
            echo "  ✗ Both version and create failed for $SLUG, trying next..."
          done

          if [ "$CREATED" -ne 1 ]; then
            echo "Failed to create or update dataset after $MAX_ATTEMPTS attempts"
            exit 1
          fi

          echo "DATASET_ID=$DATASET_ID" >> $GITHUB_ENV
          cd ..

          # Then prepare the notebook
          python ml/scripts/prepare_kaggle_notebook.py \
            --notebook ${{ github.event.inputs.notebook || 'ura-training' }} \
            --gpu ${{ github.event.inputs.gpu || 'true' }} \
            --dataset $DATASET_ID
          
          # Set environment variable for the notebook
          echo "KAGGLE_DATASET=$DATASET_ID" >> $GITHUB_ENV

      - name: Overwrite notebook in ml/kaggle with latest from Notebooks
        run: |
          cp Notebooks/${{ github.event.inputs.notebook || 'ura-training' }}.ipynb ml/kaggle/
          ls -l ml/kaggle/${{ github.event.inputs.notebook || 'ura-training' }}.ipynb
          sha256sum ml/kaggle/${{ github.event.inputs.notebook || 'ura-training' }}.ipynb

      - name: Push notebook to Kaggle
        id: push
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          cd ml/kaggle
          kaggle kernels push
          echo "kernel-id=${{ secrets.KAGGLE_USERNAME }}/${{ github.event.inputs.notebook || 'ura-training' }}" >> $GITHUB_OUTPUT

  # ============================================
  # Stage 2: Monitor Training
  # ============================================
  monitor-training:
    name: Monitor Kaggle Training
    runs-on: ubuntu-latest
    needs: prepare-kaggle
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install kaggle requests

      - name: Configure Kaggle
        run: |
          mkdir -p ~/.kaggle
          echo '{"username":"${{ secrets.KAGGLE_USERNAME }}","key":"${{ secrets.KAGGLE_API_TOKEN }}"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Wait for training completion
        run: |
          python ml/scripts/monitor_kaggle.py \
            --kernel-id "${{ needs.prepare-kaggle.outputs.kernel-id }}" \
            --timeout 7200 \
            --poll-interval 60

      - name: Download outputs
        run: |
          mkdir -p artifacts/kaggle
          kaggle kernels output "${{ needs.prepare-kaggle.outputs.kernel-id }}" -p artifacts/kaggle
          echo "Downloaded files:"
          find artifacts/kaggle -type f | head -50

      - name: Upload Kaggle outputs
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-training-outputs
          path: artifacts/kaggle/

  # ============================================
  # Stage 3: Process & Deploy Model
  # ============================================
  process-model:
    name: Process Trained Model
    runs-on: ubuntu-latest
    needs: monitor-training
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Kaggle outputs
        uses: actions/download-artifact@v4
        with:
          name: kaggle-training-outputs
          path: artifacts/kaggle/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install huggingface_hub torch transformers joblib

      - name: Process and validate model
        run: |
          python ml/scripts/process_kaggle_output.py \
            --input-dir artifacts/kaggle \
            --output-dir artifacts/models

      - name: Copy artifacts to repo folders
        run: |
          echo "=========================================="
          echo "COPYING ARTIFACTS TO REPO FOLDERS"
          echo "=========================================="
          
          # Create directories if they don't exist
          mkdir -p Model Results/metrics Results/plots Results/reports
          
          # Copy model files to Model/ folder
          echo "📦 Copying model files to Model/..."
          if [ -d "artifacts/models" ]; then
            cp -v artifacts/models/*.joblib Model/ 2>/dev/null || true
            cp -v artifacts/models/*.pth Model/ 2>/dev/null || true
            cp -v artifacts/models/*.onnx Model/ 2>/dev/null || true
            cp -v artifacts/models/*.pkl Model/ 2>/dev/null || true
            cp -v artifacts/models/*.bin Model/ 2>/dev/null || true
            cp -v artifacts/models/manifest.json Model/ 2>/dev/null || true
            cp -v artifacts/models/class_labels.json Model/ 2>/dev/null || true
            cp -v artifacts/models/config.json Model/ 2>/dev/null || true
          fi
          
          # Copy metrics/JSON files to Results/metrics/
          echo "📊 Copying metrics to Results/metrics/..."
          find artifacts/kaggle -name "*metrics*.json" -exec cp -v {} Results/metrics/ \; 2>/dev/null || true
          find artifacts/kaggle -name "*results*.json" -exec cp -v {} Results/metrics/ \; 2>/dev/null || true
          find artifacts/kaggle -name "*scores*.json" -exec cp -v {} Results/metrics/ \; 2>/dev/null || true
          find artifacts/kaggle -name "classification_report*.json" -exec cp -v {} Results/metrics/ \; 2>/dev/null || true
          
          # Copy plots/charts/images to Results/plots/
          echo "📈 Copying plots and charts to Results/plots/..."
          find artifacts/kaggle -name "*.png" -exec cp -v {} Results/plots/ \; 2>/dev/null || true
          find artifacts/kaggle -name "*.jpg" -exec cp -v {} Results/plots/ \; 2>/dev/null || true
          find artifacts/kaggle -name "*.jpeg" -exec cp -v {} Results/plots/ \; 2>/dev/null || true
          find artifacts/kaggle -name "*.svg" -exec cp -v {} Results/plots/ \; 2>/dev/null || true
          find artifacts/kaggle -name "*confusion*.png" -exec cp -v {} Results/plots/ \; 2>/dev/null || true
          find artifacts/kaggle -name "*plot*.png" -exec cp -v {} Results/plots/ \; 2>/dev/null || true
          find artifacts/kaggle -name "*chart*.png" -exec cp -v {} Results/plots/ \; 2>/dev/null || true
          find artifacts/kaggle -name "*graph*.png" -exec cp -v {} Results/plots/ \; 2>/dev/null || true
          
          # Copy reports/CSVs to Results/reports/
          echo "📄 Copying reports to Results/reports/..."
          find artifacts/kaggle -name "*.csv" -exec cp -v {} Results/reports/ \; 2>/dev/null || true
          find artifacts/kaggle -name "*report*.txt" -exec cp -v {} Results/reports/ \; 2>/dev/null || true
          find artifacts/kaggle -name "*summary*.txt" -exec cp -v {} Results/reports/ \; 2>/dev/null || true
          find artifacts/kaggle -name "*log*.txt" -exec cp -v {} Results/reports/ \; 2>/dev/null || true
          
          # Show what was copied
          echo ""
          echo "=========================================="
          echo "COPIED FILES SUMMARY"
          echo "=========================================="
          echo "Model/ contents:"
          ls -la Model/ || echo "  (empty)"
          echo ""
          echo "Results/metrics/ contents:"
          ls -la Results/metrics/ || echo "  (empty)"
          echo ""
          echo "Results/plots/ contents:"
          ls -la Results/plots/ || echo "  (empty)"
          echo ""
          echo "Results/reports/ contents:"
          ls -la Results/reports/ || echo "  (empty)"

      - name: Commit artifacts to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add all artifacts
          git add Model/ Results/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update model and results from Kaggle training
          
          Kaggle kernel: ${{ needs.prepare-kaggle.outputs.kernel-id }}
          Workflow run: ${{ github.run_id }}
          Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          
          Files updated:
          - Model/: trained model artifacts
          - Results/metrics/: training metrics JSON
          - Results/plots/: visualizations and charts
          - Results/reports/: CSV reports and logs"
            
            git push
            echo "✅ Artifacts committed to repository"
          fi

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python ml/pipelines/push_to_hub.py \
            --model-path Model \
            --repo-id ${{ vars.HF_REPO }} \
            --commit-message "Kaggle training: ${{ github.run_id }}"

      - name: Create release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: model-${{ github.run_number }}
          name: Model Release ${{ github.run_number }}
          files: |
            Model/**
            Results/metrics/**
          body: |
            ## Model Training Complete
            - Kaggle kernel: ${{ needs.prepare-kaggle.outputs.kernel-id }}
            - Run ID: ${{ github.run_id }}
            
            ### Artifacts
            - **Model/**: Trained model files
            - **Results/**: Metrics, plots, and reports
            
            ### Files Included
            $(ls -1 Model/ 2>/dev/null | sed 's/^/- /')