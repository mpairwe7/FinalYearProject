name: Train Model (Kaggle)

on:
  workflow_dispatch:
    inputs:
      kernel_path:
        description: Path to Kaggle kernel directory (contains kernel-metadata.json)
        required: true
        default: kaggle/kernel
      kernel_ref:
        description: Kaggle kernel reference (e.g., username/ura-chatbot-train)
        required: true
        default: username/ura-chatbot-train
      output_dir:
        description: Where to download Kaggle outputs
        required: false
        default: artifacts/kaggle-output
  schedule:
    - cron: '0 3 * * 1' # Mondays at 03:00 UTC

concurrency:
  group: train-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_PATH: ${{ inputs.kernel_path }}
      KERNEL_REF: ${{ inputs.kernel_ref }}
      OUTPUT_DIR: ${{ inputs.output_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Kaggle secrets
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Missing KAGGLE_USERNAME or KAGGLE_API_TOKEN secrets"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install kaggle

      - name: Configure Kaggle credentials
        run: |
          mkdir -p ~/.kaggle
          echo "$KAGGLE_API_TOKEN" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Push kernel to Kaggle
        run: |
          if [ -d "$KERNEL_PATH" ]; then
            kaggle kernels push -p "$KERNEL_PATH"
          else
            echo "Kernel path $KERNEL_PATH not found"
            exit 1
          fi

      - name: Start kernel run
        run: |
          kaggle kernels status "$KERNEL_REF" || true
          kaggle kernels pull "$KERNEL_REF" --path /tmp/kaggle-kernel --quiet
          kaggle kernels output "$KERNEL_REF" --path "$OUTPUT_DIR" --quiet || true
          echo "Waiting for kernel to finish..."
          kaggle kernels status "$KERNEL_REF"

      - name: Collect artifacts
        run: |
          mkdir -p "$OUTPUT_DIR"
          if ls "$OUTPUT_DIR"/* >/dev/null 2>&1; then
            echo "Artifacts collected in $OUTPUT_DIR"
          else
            echo "No artifacts downloaded; ensure kernel writes outputs"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-output
          path: ${{ inputs.output_dir }}
          if-no-files-found: warn

      - name: Publish metrics summary
        run: |
          if [ -f "$OUTPUT_DIR/metrics.json" ]; then
            echo "### Training metrics" >> $GITHUB_STEP_SUMMARY
            echo '\n' >> $GITHUB_STEP_SUMMARY
            cat "$OUTPUT_DIR/metrics.json" >> $GITHUB_STEP_SUMMARY
          else
            echo "No metrics.json found" >> $GITHUB_STEP_SUMMARY
          fi
