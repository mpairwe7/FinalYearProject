name: Dependabot Auto-Merge

on:
  pull_request:
    branches:
      - dev
      - main

# Read-only by default; the one job that approves and merges elevates itself.
permissions:
  contents: read

jobs:
  dependabot-automerge:
    name: "Auto-merge Dependabot PRs"
    permissions:
      contents: write        # merge the PR
      pull-requests: write   # approve it first
    runs-on: ubuntu-latest
    # The PR's author, not github.actor: the actor is whoever triggered this
    # run (a re-run or a push to the branch), so it can read as dependabot on
    # a PR that someone else changed.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # `gh pr merge --auto` waits only for the checks the base branch
      # REQUIRES. With none required it merges at once, before CI has run:
      # that is how #633 merged a red, unresolvable OpenTelemetry bump into
      # dev. Enable it only when the base branch requires status checks
      # (ruleset or classic protection); otherwise leave the PR for a person.
      - name: Check that the base branch requires status checks
        id: gate
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$BASE" =~ ^(dev|main)$ ]] || { echo "::error::unexpected base branch"; exit 1; }
          rules=$(gh api "repos/${REPO}/rules/branches/${BASE}" \
            --jq '[.[] | select(.type == "required_status_checks")] | length')
          classic=$(gh api "repos/${REPO}/branches/${BASE}" \
            --jq '((.protection.required_status_checks.checks // []) + (.protection.required_status_checks.contexts // [])) | length')
          if [ "$rules" -gt 0 ] || [ "$classic" -gt 0 ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${BASE} requires no status checks, so auto-merge would merge before CI finishes; leaving this PR for review."
          fi

      # Auto-merge minor, patch, and grouped updates once the required checks pass.
      - name: Enable auto-merge for non-major updates
        if: >-
          steps.gate.outputs.required == 'true' &&
          (steps.metadata.outputs.update-type != 'version-update:semver-major' || steps.metadata.outputs.package-group != '')
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
