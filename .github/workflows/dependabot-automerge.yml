name: Dependabot Auto-Merge

on:
  pull_request:
    branches:
      - dev
      - main

# Read-only by default; the one job that approves and merges elevates itself.
permissions:
  contents: read

jobs:
  dependabot-automerge:
    name: "Auto-merge Dependabot PRs"
    permissions:
      contents: write        # merge the PR
      pull-requests: write   # approve it first
    runs-on: ubuntu-latest
    # The PR's author, not github.actor: the actor is whoever triggered this
    # run (a re-run or a push to the branch), so it can read as dependabot on
    # a PR that someone else changed.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Auto-merge minor, patch, and grouped updates when all CI checks pass
      - name: Enable auto-merge for non-major updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major' || steps.metadata.outputs.package-group != ''
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
