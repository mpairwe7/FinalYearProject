name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            uv pip install -r requirements.txt
          else
            echo "requirements.txt not found; skipping Python deps install"
          fi

      - name: Install Python dev tools (ruff/mypy/pytest)
        run: |
          uv pip install ruff mypy pytest

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install frontend dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          if [ -f package.json ]; then
            bun install
          else
            echo "No package.json found; skipping frontend deps"
          fi

      - name: Lint backend (Python)
        run: |
          if ls **/*.py >/dev/null 2>&1; then
            uv run ruff check .
          else
            echo "No Python sources detected; skipping ruff"
          fi

      - name: Test backend (pytest)
        run: |
          if [ -d tests ]; then
            uv run pytest --maxfail=1 --disable-warnings -q
          else
            echo "tests/ not found; skipping pytest"
          fi

      - name: Type-check backend (mypy)
        run: |
          if [ -f mypy.ini ] || [ -f pyproject.toml ]; then
            uv run mypy .
          else
            echo "No mypy config found; skipping type-check"
          fi

      - name: Validate data schema/config
        run: |
          if [ -f scripts/validate_schema.py ]; then
            uv run python scripts/validate_schema.py
          else
            echo "scripts/validate_schema.py not found; skipping schema validation"
          fi

      - name: Lint frontend
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          if python - <<'PY'
import json,sys
from pathlib import Path
p=Path('package.json')
try:
    data=json.load(p.open()) if p.exists() else {}
except Exception:
    sys.exit(1)
sys.exit(0 if 'lint' in data.get('scripts',{}) else 1)
PY
          then
            bun run lint
          else
            echo "No lint script; skipping"
          fi

      - name: Test frontend
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          if python - <<'PY'
import json,sys
from pathlib import Path
p=Path('package.json')
try:
    data=json.load(p.open()) if p.exists() else {}
except Exception:
    sys.exit(1)
sys.exit(0 if 'test' in data.get('scripts',{}) else 1)
PY
          then
            bun run test --watch=false
          else
            echo "No test script; skipping"
          fi

      - name: Build frontend
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          if python - <<'PY'
import json,sys
from pathlib import Path
p=Path('package.json')
try:
    data=json.load(p.open()) if p.exists() else {}
except Exception:
    sys.exit(1)
sys.exit(0 if 'build' in data.get('scripts',{}) else 1)
PY
          then
            bun run build
          else
            echo "No build script; skipping"
          fi

      - name: Upload frontend build artifact
        if: ${{ hashFiles('**/dist/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: ignore

      - name: Upload test reports (optional)
        if: ${{ hashFiles('reports/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports
          if-no-files-found: ignore
