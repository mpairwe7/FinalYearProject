# Build the HF Space image before a change to its Dockerfile is merged.
#
# The roll pushes App/deploy/hf-space/Dockerfile to the Space whole, and the
# Space builds it there. Until this job existed nothing built that file before
# merge, so a layer that does not build (an apt package, a COPY --from path, a
# shell quoting slip) was found on the production Space. This job builds it on a
# runner, then starts the local dense leg's Postgres the way supervisord does and
# checks pgvector answers (ADR-0034). It pushes nothing.
name: HF Space image check

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "App/deploy/hf-space/**"
      - ".github/workflows/hf-space-image-check.yml"
      - ".github/scripts/hf_space_pgvector_smoke.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-space-image-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the Space image and check pgvector
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The base image is several GB; the runner's preinstalled SDKs are not needed.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - name: Build the Space Dockerfile
        run: docker build -f App/deploy/hf-space/Dockerfile -t hf-space-check App/deploy/hf-space
      - name: Start Postgres as supervisord would and query pgvector
        run: |
          docker run --rm --entrypoint /bin/sh \
            -v "$GITHUB_WORKSPACE/.github/scripts/hf_space_pgvector_smoke.sh:/smoke.sh:ro" \
            hf-space-check /smoke.sh
