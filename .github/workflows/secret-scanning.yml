# =============================================================================
# CI Secret Scanning Pipeline (2026 Industry Standard)
#
# Defence-in-depth: 4 independent scanners run in parallel on every push/PR.
# Weekly full-history scan detects secrets committed before hooks were installed.
#
# Scanners:
#   1. TruffleHog v3  – verified credentials (800+ detectors, near-zero FP)
#   2. Gitleaks v8    – regex + entropy (150+ rules + custom URA patterns)
#   3. ggshield       – GitGuardian ML-based detection (400+ secret types)
#   4. detect-secrets – Yelp baseline-aware entropy scanner
#
# Results are uploaded to GitHub Security tab (SARIF) where supported.
# =============================================================================
name: Secret Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly full-history scan – Sunday 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      full-history:
        description: 'Scan full git history (not just diff)'
        type: boolean
        default: false

concurrency:
  group: secret-scanning-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # ── TruffleHog v3 ─────────────────────────────────────────────────────────
  trufflehog:
    name: TruffleHog – Verified Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@7e78694e4d68e5007e93e97c091d95a5a8e1bb77 # v3.88.0
        with:
          extra_args: >-
            --only-verified
            --results=verified
            --exclude-paths=.trufflehog-exclude-paths.txt

  # ── Gitleaks v8 ────────────────────────────────────────────────────────────
  gitleaks:
    name: Gitleaks – Regex + Entropy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196e88a9c30 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ── GitGuardian (ggshield) ─────────────────────────────────────────────────
  ggshield:
    name: ggshield – GitGuardian ML Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        if: ${{ secrets.GITGUARDIAN_API_KEY != '' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: GitGuardian scan
        if: ${{ secrets.GITGUARDIAN_API_KEY != '' }}
        uses: GitGuardian/ggshield-action@46f0a6a91e7abab21c7e5d86e1e47e84a3c7e9b9 # v1.35.0
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  # ── detect-secrets (baseline check) ────────────────────────────────────────
  detect-secrets:
    name: detect-secrets – Baseline Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Run detect-secrets scan
        run: |
          if [ -f .secrets.baseline ]; then
            # Re-scan and compare against committed baseline
            detect-secrets scan \
              --baseline .secrets.baseline \
              --exclude-files '\.secrets\.baseline$' \
              --exclude-files 'package-lock\.json$' \
              --exclude-files 'bun\.lockb$' \
              --exclude-files 'bun\.lock$' \
              --exclude-files 'pubspec\.lock$' \
              --exclude-files '\.env\.example$' \
              --exclude-files '.*\.ipynb$' \
              --exclude-files 'Data/.*' \
              --exclude-files 'Results/.*' \
              --exclude-files 'test_env/.*' \
              --exclude-files 'sbom-cyclonedx\.json$'

            echo "### detect-secrets Baseline Check" >> "$GITHUB_STEP_SUMMARY"
            echo "Baseline scan completed. No new secrets detected." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No .secrets.baseline found. Run: detect-secrets scan > .secrets.baseline"
            detect-secrets scan \
              --exclude-files '\.secrets\.baseline$' \
              --exclude-files 'package-lock\.json$' \
              --exclude-files 'bun\.lockb$' \
              --exclude-files '.*\.ipynb$' \
              --exclude-files 'Data/.*' \
              --exclude-files 'Results/.*' \
              > /tmp/baseline-check.json

            # Check if any secrets were found
            SECRETS_COUNT=$(python3 -c "
            import json
            with open('/tmp/baseline-check.json') as f:
                data = json.load(f)
            count = sum(len(v) for v in data.get('results', {}).values())
            print(count)
            ")

            if [ "$SECRETS_COUNT" -gt 0 ]; then
              echo "::error::Found $SECRETS_COUNT potential secrets. Create a baseline: detect-secrets scan > .secrets.baseline"
              exit 1
            fi
          fi

  # ── Summary gate ───────────────────────────────────────────────────────────
  secret-scan-gate:
    name: Secret Scan Gate
    runs-on: ubuntu-latest
    needs: [trufflehog, gitleaks, detect-secrets]
    # ggshield is optional (may be skipped on forks without API key)
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check scanner results
        run: |
          echo "### Secret Scanning Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          FAILED=0

          check_job() {
            local name="$1"
            local result="$2"
            if [ "$result" = "failure" ]; then
              echo "- :x: **$name**: FAILED — secrets detected" >> "$GITHUB_STEP_SUMMARY"
              FAILED=1
            elif [ "$result" = "success" ]; then
              echo "- :white_check_mark: **$name**: passed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- :warning: **$name**: $result" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          check_job "TruffleHog"     "${{ needs.trufflehog.result }}"
          check_job "Gitleaks"       "${{ needs.gitleaks.result }}"
          check_job "detect-secrets" "${{ needs.detect-secrets.result }}"

          # ggshield is optional
          GGSHIELD_RESULT="${{ needs.ggshield.result || 'skipped' }}"
          if [ "$GGSHIELD_RESULT" = "failure" ]; then
            echo "- :x: **ggshield**: FAILED" >> "$GITHUB_STEP_SUMMARY"
            FAILED=1
          elif [ "$GGSHIELD_RESULT" = "skipped" ]; then
            echo "- :fast_forward: **ggshield**: skipped (no GITGUARDIAN_API_KEY)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- :white_check_mark: **ggshield**: passed" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo ":rotating_light: **Action required**: Review and remediate detected secrets before merging." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
