# =============================================================================
# URA Chatbot — provision the Cloudflare relay secret (one-off, on demand)
#
# Generates CF_RELAY_SECRET inside the runner (masked immediately, never
# echoed) and pushes it to BOTH sides of the relay: Crane Cloud (env-only
# PATCH, same pattern as ura-chatbot-deploy-cranecloud.yml) and the HF Space
# (HfApi-equivalent REST secrets endpoint). Also sets CF_RELAY_BASE_URL on
# the HF Space only, pointing at the Crane Cloud app — Crane Cloud itself
# must NOT have this var set, or it would try to relay to itself.
#
# Re-run to ROTATE the secret (idempotent: always regenerates + overwrites).
# =============================================================================
name: "URA Chatbot — Set Cloudflare relay secret"

on:
  workflow_dispatch:

concurrency:
  group: ura-chatbot-set-cf-relay-secret
  cancel-in-progress: false

permissions:
  contents: read

env:
  CRANE_CLOUD_API: https://api.cranecloud.io
  CRANE_APP_URL: https://ura-chatbot-6318a1b5.renu-01.cranecloud.io
  HF_REPO: landwind22/ura-chatbot

jobs:
  set-relay-secret:
    name: Provision CF_RELAY_SECRET
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Validate required repo-level secrets
        env:
          CRANE_CLOUD_EMAIL: ${{ secrets.CRANE_CLOUD_EMAIL }}
          CRANE_CLOUD_PASSWORD: ${{ secrets.CRANE_CLOUD_PASSWORD }}
          CRANE_CLOUD_URA_APP_ID: ${{ secrets.CRANE_CLOUD_URA_APP_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          : "${CRANE_CLOUD_EMAIL:?CRANE_CLOUD_EMAIL repo secret is missing}"
          : "${CRANE_CLOUD_PASSWORD:?CRANE_CLOUD_PASSWORD repo secret is missing}"
          : "${CRANE_CLOUD_URA_APP_ID:?CRANE_CLOUD_URA_APP_ID repo secret is missing}"
          : "${HF_TOKEN:?HF_TOKEN repo secret is missing}"

      - name: Generate the relay secret
        id: gen
        run: |
          set -euo pipefail
          SECRET=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          echo "::add-mask::$SECRET"
          echo "secret=$SECRET" >> "$GITHUB_OUTPUT"

      - name: Set CF_RELAY_SECRET on Crane Cloud (env-only PATCH)
        env:
          CRANE_EMAIL: ${{ secrets.CRANE_CLOUD_EMAIL }}
          CRANE_PASSWORD: ${{ secrets.CRANE_CLOUD_PASSWORD }}  # pragma: allowlist secret
          CRANE_APP_ID: ${{ secrets.CRANE_CLOUD_URA_APP_ID }}
          RELAY_SECRET: ${{ steps.gen.outputs.secret }}  # pragma: allowlist secret
        run: |  # pragma: allowlist secret
          set -euo pipefail

          LOGIN_BODY=$(python3 -c "import json,os; print(json.dumps({'email': os.environ['CRANE_EMAIL'], 'password': os.environ['CRANE_PASSWORD']}))")  # pragma: allowlist secret
          TOKEN=""
          for attempt in 1 2 3; do
            LOGIN=$(curl -sS -X POST "$CRANE_CLOUD_API/users/login" \
              -H 'Content-Type: application/json' -d "$LOGIN_BODY" || true)
            TOKEN=$(printf '%s' "$LOGIN" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['access_token'])" 2>/dev/null || true)
            [[ -n "$TOKEN" ]] && break
            echo "Crane Cloud login attempt $attempt/3 failed — retrying in 5s…"
            sleep 5
          done
          echo "::add-mask::$TOKEN"
          [[ -n "$TOKEN" ]] || { echo "::error::Crane Cloud login returned no access_token after 3 attempts"; exit 1; }

          # env-only PATCH: fetch the full current dict, merge, send it whole
          # (no `image` key — including one forces Docker Hub re-validation).
          # `-f` makes curl itself fail (nonzero exit, caught by `set -e`) on
          # a non-2xx GET, and the Python side separately refuses to proceed
          # if `data.apps` isn't the expected shape — either way we abort
          # BEFORE building PATCH_BODY, since falling through to an empty/
          # partial env dict would let the PATCH silently wipe every other
          # production env var Crane Cloud already has set.
          GET=$(curl -sSf "$CRANE_CLOUD_API/apps/$CRANE_APP_ID" -H "Authorization: Bearer $TOKEN")
          PATCH_BODY=$(printf '%s' "$GET" | RELAY_SECRET="$RELAY_SECRET" python3 -c "import json, os, sys; d = json.loads(sys.stdin.read()); apps = (d.get('data') or {}).get('apps'); sys.exit('GET /apps response missing data.apps — aborting before PATCH to avoid wiping env_vars') if not isinstance(apps, dict) else None; env = dict(apps.get('env_vars') or {}); env['CF_RELAY_SECRET'] = os.environ['RELAY_SECRET']; print(json.dumps({'env_vars': env}))")
          PATCH=$(curl -sS -X PATCH "$CRANE_CLOUD_API/apps/$CRANE_APP_ID" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$PATCH_BODY")
          OK=$(printf '%s' "$PATCH" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))" 2>/dev/null || echo parse_err)
          if [[ "$OK" != "success" ]]; then
            echo "::error::Crane Cloud env PATCH failed: $OK"
            # Never print the raw response: PATCH_BODY (just sent) carries
            # every production env var, and if the server's error message
            # echoes the payload back, that would leak all of them in plain
            # text into the Actions log — print only a bounded status field.
            printf '%s' "$PATCH" | python3 -c "import sys,json; d=json.load(sys.stdin); print((d.get('message') or d.get('error') or 'no error message in response')[:300])" 2>/dev/null || echo "Crane Cloud PATCH failed and its response could not be parsed — response withheld from logs to avoid leaking secrets it may echo back"
            exit 1
          fi
          echo "✓ CF_RELAY_SECRET set on Crane Cloud (rolling pod restart triggered)"

      - name: Push CF_RELAY_SECRET + CF_RELAY_BASE_URL to the HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RELAY_SECRET: ${{ steps.gen.outputs.secret }}  # pragma: allowlist secret
          HF_REPO: ${{ env.HF_REPO }}
          CRANE_APP_URL: ${{ env.CRANE_APP_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          hf_token = os.environ["HF_TOKEN"]
          hf_repo = os.environ["HF_REPO"]

          def set_hf_secret(key: str, value: str) -> None:
              req = urllib.request.Request(
                  f"https://huggingface.co/api/spaces/{hf_repo}/secrets",
                  data=json.dumps({"key": key, "value": value}).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {hf_token}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      code = resp.status
                      if code not in (200, 201, 204):
                          print(f"::error::Setting HF secret {key} failed (HTTP {code})", file=sys.stderr)
                          sys.exit(1)
                      print(f"✓ HF secret {key} set (HTTP {code})")
              except urllib.error.HTTPError as e:
                  print(f"::error::Setting HF secret {key} failed (HTTP {e.code})", file=sys.stderr)
                  sys.exit(1)

          set_hf_secret("CF_RELAY_SECRET", os.environ["RELAY_SECRET"])
          set_hf_secret("CF_RELAY_BASE_URL", os.environ["CRANE_APP_URL"])
          print("Space will rebuild/restart with the new secrets.")
          PY

      - name: Summary
        if: always()
        run: |
          {
            echo "### URA Chatbot — Cloudflare relay secret provisioned"
            echo
            echo "- Crane Cloud (\`$CRANE_APP_URL\`): \`CF_RELAY_SECRET\` set (relay host — no \`CF_RELAY_BASE_URL\`)"
            echo "- HF Space (\`$HF_REPO\`): \`CF_RELAY_SECRET\` + \`CF_RELAY_BASE_URL\` set (relay client)"
            echo "- status: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
