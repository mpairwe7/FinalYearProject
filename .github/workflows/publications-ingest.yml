# Nightly publication hash-diff (G15). Never auto-recreates the index.
name: Publications ingest

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publications-ingest
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Hash-diff URA publications URL
        env:
          URA_PUBLICATIONS_URL: ${{ vars.URA_PUBLICATIONS_URL }}
        run: |
          # A green run that did nothing must say so. The crawl's weekday change
          # check is what keeps notices current (ADR-0023).
          if [ -z "$URA_PUBLICATIONS_URL" ]; then
            echo "::warning::URA_PUBLICATIONS_URL is unset, so this run checked nothing."
            exit 0
          fi
          python -m app.publications
          echo "Re-index remains manual: python -m app.index_lifecycle --rebuild"
