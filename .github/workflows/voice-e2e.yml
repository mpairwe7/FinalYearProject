# =============================================================================
# URA Chatbot — Voice E2E (STT/TTS)
#
# The Playwright suite is not otherwise run in CI; this workflow runs the voice
# specs, which need a real headless Chrome (blocked in the dev sandbox).
#
#   Tier A (tier-a-mocked)      — browser drives the real getUserMedia →
#       MediaRecorder → AudioContext capture pipeline against Chromium's fake
#       media device; /api/* is stubbed (helpers.ts). Asserts the UI state
#       machine + request contract (raw-audio body, X-Voice-Consent, sample_rate).
#
#   Tier B (tier-b-integration) — same browser flow against a REAL FastAPI
#       backend reached via the Next.js /api rewrite, started with deterministic
#       mock speech backends (no heavy models, no network): /v1/speech/health
#       ready, /v1/tts real WAV, /v1/voice/chat graceful no-speech path.
# =============================================================================
name: "URA Chatbot — Voice E2E (STT/TTS)"

on:
  push:
    paths: &voice_paths
      - "App/frontend/e2e/**"
      - "App/frontend/playwright.config.ts"
      - "App/frontend/src/components/Voice*.tsx"
      - "App/frontend/src/components/ChatInput.tsx"
      - "App/frontend/src/components/ChatMessage.tsx"
      - "App/frontend/src/components/ThemeToggle.tsx"
      - "App/frontend/src/services/voice*.ts"
      - "App/frontend/src/hooks/useSpeech.ts"
      - "App/frontend/src/hooks/useTheme.ts"
      - "App/frontend/src/lib/theme.ts"
      - "App/frontend/src/app/layout.tsx"
      - "App/frontend/src/app/globals.css"
      - "App/backend/app/speech_service.py"
      - ".github/workflows/voice-e2e.yml"
  pull_request:
    paths: *voice_paths
  workflow_dispatch:

concurrency:
  group: voice-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.12"
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # Tier A — fully mocked browser E2E (no backend).
  # ---------------------------------------------------------------------------
  tier-a-mocked:
    name: Tier A — mocked browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: App/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8887
        run: bun run build

      - name: Start frontend
        run: |
          bun run start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null 2>&1 && { echo "frontend up"; break; }
            sleep 1
          done

      - name: Run voice.spec.ts (chromium + mobile-chrome)
        run: bunx playwright test e2e/voice.spec.ts --project=chromium --project=mobile-chrome

      - name: Run voice.mobile.spec.ts (mobile-chrome)
        run: bunx playwright test e2e/voice.mobile.spec.ts --project=mobile-chrome

      - name: Run ui-theme.spec.ts (copy + theme — chromium + mobile-chrome)
        run: bunx playwright test e2e/ui-theme.spec.ts --project=chromium --project=mobile-chrome

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-tier-a
          path: App/frontend/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Tier B — real FastAPI backend with deterministic mock speech backends.
  # ---------------------------------------------------------------------------
  tier-b-integration:
    name: Tier B — real backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7.3.1

      - name: Install backend (minimal — keyword retrieval + mock speech)
        # Deliberately NOT torch/transformers/qdrant/sentence-transformers: the
        # app boots in keyword-fallback + mock-speech mode, which is all the
        # voice endpoints need. Keeps the job fast and free of HF model downloads.
        run: |
          uv pip install --system \
            "fastapi>=0.136.1,<0.137" "uvicorn[standard]>=0.46,<0.47" \
            "pydantic>=2.13,<2.14" "pydantic-settings>=2.5" "email-validator>=2.0" \
            "slowapi>=0.1.9" "limits>=3.13" "sse-starlette>=2.0" \
            "numpy>=2.4,<3" "pandas>=2.2" "lingua-language-detector>=2.0" \
            "cryptography>=44" "dnspython>=2.6" "boto3>=1.34" "httpx"

      - name: Start backend (mock speech backends)
        working-directory: App/backend
        env:
          SPEECH_ENABLED: "true"
          SPEECH_ASR_BACKEND: mock
          SPEECH_TTS_BACKEND: mock
          SPEECH_MT_BACKEND: mock
          LLM_ENABLED: "false"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          CORS_ORIGINS: http://localhost:3000
        run: |
          PYTHONPATH=. python -m uvicorn app.main:app \
            --host 127.0.0.1 --port 8887 --log-level warning &
          for i in $(seq 1 60); do
            s=$(curl -s --max-time 3 http://127.0.0.1:8887/v1/speech/health \
                  | python -c "import sys,json;print(json.load(sys.stdin).get('status'))" 2>/dev/null || echo none)
            echo "[$i] speech health: $s"
            [ "$s" = "ready" ] && { echo "backend ready"; exit 0; }
            sleep 2
          done
          echo "::error::backend /v1/speech/health did not reach 'ready'"; exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frontend dependencies
        working-directory: App/frontend
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: App/frontend
        run: bunx playwright install --with-deps chromium

      - name: Build frontend (proxy /api → backend)
        working-directory: App/frontend
        env:
          INTERNAL_API_URL: http://127.0.0.1:8887
        run: bun run build

      - name: Start frontend
        working-directory: App/frontend
        env:
          INTERNAL_API_URL: http://127.0.0.1:8887
        run: |
          bun run start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null 2>&1 && { echo "frontend up"; break; }
            sleep 1
          done

      - name: Run Tier B integration spec
        working-directory: App/frontend
        env:
          VOICE_INTEGRATION: "1"
        run: bunx playwright test e2e/voice.integration.spec.ts --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-tier-b
          path: App/frontend/playwright-report/
          retention-days: 7
