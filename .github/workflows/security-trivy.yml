# =============================================================================
# Trivy Security Scanning Pipeline – URA Chatbot (2026)
#
# Comprehensive supply chain & container security:
#   1. Filesystem scan       – vulnerabilities in Python/Node.js/Dart dependencies
#   2. IaC misconfig scan    – Dockerfiles, docker-compose, CI workflows
#   3. Container image scans – all 3 Dockerfiles (API, ML, Frontend)
#   4. SBOM generation       – CycloneDX for each image (supply chain transparency)
#   5. License compliance    – block copyleft licenses in production
#   6. Secret scanning       – backup layer to pre-commit hooks
#   7. PR Comment Summary    – interactive comment reporting on Pull Requests
#
# Results uploaded to: GitHub Security tab (SARIF), artifacts (JSON/CycloneDX)
# =============================================================================
name: "Security: Trivy Scanning"

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]
  schedule:
    # Weekly full scan – catch newly disclosed CVEs against existing code
    - cron: "0 3 * * 1"  # Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write     # Required for PR summary comments
  security-events: write   # Upload SARIF to GitHub Security tab
  actions: read            # Required for SARIF upload

concurrency:
  group: trivy-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: "0.69.3"
  API_IMAGE: "landwind/ura-chatbot-api:trivy-scan"
  FRONTEND_IMAGE: "landwind/ura-chatbot-frontend:trivy-scan"

jobs:
  # ============================================
  # 0. PR Image Scan Scope
  # ============================================
  image-change-filter:
    name: "Image Scan Scope"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Determine changed image paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          api=true
          frontend=true

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            api=false
            frontend=false

            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            changed_paths="$(git diff --name-only "origin/${{ github.base_ref }}" HEAD)"

            while IFS= read -r path; do
              [ -n "$path" ] || continue
              case "$path" in
                Dockerfile|.dockerignore|trivy.yaml|App/backend/*|App/docker-compose.yml)
                  api=true
                  ;;
              esac
              case "$path" in
                trivy.yaml|App/frontend/*)
                  frontend=true
                  ;;
              esac
            done <<< "$changed_paths"
          fi

          {
            echo "api=$api"
            echo "frontend=$frontend"
          } >> "$GITHUB_OUTPUT"

          echo "## Trivy Image Scan Scope" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Scan? |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| API | $api |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend | $frontend |" >> "$GITHUB_STEP_SUMMARY"

  # ============================================
  # 1. Filesystem Dependency & Secret Scan
  # ============================================
  filesystem-scan:
    name: "Filesystem: Dependencies & Secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      critical_count: ${{ steps.parse-vulns.outputs.critical }}
      high_count: ${{ steps.parse-vulns.outputs.high }}
      medium_count: ${{ steps.parse-vulns.outputs.medium }}
      low_count: ${{ steps.parse-vulns.outputs.low }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Trivy filesystem scan (vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-fs-vuln.sarif
          trivy-config: trivy.yaml
          ignore-unfixed: true

      - name: Upload filesystem SARIF to GitHub Security
        if: always() && hashFiles('trivy-fs-vuln.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        continue-on-error: true
        with:
          sarif_file: trivy-fs-vuln.sarif
          category: trivy-filesystem

      - name: Run Trivy filesystem scan (JSON for artifact)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM,LOW
          format: json
          output: trivy-fs-results.json
          trivy-config: trivy.yaml

      - name: Parse filesystem vulnerability counts
        id: parse-vulns
        if: always()
        run: |
          if [ -f trivy-fs-results.json ]; then
            CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-fs-results.json 2>/dev/null || echo "0")
            HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-fs-results.json 2>/dev/null || echo "0")
            MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-fs-results.json 2>/dev/null || echo "0")
            LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-fs-results.json 2>/dev/null || echo "0")
          else
            CRITICAL=0; HIGH=0; MEDIUM=0; LOW=0
          fi

          echo "critical=${CRITICAL}" >> "$GITHUB_OUTPUT"
          echo "high=${HIGH}" >> "$GITHUB_OUTPUT"
          echo "medium=${MEDIUM}" >> "$GITHUB_OUTPUT"
          echo "low=${LOW}" >> "$GITHUB_OUTPUT"

          echo "## Filesystem Vulnerability Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Severity | Count |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔴 Critical | ${CRITICAL} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🟠 High | ${HIGH} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🟡 Medium | ${MEDIUM} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🟢 Low | ${LOW} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload filesystem results artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-filesystem-results
          path: |
            trivy-fs-vuln.sarif
            trivy-fs-results.json
          retention-days: 30

  # ============================================
  # 2. IaC Misconfiguration Scan
  # ============================================
  iac-scan:
    name: "IaC: Dockerfile & Compose Misconfigs"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      misconfig_count: ${{ steps.parse-iac.outputs.misconfigs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Trivy IaC misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          scanners: misconfig
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-iac.sarif
          trivy-config: trivy.yaml

      - name: Upload IaC SARIF to GitHub Security
        if: always() && hashFiles('trivy-iac.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        continue-on-error: true
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

      - name: Run IaC scan (table output for step summary)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          scanners: misconfig
          severity: CRITICAL,HIGH,MEDIUM
          format: json
          output: trivy-iac.json
          trivy-config: trivy.yaml
        continue-on-error: true

      - name: Parse IaC findings
        id: parse-iac
        if: always()
        run: |
          MISCONFIGS=0
          if [ -f trivy-iac.json ]; then
            MISCONFIGS=$(jq '[.Results[]?.Misconfigurations[]?] | length' trivy-iac.json 2>/dev/null || echo "0")
          fi
          echo "misconfigs=${MISCONFIGS}" >> "$GITHUB_OUTPUT"
          echo "## Trivy IaC Misconfigurations: ${MISCONFIGS}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IaC artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-iac-results
          path: |
            trivy-iac.sarif
            trivy-iac.json
          retention-days: 30

  # ============================================
  # 3. License Compliance Scan
  # ============================================
  license-scan:
    name: "License: Compliance Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      violations_count: ${{ steps.parse-lic.outputs.violations }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Trivy license scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          severity: CRITICAL,HIGH
          format: json
          output: trivy-license.json
          trivy-config: trivy.yaml
        continue-on-error: true

      - name: Parse and evaluate license violations
        id: parse-lic
        if: always()
        run: |
          echo "## Trivy License Compliance" >> "$GITHUB_STEP_SUMMARY"
          VIOLATIONS=0
          if [ -f trivy-license.json ]; then
            VIOLATIONS=$(python3 -c "
          import json, sys
          data = json.load(open('trivy-license.json'))
          results = data.get('Results', [])
          blocked = ['AGPL-1.0', 'AGPL-3.0', 'GPL-2.0', 'GPL-3.0', 'SSPL-1.0', 'BSL-1.1']
          violations = []
          for r in results:
            for lic in r.get('Licenses', []):
              if lic.get('Name') in blocked:
                violations.append(lic.get('Name'))
          print(len(violations))
          if violations:
            sys.exit(0)
          " 2>/dev/null || echo "0")
          fi
          echo "violations=${VIOLATIONS}" >> "$GITHUB_OUTPUT"
          echo "- Blocked license violations: ${VIOLATIONS}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload license results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-license-results
          path: trivy-license.json
          retention-days: 30

  # ============================================
  # 4. Container Image Scans + SBOM Generation
  # ============================================
  container-scan-api:
    name: "Container: API Image"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: image-change-filter
    if: needs.image-change-filter.outputs.api == 'true'
    outputs:
      critical_count: ${{ steps.parse-api.outputs.critical }}
      high_count: ${{ steps.parse-api.outputs.high }}
      medium_count: ${{ steps.parse-api.outputs.medium }}
      low_count: ${{ steps.parse-api.outputs.low }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build API image (local, no push)
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Trivy vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.API_IMAGE }}
          scanners: vuln
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-api-image.sarif
          trivy-config: trivy.yaml
          ignore-unfixed: true

      - name: Upload API image SARIF
        if: always() && hashFiles('trivy-api-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        continue-on-error: true
        with:
          sarif_file: trivy-api-image.sarif
          category: trivy-api-image

      - name: Run Trivy API image scan (JSON for parser)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.API_IMAGE }}
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM,LOW
          format: json
          output: trivy-api-image.json
          trivy-config: trivy.yaml

      - name: Parse API image vulnerability counts
        id: parse-api
        if: always()
        run: |
          if [ -f trivy-api-image.json ]; then
            CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-api-image.json 2>/dev/null || echo "0")
            HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-api-image.json 2>/dev/null || echo "0")
            MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-api-image.json 2>/dev/null || echo "0")
            LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-api-image.json 2>/dev/null || echo "0")
          else
            CRITICAL=0; HIGH=0; MEDIUM=0; LOW=0
          fi

          echo "critical=${CRITICAL}" >> "$GITHUB_OUTPUT"
          echo "high=${HIGH}" >> "$GITHUB_OUTPUT"
          echo "medium=${MEDIUM}" >> "$GITHUB_OUTPUT"
          echo "low=${LOW}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (CycloneDX)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.API_IMAGE }}
          format: cyclonedx
          output: sbom-api.cdx.json

      - name: Trivy secret scan on image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.API_IMAGE }}
          scanners: secret
          severity: CRITICAL,HIGH,MEDIUM
          format: json
          output: trivy-api-secrets.json
        continue-on-error: true

      - name: Upload API scan artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-api-results
          path: |
            trivy-api-image.sarif
            trivy-api-image.json
            sbom-api.cdx.json
            trivy-api-secrets.json
          retention-days: 90

  container-scan-frontend:
    name: "Container: Frontend Image"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: image-change-filter
    if: needs.image-change-filter.outputs.frontend == 'true'
    outputs:
      critical_count: ${{ steps.parse-frontend.outputs.critical }}
      high_count: ${{ steps.parse-frontend.outputs.high }}
      medium_count: ${{ steps.parse-frontend.outputs.medium }}
      low_count: ${{ steps.parse-frontend.outputs.low }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Frontend image (local, no push)
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./App/frontend
          file: ./App/frontend/Dockerfile
          push: false
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Trivy vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}
          scanners: vuln
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-frontend-image.sarif
          trivy-config: trivy.yaml
          ignore-unfixed: true

      - name: Upload Frontend image SARIF
        if: always() && hashFiles('trivy-frontend-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        continue-on-error: true
        with:
          sarif_file: trivy-frontend-image.sarif
          category: trivy-frontend-image

      - name: Run Trivy Frontend image scan (JSON for parser)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM,LOW
          format: json
          output: trivy-frontend-image.json
          trivy-config: trivy.yaml

      - name: Parse Frontend image vulnerability counts
        id: parse-frontend
        if: always()
        run: |
          if [ -f trivy-frontend-image.json ]; then
            CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-frontend-image.json 2>/dev/null || echo "0")
            HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-frontend-image.json 2>/dev/null || echo "0")
            MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-frontend-image.json 2>/dev/null || echo "0")
            LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-frontend-image.json 2>/dev/null || echo "0")
          else
            CRITICAL=0; HIGH=0; MEDIUM=0; LOW=0
          fi

          echo "critical=${CRITICAL}" >> "$GITHUB_OUTPUT"
          echo "high=${HIGH}" >> "$GITHUB_OUTPUT"
          echo "medium=${MEDIUM}" >> "$GITHUB_OUTPUT"
          echo "low=${LOW}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (CycloneDX)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}
          format: cyclonedx
          output: sbom-frontend.cdx.json

      - name: Upload Frontend scan artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-frontend-results
          path: |
            trivy-frontend-image.sarif
            trivy-frontend-image.json
            sbom-frontend.cdx.json
          retention-days: 90

  # ============================================
  # 5. PR Security Summary Comment
  # ============================================
  pr-comment:
    name: "PR Security Scan Summary"
    runs-on: ubuntu-latest
    needs:
      - filesystem-scan
      - iac-scan
      - license-scan
      - container-scan-api
      - container-scan-frontend
    if: github.event_name == 'pull_request' && always()
    steps:
      - name: Create or update PR security summary comment
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- security-trivy-summary -->';
            const fsCritical = parseInt('${{ needs.filesystem-scan.outputs.critical_count }}' || '0');
            const fsHigh = parseInt('${{ needs.filesystem-scan.outputs.high_count }}' || '0');
            const fsMedium = parseInt('${{ needs.filesystem-scan.outputs.medium_count }}' || '0');
            const fsLow = parseInt('${{ needs.filesystem-scan.outputs.low_count }}' || '0');

            const apiCritical = parseInt('${{ needs.container-scan-api.outputs.critical_count }}' || '0');
            const apiHigh = parseInt('${{ needs.container-scan-api.outputs.high_count }}' || '0');
            const apiMedium = parseInt('${{ needs.container-scan-api.outputs.medium_count }}' || '0');
            const apiLow = parseInt('${{ needs.container-scan-api.outputs.low_count }}' || '0');

            const feCritical = parseInt('${{ needs.container-scan-frontend.outputs.critical_count }}' || '0');
            const feHigh = parseInt('${{ needs.container-scan-frontend.outputs.high_count }}' || '0');
            const feMedium = parseInt('${{ needs.container-scan-frontend.outputs.medium_count }}' || '0');
            const feLow = parseInt('${{ needs.container-scan-frontend.outputs.low_count }}' || '0');

            const misconfigs = parseInt('${{ needs.iac-scan.outputs.misconfig_count }}' || '0');
            const licenseViolations = parseInt('${{ needs.license-scan.outputs.violations_count }}' || '0');

            const totalCritical = fsCritical + apiCritical + feCritical;
            const totalHigh = fsHigh + apiHigh + feHigh;
            const totalMedium = fsMedium + apiMedium + feMedium;
            const totalLow = fsLow + apiLow + feLow;

            const hasBlocking = totalCritical > 0 || totalHigh > 0 || licenseViolations > 0;
            const statusEmoji = hasBlocking ? '🚨' : '✅';
            const statusText = hasBlocking ? 'Action Required' : 'Passed';

            const body = `${marker}
            ## ${statusEmoji} Trivy Security Scan Results — ${statusText}

            ### Vulnerability & Compliance Summary

            | Target / Scanner | 🔴 Critical | 🟠 High | 🟡 Medium | 🟢 Low | Status |
            |------------------|------------:|--------:|----------:|-------:|:------:|
            | **Filesystem & Dependencies** | ${fsCritical} | ${fsHigh} | ${fsMedium} | ${fsLow} | ${(fsCritical + fsHigh) > 0 ? '❌' : '✅'} |
            | **IaC Misconfigurations** | - | - | - | ${misconfigs} | ${misconfigs > 0 ? '⚠️' : '✅'} |
            | **License Compliance** | - | - | - | - | ${licenseViolations > 0 ? '❌' : '✅'} |
            | **API Container Image** | ${apiCritical} | ${apiHigh} | ${apiMedium} | ${apiLow} | ${(apiCritical + apiHigh) > 0 ? '❌' : '✅'} |
            | **Frontend Container Image** | ${feCritical} | ${feHigh} | ${feMedium} | ${feLow} | ${(feCritical + feHigh) > 0 ? '❌' : '✅'} |
            | **Total Vulnerabilities** | **${totalCritical}** | **${totalHigh}** | **${totalMedium}** | **${totalLow}** | **${hasBlocking ? '❌' : '✅'}** |

            ${hasBlocking ? `
            ⚠️ **This PR has blocking security findings (HIGH/CRITICAL vulnerabilities or blocked licenses).**
            Please review the findings in the Security tab or workflow artifacts and remediate before merging.
            ` : `
            ✅ **No blocking vulnerabilities or license violations detected.**
            `}

            ---
            <details>
            <summary>📊 Scan Details & Artifacts</summary>

            - **Scanner**: Trivy v${process.env.TRIVY_VERSION || '0.69.3'}
            - **SBOMs**: CycloneDX format generated for all images (in workflow artifacts)
            - **Security Tab**: Detailed SARIF reports in [Code Scanning](../../security/code-scanning)
            - **Artifacts**: Download \`trivy-filesystem-results\`, \`trivy-api-results\`, \`trivy-frontend-results\`

            </details>

            ---
            *Powered by [Trivy](https://trivy.dev/) Security Scanner*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # ============================================
  # 6. Summary Gate
  # ============================================
  security-gate:
    name: "Security Gate: All Scans"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - filesystem-scan
      - iac-scan
      - license-scan
      - container-scan-api
      - container-scan-frontend
    if: ${{ !cancelled() }}
    steps:
      - name: Evaluate scan results
        run: |
          echo "## Trivy Security Gate Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Scan | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"

          results='${{ toJson(needs) }}'
          overall="pass"

          for job in filesystem-scan iac-scan license-scan container-scan-api container-scan-frontend; do
            status=$(echo "$results" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('${job}',{}).get('result','unknown'))" 2>/dev/null || echo "unknown")
            if [ "$status" = "success" ]; then
              icon="✅"
            elif [ "$status" = "skipped" ]; then
              icon="⏭️"
            else
              icon="❌"
              overall="fail"
            fi
            echo "| ${job} | ${icon} ${status} |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$overall" = "fail" ]; then
            echo "**❌ Security gate FAILED – review findings in the Security tab.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "**✅ All security scans passed.**" >> "$GITHUB_STEP_SUMMARY"
          fi
