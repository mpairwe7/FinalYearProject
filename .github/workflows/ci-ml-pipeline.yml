# MLOps CI/CD Pipeline for URA Chatbot
# Handles: linting, testing, data validation, Docker builds
#
# Security scanning is handled by dedicated workflows:
#   - security-trivy.yml      → SCA, IaC, license, container, SBOM
#   - devsecops-sast-dast.yml → Semgrep, Bandit, pip-audit, Checkov, ZAP, Scorecard, threat model
#   - secret-scanning.yml     → TruffleHog, Gitleaks, ggshield, detect-secrets
name: ML Pipeline CI/CD

on:
  push:
    branches: [main, dev, develop]
    paths:
      - 'ml/**'
      - 'App/backend/**'
      - 'Data/**'
      - 'Model/**'
      - 'requirements.txt'
      # This workflow's own test job runs `pytest tests/`, so a change to that
      # suite has to trigger it. Without this the guards living there — the
      # endpoint manifest, the coverage registry, the locked surface count —
      # were only ever evaluated when some OTHER path changed, so a fix to them
      # (or a break in them) could sit unverified until an unrelated commit.
      - 'tests/**'
      # pytest's configfile — it sets the rootdir and options this job runs under.
      - 'pyproject.toml'
      - '.github/workflows/ci-ml-pipeline.yml'
  pull_request:
    branches: [main, dev, develop]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ml-pipeline-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE || 'landwind/ura-chatbot-api' }}

jobs:
  # ============================================
  # Stage 1: Code Quality & Linting
  # ============================================
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7.3.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv pip install --system ruff pytest pytest-cov
          uv pip install --system -r requirements.txt

      - name: Run Ruff linter
        run: |
          # Blocking lint is limited to syntax/undefined-name classes so CI
          # catches production-breaking Python errors without failing on
          # legacy style debt already reported by advisory scans.
          ruff check ml/ App/backend/ --select=E9,F63,F7,F82 --output-format=github

      - name: Ruff style report (advisory)
        if: always()
        run: ruff check ml/ App/backend/ --statistics --exit-zero

      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=ml --cov=App/backend --cov-report=xml --cov-report=term-missing --cov-fail-under=35

      - name: Install backend test dependencies
        run: |
          # The Crane Cloud requirements deliberately exclude the
          # torch/transformers/sentence-transformers stack, and together with the
          # root requirements they cover every backend import — so the backend
          # suite runs here in the same keyword-fallback shape it runs locally,
          # without a multi-gigabyte torch download.
          uv pip install --system -r App/backend/requirements-cranecloud.txt

      - name: Run backend unit tests
        # The repo-root suite above never touched App/backend/tests, so the
        # backend suite — the majority of the project's tests, including the
        # corpus-validation and retrieval-ranking contracts — was ungated.
        working-directory: App/backend
        env:
          PYTHONPATH: .
        run: pytest tests/ -q

      - name: Corpus contract round-trip
        # Exercises export → validate → ingest on the committed crawl corpus, so
        # a change that breaks chunking, page selection, or the manifest contract
        # fails here rather than at the next reindex. Uses the real 1,000+ page
        # crawl (seconds); the PDF corpus is deliberately excluded because
        # extracting 290 MB takes far too long for a PR gate.
        working-directory: App/backend
        env:
          # "." for the app package, workspace root for the ml chunker the
          # exporters import.
          PYTHONPATH: .:${{ github.workspace }}
          REPO_ROOT: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import os
          import tempfile
          from pathlib import Path

          from app.crawl_corpus import export_crawl_pages_to_jsonl, ingest_crawl_jsonls
          from app.faq_corpus import export_faq_csvs_to_jsonl, ingest_faq_jsonls

          root = Path(os.environ["REPO_ROOT"])
          with tempfile.TemporaryDirectory() as tmp:
              out = Path(tmp)

              faq_stats = export_faq_csvs_to_jsonl(root / "Data" / "dataset", out / "faq_jsonl")
              faq_docs = ingest_faq_jsonls(root / "Data" / "dataset", out / "faq_jsonl")
              assert len(faq_docs) == faq_stats["records"], (len(faq_docs), faq_stats)
              print(f"FAQ corpus OK: {len(faq_docs)} documents from {faq_stats['sources']} CSVs")

              pages = root / "Data" / "crawl" / "pages"
              crawl_stats = export_crawl_pages_to_jsonl(pages, out / "crawl_jsonl")
              crawl_docs = ingest_crawl_jsonls(pages, out / "crawl_jsonl")
              assert len(crawl_docs) == crawl_stats["records"], (len(crawl_docs), crawl_stats)
              assert all(d["url"] and d["chunk_id"] for d in crawl_docs)
              print(
                  f"Crawl corpus OK: {crawl_stats['pages_selected']}/"
                  f"{crawl_stats['pages_available']} pages -> {len(crawl_docs)} chunks"
              )
          PY

      - name: Retrieval ranking gate
        # Real Hit@k / MRR against ground truth that needs no hand labelling: each
        # FAQ entry is the single correct answer for a query derived from it
        # (verbatim, and with its rarest terms dropped to model a user who does
        # not know the jargon). This is the ranking measurement the offline eval
        # cannot make — its eval set carries no relevance labels.
        #
        # BM25-only here: the static dense index needs sentence-transformers,
        # which this job deliberately does not install. BM25 is also what serves
        # when no dense backend is reachable, so it is the right floor to defend.
        # Measured 92.1% verbatim Hit@1 (n=506); the gate sits below that with
        # headroom so it catches regressions without flapping.
        working-directory: App/backend
        env:
          PYTHONPATH: .:${{ github.workspace }}
          LLM_ENABLED: 'false'
          QDRANT_ENABLED: 'false'
        run: python -m ml.scripts.eval_retrieval --min-hit1 0.90

      - name: Corpus coverage gate
        # Issue #303. Every gate above scores rows the corpus was BUILT from —
        # ask an indexed FAQ its own question and it retrieves itself, so a
        # subject the corpus simply does not cover is invisible. That is how
        # "How do I object to a tax assessment I disagree with?" reached
        # production abstaining.
        #
        # This asks the questions taxpayers ask instead (Data/eval/coverage_bank.jsonl,
        # drawn from URA contact-centre themes) and gates the answered rate per
        # tax domain against the floors in Data/eval/coverage_domains.yaml, plus
        # a whole-bank floor. Every abstention and every on-topic-but-wrong
        # answer is printed by question, so a failure is a work list.
        #
        # English only: the indexed corpus is English, and Luganda/Kiswahili
        # coverage is a property of translate-then-retrieve rather than of the
        # corpus. Those are measured with `--mode api` against a running
        # deployment (docs/runbooks/corpus-coverage.md), which this job has not
        # got. Runs offline in seconds — no Qdrant, no LLM, no network.
        working-directory: App/backend
        env:
          PYTHONPATH: .:${{ github.workspace }}
          LLM_ENABLED: 'false'
          QDRANT_ENABLED: 'false'
          SPEECH_ENABLED: 'false'
        run: |
          python -m ml.pipelines.corpus_coverage \
            --languages en \
            --fail-under-floor \
            --output "${RUNNER_TEMP}/corpus_coverage.json"

      - name: Publish corpus coverage figures
        if: always()
        # The per-domain figure is the deliverable, not just the pass/fail —
        # it belongs where a reviewer sees it without opening an artifact.
        working-directory: App/backend
        run: |
          test -f "${RUNNER_TEMP}/corpus_coverage.json" || exit 0
          python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json, os

          report = json.load(open(f"{os.environ['RUNNER_TEMP']}/corpus_coverage.json"))
          totals = report["totals"]
          print("## Corpus coverage (issue #303)\n")
          print(
              f"**{totals['coverage']:.1%}** of {totals['scored']} curated taxpayer "
              f"questions answered on target "
              f"(floor {totals.get('floor', 0):.0%}) — "
              f"{totals['abstained']} abstained, {totals['weak']} answered off target.\n"
          )
          print("| Domain | Coverage | Floor | Abstained | Weak |")
          print("| --- | ---: | ---: | ---: | ---: |")
          for name, row in report["by_domain"].items():
              mark = "" if row["passed"] else " :x:"
              print(
                  f"| {row['label']}{mark} | {row['coverage']:.0%} | {row['floor']:.0%} "
                  f"| {row['abstained']} | {row['weak']} |"
              )
          gaps = report["gaps"]
          if gaps:
              print(f"\n<details><summary>{len(gaps)} gaps by question</summary>\n")
              for gap in gaps:
                  print(f"- `{gap['status']}` **{gap['domain']}** — {gap['question']}")
              print("\n</details>")
          pending = report["meta"].get("pending_ura_signoff") or []
          if pending:
              print(
                  f"\n{len(pending)} domain(s) still awaiting URA domain-owner "
                  f"sign-off on the question bank: {', '.join(pending)}."
              )
          PY

      - name: Live-retrieval evaluation smoke
        # evaluate_rag_offline is the only pipeline that drives real retrieval
        # (the CI grounding gate scores frozen contexts), and it had never run
        # against this repository's eval set — it raised KeyError: 'query' on the
        # first row. This asserts it executes and produces every metric, so that
        # schema drift is caught here instead of going unnoticed.
        #
        # Deliberately not gated on metric thresholds: with no Qdrant this runs
        # in keyword-fallback mode, and the ranking metrics need
        # `relevant_sources` labels the eval set does not yet carry, so any
        # threshold would be measuring the harness rather than the system.
        env:
          LLM_ENABLED: 'false'
          QDRANT_ENABLED: 'false'
          SPEECH_ENABLED: 'false'
        run: |
          python -m ml.pipelines.evaluate_rag_offline \
            --eval-set Data/eval/rag_eval.jsonl \
            --output "${RUNNER_TEMP}/rag_offline_report.json"
          python - <<'PY'
          import json
          import os

          report = json.load(open(f"{os.environ['RUNNER_TEMP']}/rag_offline_report.json"))
          agg = report["aggregates"]
          required = {
              "faithfulness_mean",
              "answer_relevancy_mean",
              "context_precision_mean",
              "context_recall_mean",
              "mrr_mean",
              "hit_at_k_mean",
              "total_evaluated",
              "total_errors",
          }
          missing = required - set(agg)
          assert not missing, f"report is missing metrics: {sorted(missing)}"
          assert agg["total_evaluated"] > 0, "no evaluation rows were scored"
          assert agg["total_errors"] == 0, f"{agg['total_errors']} rows raised during evaluation"
          print(f"Live-retrieval eval OK: {agg['total_evaluated']} rows, 0 errors")
          PY

      - name: Upload coverage report
        if: always()
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Step summary
        if: always()
        run: |
          echo "## Lint & Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "- Python: ${{ env.PYTHON_VERSION }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Linter: ruff" >> "$GITHUB_STEP_SUMMARY"
          echo "- Coverage gate: baseline 35% minimum; raise after focused coverage expansion" >> "$GITHUB_STEP_SUMMARY"

  # ============================================
  # Stage 1a: Reproducibility — compile + upload uv lockfile
  # ============================================
  # Freezes the transitive dep graph so every CI job later in this run
  # (and every retrain that references the same commit) resolves to the
  # same wheels. Uploaded as an artifact; can be committed via a bot PR
  # if `commit-lockfile=true` is set on workflow_dispatch.
  reproducibility:
    name: Compile lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7.3.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Compile requirements.lock
        run: |
          uv pip compile requirements.txt -o requirements.lock \
            --generate-hashes \
            --python-version "${{ env.PYTHON_VERSION }}" \
            --python-platform x86_64-manylinux_2_28
          echo "lines: $(wc -l < requirements.lock)"
          head -n 20 requirements.lock

      - name: Upload lockfile artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: requirements-lock
          path: requirements.lock
          retention-days: 30

      - name: Step summary
        if: always()
        run: |
          echo "## Lockfile" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`requirements.lock\` compiled with uv" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lines: $(wc -l < requirements.lock 2>/dev/null || echo 'n/a')" >> "$GITHUB_STEP_SUMMARY"

  # ============================================
  # Stage 1b: Governance Compliance Check
  # ============================================
  governance-check:
    name: Governance & Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv pip install --system pyyaml

      - name: Run governance compliance check
        run: python governance/compliance_check.py

      - name: Step summary
        if: always()
        run: |
          echo "## Governance Compliance" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked: NIST AI RMF, ISO/IEC 42001, OWASP LLM Top 10, EU AI Act" >> "$GITHUB_STEP_SUMMARY"

  # ============================================
  # Stage 1c: Data Augmentation Smoke Test (fast, PR-triggered)
  # ============================================
  # Runs on every PR touching ml/scripts/data_aug/ — the corpus-export
  # package App/backend's PDF/crawl exporters import at runtime. Import
  # smoke + schema/PII unit checks only; no heavy deps (no pyarrow, no
  # sentence-transformers, no pymupdf4llm) needed for this subset.
  data-aug-smoke:
    name: Data Aug Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7.3.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install minimum data-aug deps
        run: |
          uv pip install --system \
            'numpy==1.26.4' 'pandas>=1.5,<2.0' 'pydantic>=2.5' pyyaml \
            'datasketch==1.6.5' ftfy \
            'beautifulsoup4>=4.12.0' requests

      - name: Import smoke test
        run: |
          python - <<'PY'
          import importlib
          mods = [
              "ml.scripts.data_aug.schema",
              "ml.scripts.data_aug.text_utils",
              "ml.scripts.data_aug.chunkers",
              "ml.scripts.data_aug.loaders",
              "ml.scripts.data_aug.dedup",
              "ml.scripts.data_aug.quality",
              "ml.scripts.data_aug.splitters",
              "ml.scripts.data_aug.formatters",
              "ml.scripts.data_aug.provenance",
              "ml.scripts.data_aug.pipeline",
          ]
          for m in mods:
              importlib.import_module(m)
              print(f"OK {m}")
          PY

      - name: Schema + PII unit checks
        run: |
          python - <<'PY'
          from ml.scripts.data_aug.schema import (
              TrainingExample, Message, Metadata, SourceType, TaskType, content_hash,
          )
          # Verify new source types exist (Phase 1-3 additions).
          assert hasattr(SourceType, 'WEB_CRAWL'), "Missing SourceType.WEB_CRAWL"
          assert hasattr(SourceType, 'ONLINE_CORPUS'), "Missing SourceType.ONLINE_CORPUS"
          assert hasattr(SourceType, 'TRANSLATED_FAQ'), "Missing SourceType.TRANSLATED_FAQ"
          from ml.scripts.data_aug.text_utils import redact_pii, clean_text

          # 1. Rejects message without an assistant turn
          try:
              TrainingExample(
                  messages=[Message(role="user", content="u")],
                  metadata=Metadata(
                      source="x", source_type=SourceType.CSV_FAQ, task=TaskType.QA,
                      content_hash="abc",
                  ),
              )
              raise SystemExit("FAIL: accepted missing assistant")
          except Exception:
              pass

          # 2. Hash is normalised
          assert content_hash("VAT rate?", "18%") == content_hash("  vat rate?  ", "18%")

          # 3. PII redaction
          text, report = redact_pii(
              "Call 0712345678 or email bob@example.com TIN 1012345678")
          assert "[PHONE]" in text and "[EMAIL]" in text and "[TIN]" in text
          assert report.phone == 1 and report.email == 1 and report.tin == 1

          # 4. Unicode + whitespace cleaning
          assert clean_text("  hello\u00a0 \t world ") == "hello world"
          print("schema/PII/hash unit checks OK")
          PY

      - name: Step summary
        if: always()
        run: |
          echo "## Data Augmentation Smoke Test" >> "$GITHUB_STEP_SUMMARY"
          echo "- Modules: imported OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Schema/PII unit checks: passed" >> "$GITHUB_STEP_SUMMARY"

  # ============================================
  # Stage 2: Data Validation
  # ============================================
  data-validation:
    name: Validate Data Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7.3.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install validation dependencies
        run: uv pip install --system pandas great-expectations pydantic

      - name: Run data validation
        run: python ml/pipelines/validate_data.py

      - name: Upload validation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-validation-report
          path: Results/reports/data_validation_report.json

  # ============================================
  # Stage 5b: RAG Evaluation & Quality Gates
  # ============================================
  #
  # The eval sets are self-contained ({question, answer, contexts,
  # ground_truth}), so this scores fixed rows with deterministic metrics plus
  # a MiniLM encoder. It needs no trained model, no Qdrant and no LLM.
  evaluate-rag:
    name: RAG Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7.3.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv pip install --system numpy pyyaml sentence-transformers torch --extra-index-url https://download.pytorch.org/whl/cpu

      # answer_relevancy embeds with MiniLM. Now that this job runs on every
      # PR rather than only on main, pulling that model fresh each time drew
      # HTTP 429s from the Hub, and huggingface_hub retried until the job hit
      # its 20-minute timeout — a rate limit reported as a failed quality
      # gate. Cache the weights (same key as the classifier job, which
      # already does this) and authenticate when a token is configured;
      # authenticated pulls get a far higher limit.
      - name: Cache Hugging Face embedder
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/huggingface_cache
          key: hf-minilm-${{ runner.os }}-${{ env.PYTHON_VERSION }}-v1
          restore-keys: |
            hf-minilm-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Verify RAG evaluation set exists
        run: |
          if [ ! -f Data/eval/rag_eval.jsonl ]; then
            echo "ERROR: RAG evaluation set Data/eval/rag_eval.jsonl is missing"
            exit 1
          fi
          echo "Eval set: $(wc -l < Data/eval/rag_eval.jsonl) samples"

      - name: Run RAG evaluation (English)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p Results
          python -m ml.pipelines.evaluate_rag \
            --eval-set Data/eval/rag_eval.jsonl \
            --output-dir Results \
            --config ml/configs/training_config.yaml

      - name: Verify Luganda evaluation set exists
        run: |
          if [ ! -f Data/eval/rag_eval_lg.jsonl ]; then
            echo "ERROR: Luganda evaluation set Data/eval/rag_eval_lg.jsonl is missing"
            exit 1
          fi
          echo "Luganda eval set: $(wc -l < Data/eval/rag_eval_lg.jsonl) samples"

      # faithfulness and groundedness are lexical-overlap scorers (shared
      # tokens / shared 3-grams).  The Luganda set pairs Luganda answers with
      # English contexts, so both measure translation overlap rather than
      # grounding and sit near zero even for a perfectly faithful answer.
      # They stay measured and reported, but cannot decide this run — the
      # honest options were to exclude them or to make the scorers
      # cross-lingual, not to lower a threshold until the numbers fit.
      # Every other metric (relevancy, precision/recall, numerical accuracy,
      # safety probes, abstention) is language-agnostic and still gates.
      - name: Run RAG evaluation (Luganda)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m ml.pipelines.evaluate_rag \
            --eval-set Data/eval/rag_eval_lg.jsonl \
            --output-dir Results/lg \
            --config ml/configs/training_config.yaml \
            --gate-exclude faithfulness,groundedness

      - name: Upload RAG evaluation results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rag-evaluation-results
          path: |
            Results/rag_evaluation_results.json
            Results/rag_quality_gates.json
            Results/lg/

      - name: Step summary
        if: always()
        run: |
          echo "## RAG Evaluation" >> "$GITHUB_STEP_SUMMARY"
          if [ -f Results/rag_evaluation_results.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat Results/rag_evaluation_results.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  # ============================================
  # Stage 5d: Production Gates
  # ============================================
  # Runs the combined production quality gate against the RAG evaluation
  # results. Uses --soft-fail so CI stays green while the gate is scored
  # on RAG metrics alone; safety/calibration/tokenizer/benchmark/model-card
  # inputs are omitted (their producing scripts were training-pipeline
  # tooling, removed with the rest of ml/) — quality_gates.py treats each
  # as optional and skips the corresponding check when absent.
  production-gates:
    name: Production Gates
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [evaluate-rag]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download RAG evaluation results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rag-evaluation-results
          path: Results/

      - name: Set up uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7.3.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv pip install --system pyyaml

      - name: Run production quality gates
        run: |
          python -m ml.pipelines.quality_gates \
            --family production \
            --config ml/configs/training_config.yaml \
            --rag-eval Results/rag_evaluation_results.json \
            --soft-fail

      - name: Step summary
        if: always()
        run: |
          {
            echo "## Production Gates"
            echo ""
            echo "Quality gates scored against \`Results/rag_evaluation_results.json\`, run with \`--soft-fail\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================
  # Stage 5e: Adapter Evaluation (multilingual LoRA quality gates)
  # ============================================
  # Dry-run evaluation of fine-tuned LoRA adapters for Qwen3 and Whisper.
  # On CI (no GPU), validates the eval scripts can parse and run metrics.
  # Full GPU evaluation runs on-demand via workflow_dispatch.
  evaluate-adapters:
    name: Adapter Evaluation (multilingual)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [evaluate-rag]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7.3.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv pip install --system pyyaml

      - name: Validate eval scripts (syntax + metric functions)
        run: |
          python - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location(
              "eq", "fine-tuning/scripts/10_evaluate_lora_qwen.py"
          )
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert mod.compute_rouge_l("a b c", "a b c") == 1.0, "ROUGE-L identity failed"
          assert mod.compute_bleu_1("a b c", "a b c") == 1.0, "BLEU-1 identity failed"
          assert mod.compute_rouge_l("a b c", "x y z") == 0.0, "ROUGE-L disjoint failed"
          print("Qwen eval metrics OK")

          spec2 = importlib.util.spec_from_file_location(
              "ew", "fine-tuning/scripts/11_evaluate_lora_whisper.py"
          )
          mod2 = importlib.util.module_from_spec(spec2)
          spec2.loader.exec_module(mod2)
          assert mod2.compute_wer("a b c", "a b c") == 0.0, "WER identity failed"
          assert mod2.compute_cer("abc", "abc") == 0.0, "CER identity failed"
          assert mod2.compute_wer("a b c", "x y z") == 1.0, "WER disjoint failed"
          print("Whisper eval metrics OK")

          from App.backend.app.query import detect_language

          assert detect_language("How do I register for TIN?") == "en"
          assert detect_language("Ninawezaje kupata TIN kwa biashara") == "sw"
          print("Language detection OK")
          print("All adapter eval validations passed")
          PY

      - name: Check adapter directory structure
        run: |
          echo "## Adapter Evaluation Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Language | Qwen3 Adapter | Whisper Adapter |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|---------------|-----------------|" >> "$GITHUB_STEP_SUMMARY"
          for lang in lg sw nyn ach; do
            qwen_dir="fine-tuning/adapters/${lang}-lora"
            if [ "$lang" = "lg" ]; then qwen_dir="fine-tuning/adapters/luganda-lora"; fi
            whisper_dir="fine-tuning/adapters/whisper-${lang}"
            qwen_status="not found"
            whisper_status="not found"
            if [ -d "$qwen_dir" ] && [ -f "$qwen_dir/adapter_config.json" ]; then
              qwen_status="present ($(du -sh $qwen_dir | cut -f1))"
            fi
            if [ -d "$whisper_dir" ] && [ -f "$whisper_dir/adapter_config.json" ]; then
              whisper_status="present ($(du -sh $whisper_dir | cut -f1))"
            fi
            echo "| $lang | $qwen_status | $whisper_status |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Validate eval results (if present)
        run: |
          for lang in lg sw nyn ach; do
            f="Results/eval_lora_qwen_${lang}.json"
            if [ -f "$f" ]; then
              python - "$f" "$lang" <<'PY'
          import json
          import sys

          path, lang = sys.argv[1], sys.argv[2]
          data = json.load(open(path, encoding="utf-8"))
          ft = data.get("fine_tuned_summary", {})
          if ft:
              rouge = ft.get("rouge_l_mean", 0)
              quality = ft.get("quality_mean", 0)
              print(f"  {lang}: ROUGE-L={rouge:.3f} Quality={quality:.3f}")
              if quality < 0.3:
                  print(f"  WARNING: {lang} quality below threshold (0.3)")
                  sys.exit(1)
          else:
              print(f"  {lang}: no fine-tuned results yet")
          PY
            fi
          done
          echo "Adapter eval gate: PASS"

  # ============================================
  # Stage 7: Build & Push Docker Image
  # ============================================
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-test]
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.DOCKER_IMAGE }}:ci-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan (SARIF → GitHub Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:ci-${{ github.sha }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
          trivy-config: trivy.yaml
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
          category: trivy-ml-pipeline

      - name: Generate SBOM (CycloneDX)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:ci-${{ github.sha }}
          format: cyclonedx
          output: sbom-api-pipeline.cdx.json

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-ml-pipeline-results
          path: |
            trivy-results.sarif
            sbom-api-pipeline.cdx.json
          retention-days: 90

  # ============================================
  # Stage 8: Deploy Backend
  # ============================================
  deploy-backend:
    name: Deploy Backend API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-docker, production-gates]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy to production
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          API_HOST: ${{ secrets.API_HOST }}
        run: |
          echo "Deploying $DOCKER_IMAGE:latest to production"
          # Add deployment commands here (e.g., SSH, kubectl, etc.)
          # ssh -i "$DEPLOY_KEY" user@"$API_HOST" "docker pull $DOCKER_IMAGE:latest && docker-compose up -d"

      - name: Health check
        run: |
          echo "Running health check..."
          # curl -f "${{ vars.API_URL }}/health" || exit 1

      - name: Step summary
        run: |
          echo "## Backend Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ env.DOCKER_IMAGE }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
