# Nightly corpus-hash check (G27). Does not re-index.
name: Index freshness

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: index-freshness
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App/backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Compare sources to last snapshot
        env:
          FRESHNESS_SLACK_WEBHOOK: ${{ secrets.FRESHNESS_SLACK_WEBHOOK }}
        run: |
          set +e
          python -m app.freshness --check --write-status --notify
          code=$?
          if [ "$code" -eq 1 ]; then
            echo "Index sources drifted — run the staged rebuild (python -m app.index_lifecycle --rebuild)"
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "No snapshot in this checkout; write one after the next indexer run."
            exit 0
          fi
          exit "$code"
