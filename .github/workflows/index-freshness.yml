# Nightly: is the crawl that production depends on recent enough? (ADR-0023)
#
# This used to compare two generated files that no checkout contains, took
# "snapshot missing" as a pass, and so stayed green for as long as it existed.
# What is checked here is on the branch: the ledger says when URA's site was last
# read end to end, and an open proposal says a newer read is waiting for a person.
name: Index freshness

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: index-freshness
  cancel-in-progress: true

env:
  CANDIDATE_BRANCH: data/crawl-candidate
  PROPOSAL_MAX_AGE_DAYS: "7"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: The last full crawl is recent enough
        working-directory: App/backend
        env:
          PYTHONPATH: .
        run: python -m app.crawl_gate slo --crawl-dir ../../Data/crawl
      - name: No proposal is waiting too long
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created=$(gh pr list --head "$CANDIDATE_BRANCH" --base dev --state open --json createdAt --jq '.[0].createdAt // empty')
          if [ -z "$created" ]; then
            echo "No proposal is open."
            exit 0
          fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$created" +%s) ) / 86400 ))
          echo "The open crawl proposal is $age days old."
          if [ "$age" -gt "$PROPOSAL_MAX_AGE_DAYS" ]; then
            echo "::error::A crawl proposal has waited $age days: taxpayers are not seeing what it found."
            exit 1
          fi
