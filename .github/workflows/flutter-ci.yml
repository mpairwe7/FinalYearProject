# =============================================================================
# Flutter Mobile CI — URA Chatbot (2026)
#
# Runs static analysis, unit/widget tests, and builds APK/IPA.
# Standards: ISO/IEC 25010:2023 §7 (Maintainability), ISO 12207 §6.4.8
# =============================================================================
name: Flutter CI

on:
  push:
    branches: [main, develop, feat/*]
    paths:
      - 'MobileApp/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'MobileApp/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.0"
  JAVA_VERSION: "17"

jobs:
  # ============================================
  # Stage 1: Analyse & Test
  # ============================================
  analyse-and-test:
    name: Analyse & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./MobileApp/ura_chatbot
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Flutter
        uses: subosito/flutter-action@e938bc4e441c10a3b5c2eadba5bcfb3dad74d15e # v2.19.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run flutter analyze (lint)
        run: flutter analyze --fatal-infos

      - name: Run dart format check
        run: dart format --set-exit-if-changed lib/ test/

      - name: Run unit & widget tests
        run: flutter test --coverage --reporter expanded

      - name: Check coverage threshold
        run: |
          if [ -f coverage/lcov.info ]; then
            TOTAL=$(grep -c "^DA:" coverage/lcov.info || echo 0)
            COVERED=$(grep "^DA:" coverage/lcov.info | grep -cv ",0$" || echo 0)
            if [ "$TOTAL" -gt 0 ]; then
              PCT=$((COVERED * 100 / TOTAL))
              echo "Coverage: ${PCT}% (${COVERED}/${TOTAL} lines)"
              echo "## Flutter Test Coverage: ${PCT}%" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-coverage
          path: MobileApp/ura_chatbot/coverage/
          retention-days: 30

  # ============================================
  # Stage 2: Build APK (Android)
  # ============================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: analyse-and-test
    if: github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: ./MobileApp/ura_chatbot
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Flutter
        uses: subosito/flutter-action@e938bc4e441c10a3b5c2eadba5bcfb3dad74d15e # v2.19.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_URL=${{ vars.API_URL || 'https://api.ura-chatbot.example' }}

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-apk
          path: MobileApp/ura_chatbot/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Step summary
        run: |
          echo "## Android Build" >> "$GITHUB_STEP_SUMMARY"
          APK_SIZE=$(du -sh build/app/outputs/flutter-apk/app-release.apk | cut -f1)
          echo "- APK size: ${APK_SIZE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
