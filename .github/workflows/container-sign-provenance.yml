# =============================================================================
# Container Signing & SLSA Provenance (2026)
#
# Signs container images with Sigstore cosign and generates SLSA v1.2
# provenance attestations.  Called by ura-chatbot-build-push.yml after every
# push of landwind/ura-chatbot (the image Crane Cloud and the HF Space run);
# it was documented as wired in but had no caller, so nothing was signed.
#
# Standards: SLSA v1.2 (Build L2), CISA SSDF, CycloneDX 1.6, Sigstore
# =============================================================================
name: "Container Sign & SLSA Provenance"

on:
  workflow_call:
    inputs:
      image:
        description: "Fully-qualified image reference (e.g. landwind/ura-chatbot-api:sha-abc1234)"
        required: true
        type: string
      digest:
        description: "Image digest (sha256:...)"
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      image:
        description: "Image to sign"
        required: true
        type: string
      digest:
        description: "Image digest"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign-and-attest:
    name: "Sign & Attest"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write     # Sigstore OIDC token
      attestations: write # GitHub Attestations API
      # No packages: write — the image and its signature live on Docker Hub,
      # pushed with the Docker Hub token, not on GHCR.
    timeout-minutes: 10
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Inputs reach the shell through env, never through ${{ }} in the
      # script body, and are shape-checked before cosign sees them.
      - name: Validate image reference
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*(:[A-Za-z0-9_.-]{1,128})?$ ]] \
            || { echo "::error::invalid image reference"; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::invalid image digest"; exit 1; }

      # Keyless signing via Sigstore Fulcio + Rekor (no long-lived keys)
      - name: Sign container image (keyless)
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
        run: cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

      # Verify against THIS repository's signing workflow only. The previous
      # match-anything identity pattern accepted a signature made by any
      # GitHub Actions workflow in any repository, so it proved nothing.
      - name: Verify signature
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp="^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/container-sign-provenance\.yml@refs/" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-repository="${GITHUB_REPOSITORY}" \
            "${IMAGE}@${DIGEST}" > /dev/null
          echo "Signature verified for ${IMAGE}@${DIGEST}"

      # Generate SLSA v1.2 provenance via GitHub's built-in attestation
      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ inputs.digest }}
          push-to-registry: true

      - name: Step summary
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
        run: |
          echo "## Container Signing & Provenance" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Digest**: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Signing**: Sigstore cosign (keyless OIDC)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Provenance**: SLSA v1.2 Build L2 (GitHub Attestations)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Rekor log**: https://search.sigstore.dev/" >> "$GITHUB_STEP_SUMMARY"
