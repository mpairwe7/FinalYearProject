# =============================================================================
# URA Chatbot — Model Quantization CI Pipeline
# Produces GGUF, AWQ, GPTQ, ONNX artifacts with automated quality gates
# =============================================================================

name: Model Quantization Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode: validate CI wiring only, or run production quantization"
        required: false
        type: choice
        options:
          - validate
          - production
        default: "validate"
      model_id:
        description: "HuggingFace model ID"
        required: false
        default: "Qwen/Qwen3-8B"
      formats:
        description: "Quantization formats (space-separated)"
        required: false
        default: "gguf awq"
      gguf_types:
        description: "GGUF quant types (space-separated)"
        required: false
        default: "Q4_K_M Q5_K_M Q8_0"
      use_imatrix:
        description: "Use importance matrix for GGUF"
        required: false
        type: boolean
        default: false
      skip_quality_gate:
        description: "Skip quality gate (emergency only)"
        required: false
        type: boolean
        default: false
      runner_labels:
        description: "JSON runs-on labels for production quantization"
        required: false
        default: '["self-hosted","linux","gpu"]'

  push:
    branches: [main, dev]
    paths:
      - "scripts/quantize_models.py"
      - "scripts/quantization_quality_gate.py"
      - "ml/configs/training_config.yaml"
      - ".github/workflows/quantization.yml"

  schedule:
    # Weekly quantization on Sunday 02:00 UTC (after scheduled retraining)
    - cron: "0 2 * * 0"

permissions:
  contents: read

concurrency:
  group: quantization-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  DEFAULT_MODEL: "Qwen/Qwen3-8B"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Validate configuration and prepare
  # ---------------------------------------------------------------------------
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    outputs:
      model_id: ${{ steps.config.outputs.model_id }}
      formats: ${{ steps.config.outputs.formats }}
      gguf_types: ${{ steps.config.outputs.gguf_types }}
      run_quantization: ${{ steps.config.outputs.run_quantization }}
      runner_labels: ${{ steps.config.outputs.runner_labels }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve configuration
        id: config
        # Dispatch inputs reach the shell only through env, and are checked
        # against a strict shape here because later steps and jobs splice
        # these outputs into command lines and runs-on.
        env:
          MODEL: ${{ inputs.model_id || env.DEFAULT_MODEL }}
          FORMATS: ${{ inputs.formats || 'gguf awq' }}
          GGUF_TYPES: ${{ inputs.gguf_types || 'Q4_K_M Q5_K_M Q8_0' }}
          MODE: ${{ inputs.mode || 'validate' }}
          RUNNER_LABELS: ${{ inputs.runner_labels || '["self-hosted","linux","gpu"]' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          RUN_QUANTIZATION="false"

          [[ "$MODEL" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$ ]] \
            || { echo "::error::model_id must be a Hugging Face repo id (owner/name)"; exit 1; }
          [[ "$FORMATS" =~ ^[a-z0-9]+( [a-z0-9]+)*$ ]] \
            || { echo "::error::formats must be space-separated words"; exit 1; }
          [[ "$GGUF_TYPES" =~ ^[A-Za-z0-9_]+( [A-Za-z0-9_]+)*$ ]] \
            || { echo "::error::gguf_types must be space-separated quant types"; exit 1; }
          [[ "$MODE" =~ ^(validate|production)$ ]] \
            || { echo "::error::mode must be validate or production"; exit 1; }

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MODE" = "production" ]; then
            RUN_QUANTIZATION="true"
          fi

          python3 - <<'PY'
          import json, os, re
          labels = json.loads(os.environ["RUNNER_LABELS"])
          if not isinstance(labels, list) or not labels or not all(
              isinstance(x, str) and re.fullmatch(r"[A-Za-z0-9_.-]{1,64}", x) for x in labels
          ):
              raise SystemExit("runner_labels must be a non-empty JSON array of plain runner labels")
          PY

          echo "model_id=${MODEL}" >> "$GITHUB_OUTPUT"
          echo "formats=${FORMATS}" >> "$GITHUB_OUTPUT"
          echo "gguf_types=${GGUF_TYPES}" >> "$GITHUB_OUTPUT"
          echo "run_quantization=${RUN_QUANTIZATION}" >> "$GITHUB_OUTPUT"
          echo "runner_labels=${RUNNER_LABELS}" >> "$GITHUB_OUTPUT"

          echo "Configuration:"
          echo "  Model:      ${MODEL}"
          echo "  Formats:    ${FORMATS}"
          echo "  GGUF types: ${GGUF_TYPES}"
          echo "  Mode:       ${MODE}"
          echo "  Full run:   ${RUN_QUANTIZATION}"
          echo "  Runner:     ${RUNNER_LABELS}"

          {
            echo "## Quantization Configuration"
            echo "- Model: \`${MODEL}\`"
            echo "- Formats: \`${FORMATS}\`"
            echo "- Mode: \`${MODE}\`"
            echo "- Full quantization: \`${RUN_QUANTIZATION}\`"
            echo "- Production runner labels: \`${RUNNER_LABELS}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compile scripts
        run: |
          python -m py_compile scripts/quantize_models.py scripts/quantization_quality_gate.py

      - name: Dry-run quantization validation
        env:
          MODEL: ${{ steps.config.outputs.model_id }}
          FORMATS: ${{ steps.config.outputs.formats }}
        run: |
          # FORMATS is intentionally word-split into separate --formats values.
          # shellcheck disable=SC2086
          python scripts/quantize_models.py \
            --model "$MODEL" \
            --formats $FORMATS \
            --dry-run

      - name: Smoke-test quality gate parser
        env:
          MODEL_ID: ${{ steps.config.outputs.model_id }}
        run: |
          MODEL_NAME="${MODEL_ID##*/}"
          mkdir -p "artifacts/quantized/${MODEL_NAME}"
          export MODEL_NAME
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          model = os.environ["MODEL_NAME"]
          manifest = {
              "pipeline_version": "2026.1.0-ci-smoke",
              "model": os.environ["MODEL_ID"],
              "created_at": "2026-01-01T00:00:00+00:00",
              "results": [
                  {
                      "model": os.environ["MODEL_ID"],
                      "format": "gguf",
                      "quant_type": "Q4_K_M",
                      "output_path": "ci-smoke.gguf",
                      "size_bytes": 1,
                      "size_mb": 1.0,
                      "sha256": "ci-smoke",
                      "duration_s": 0,
                      "status": "success",
                      "error": "",
                      "created_at": "2026-01-01T00:00:00+00:00",
                      "metadata": {},
                  },
                  {
                      "model": os.environ["MODEL_ID"],
                      "format": "awq",
                      "quant_type": "w4-g128",
                      "output_path": "ci-smoke-awq",
                      "size_bytes": 1,
                      "size_mb": 1.0,
                      "sha256": "ci-smoke",
                      "duration_s": 0,
                      "status": "success",
                      "error": "",
                      "created_at": "2026-01-01T00:00:00+00:00",
                      "metadata": {},
                  },
              ],
              "summary": {"total": 2, "success": 2, "failed": 0, "skipped": 0},
          }
          out = Path("artifacts/quantized") / model / "manifest.json"
          out.write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          PY
          python scripts/quantization_quality_gate.py \
            --manifest "artifacts/quantized/${MODEL_NAME}/manifest.json" \
            --json-output "artifacts/quantized/${MODEL_NAME}/quality_gate_results.json"

  # ---------------------------------------------------------------------------
  # Job 2: GGUF Quantization (requires llama.cpp)
  # ---------------------------------------------------------------------------
  quantize-gguf:
    name: GGUF Quantization
    needs: validate
    if: needs.validate.outputs.run_quantization == 'true' && contains(needs.validate.outputs.formats, 'gguf')
    runs-on: ${{ fromJSON(needs.validate.outputs.runner_labels) }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install transformers torch sentencepiece protobuf gguf numpy

      - name: Build llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cd /tmp/llama.cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j$(nproc)
          echo "LLAMA_CPP_DIR=/tmp/llama.cpp/build/bin" >> "$GITHUB_ENV"

      - name: Cache HuggingFace models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ needs.validate.outputs.model_id }}-${{ hashFiles('scripts/quantize_models.py') }}
          restore-keys: hf-${{ needs.validate.outputs.model_id }}-

      - name: Run GGUF quantization
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          IMATRIX_FLAG: ${{ inputs.use_imatrix && '--imatrix' || '' }}
        run: |
          # IMATRIX_FLAG is either empty or one flag, so it is left unquoted.
          # shellcheck disable=SC2086
          python scripts/quantize_models.py \
            --model "${{ needs.validate.outputs.model_id }}" \
            --formats gguf \
            --gguf-types ${{ needs.validate.outputs.gguf_types }} \
            $IMATRIX_FLAG

      - name: Upload GGUF artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quantized-gguf
          path: |
            artifacts/quantized/*/gguf/*.gguf
            artifacts/quantized/*/manifest.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 3: AWQ Quantization (requires GPU)
  # ---------------------------------------------------------------------------
  quantize-awq:
    name: AWQ Quantization
    needs: validate
    if: needs.validate.outputs.run_quantization == 'true' && contains(needs.validate.outputs.formats, 'awq')
    runs-on: ${{ fromJSON(needs.validate.outputs.runner_labels) }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install transformers torch autoawq sentencepiece protobuf

      - name: Cache HuggingFace models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ needs.validate.outputs.model_id }}-awq
          restore-keys: hf-${{ needs.validate.outputs.model_id }}-

      - name: Run AWQ quantization
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/quantize_models.py \
            --model "${{ needs.validate.outputs.model_id }}" \
            --formats awq

      - name: Upload AWQ artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quantized-awq
          path: |
            artifacts/quantized/*/awq/**
            artifacts/quantized/*/manifest.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 4: Quality Gate
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: [validate, quantize-gguf, quantize-awq]
    if: |
      always() &&
      needs.validate.outputs.run_quantization == 'true' &&
      !inputs.skip_quality_gate &&
      (needs.quantize-gguf.result == 'success' || needs.quantize-awq.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/quantized
          merge-multiple: true

      - name: Run quality gate
        run: |
          MODEL_NAME=$(echo "${{ needs.validate.outputs.model_id }}" | sed 's|.*/||')

          python scripts/quantization_quality_gate.py \
            --manifest "artifacts/quantized/${MODEL_NAME}/manifest.json" \
            --max-faithfulness-drop 4.0 \
            --max-wer-increase 3.0 \
            --max-gguf-mb 6000 \
            --max-mobile-mb 800 \
            --min-faithfulness 0.89 \
            --json-output "artifacts/quantized/${MODEL_NAME}/quality_gate_results.json"

      - name: Upload quality gate results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-gate-results
          path: artifacts/quantized/*/quality_gate_results.json
          retention-days: 90

      - name: Post quality gate summary
        if: always()
        run: |
          MODEL_NAME=$(echo "${{ needs.validate.outputs.model_id }}" | sed 's|.*/||')
          RESULTS="artifacts/quantized/${MODEL_NAME}/quality_gate_results.json"

          if [ -f "$RESULTS" ]; then
            PASSED=$(python3 -c "import json;d=json.load(open('$RESULTS'));print(d['passed'])")
            TOTAL=$(python3 -c "import json;d=json.load(open('$RESULTS'));print(d['total'])")
            PASS_CT=$(python3 -c "import json;d=json.load(open('$RESULTS'));print(d['passed_count'])")

            echo "## Quantization Quality Gate" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [ "$PASSED" = "True" ]; then
              echo "**Result: PASSED** ($PASS_CT/$TOTAL gates)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "**Result: FAILED** ($PASS_CT/$TOTAL gates)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

  # ---------------------------------------------------------------------------
  # Job 5: Publish artifacts (on quality gate pass)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish Quantized Models
    needs: [validate, quality-gate]
    if: needs.validate.outputs.run_quantization == 'true' && needs.quality-gate.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/quantized
          merge-multiple: true

      - name: Publish to HuggingFace Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface-hub
          MODEL_NAME=$(echo "${{ needs.validate.outputs.model_id }}" | sed 's|.*/||')

          echo "Publishing quantized models for ${MODEL_NAME}..."
          echo "Artifacts would be uploaded to HF Hub repo"
          # huggingface-cli upload mpairweLandwind/ura-chatbot-quantized \
          #   artifacts/quantized/${MODEL_NAME}/ \
          #   --repo-type model
