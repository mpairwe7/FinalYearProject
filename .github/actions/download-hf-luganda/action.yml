name: Download HuggingFace Luganda Corpus
description: Download Luganda-English parallel corpus from HuggingFace datasets

inputs:
  hf-token:
    description: HuggingFace API token
    required: true
  output-dir:
    description: Directory to save the corpus (a TTT/ subfolder is created)
    required: true

runs:
  using: composite
  steps:
    - name: Install HuggingFace dependencies
      shell: bash
      # No [cli] extra: nothing here shells out to the CLI any more (see below).
      run: uv pip install --system --quiet huggingface_hub datasets pandas

    - name: Download Luganda-English parallel corpus
      shell: bash
      env:
        HF_TOKEN: ${{ inputs.hf-token }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        # No `huggingface-cli login` here. That command was renamed to `hf` in
        # huggingface_hub 1.0 and the old name now exits non-zero with
        # "`huggingface-cli` is deprecated and no longer works. Use `hf`
        # instead." — which is what failed this job on every push to main,
        # printing the `hf` help text into the log before the download could
        # even start.
        #
        # Swapping in `hf auth login` would work, but writing a token file is
        # not needed at all: huggingface_hub resolves HF_TOKEN from the
        # environment (get_token() reads it directly), and it is already
        # exported above, so `datasets` authenticates without a login step.
        # Dropping the call removes the CLI-name coupling rather than moving it.
        python3 << 'PYEOF'
        import os
        from datasets import load_dataset
        import pandas as pd

        output_dir = os.path.join(os.environ["OUTPUT_DIR"], "TTT")
        os.makedirs(output_dir, exist_ok=True)

        ds = load_dataset("kambale/luganda-english-parallel-corpus")
        df = pd.DataFrame({
            "english": ds["train"]["english"],
            "luganda": ds["train"]["luganda"],
        })
        out_path = os.path.join(output_dir, "luganda_parallel.csv")
        df.to_csv(out_path, index=False)
        print(f"::notice::Luganda-English corpus saved: {df.shape[0]} pairs -> {out_path}")
        PYEOF
