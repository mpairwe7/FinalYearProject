# Dependabot Configuration for URA AI Taxpayer Chatbot
# Staggered schedules across days/hours to prevent CI runner queue starvation & minute exhaustion
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # =============================================================================
  # BACKEND - Python 3.11 / FastAPI (App/backend) -> Monday 02:00 UTC
  # =============================================================================
  - package-ecosystem: "pip"
    directory: "/App/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "backend"
      - "python"
      - "automated"
    commit-message:
      prefix: "deps(backend)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      fastapi-stack:
        patterns:
          - "fastapi*"
          - "uvicorn*"
          - "starlette*"
          - "pydantic*"
        update-types:
          - "minor"
          - "patch"

  # =============================================================================
  # ROOT TOOLS - Python Root Requirements -> Monday 03:00 UTC
  # =============================================================================
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "python"
      - "automated"
    commit-message:
      prefix: "deps(python)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # =============================================================================
  # FRONTEND - Next.js 16 + React 19 + Bun (App/frontend) -> Tuesday 02:00 UTC
  # =============================================================================
  - package-ecosystem: "npm"
    directory: "/App/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "02:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "frontend"
      - "javascript"
      - "automated"
    commit-message:
      prefix: "deps(frontend)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # =============================================================================
  # DOCKER - Backend & Frontend Images -> Wednesday 02:00 UTC (Bi-weekly)
  # =============================================================================
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "02:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker"
      - "automated"
    commit-message:
      prefix: "deps(docker)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/App/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "02:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker"
      - "frontend"
      - "automated"
    commit-message:
      prefix: "deps(docker-frontend)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # =============================================================================
  # GITHUB ACTIONS - Workflow Actions -> Thursday 02:00 UTC (Monthly)
  # =============================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
      day: "thursday"
      time: "02:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "ci"
      - "automated"
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
