# Dependabot Configuration for URA AI Taxpayer Chatbot
# Runs weekly on Sundays, staggered by hour to avoid runner queue starvation
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Every entry carries a cooldown: a release must be public for 7 days (30 for
# a major) before Dependabot proposes it. Minor/patch PRs are auto-merged on
# green CI (dependabot-automerge.yml), so without it a hijacked release — the
# pattern of the March 2026 trivy-action and 2025 npm worm compromises — could
# land within hours. Cooldown never delays *security* updates.

version: 2
updates:
  # =============================================================================
  # BACKEND - Python 3.11 / FastAPI (App/backend) -> Sunday 02:00 UTC
  # =============================================================================
  - package-ecosystem: "pip"
    directory: "/App/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "02:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "backend"
      - "python"
      - "automated"
    commit-message:
      prefix: "deps(backend)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      fastapi-stack:
        patterns:
          - "fastapi*"
          - "uvicorn*"
          - "starlette*"
          - "pydantic*"
        update-types:
          - "minor"
          - "patch"

  # =============================================================================
  # ROOT TOOLS - Python Root Requirements -> Sunday 03:00 UTC
  # =============================================================================
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "03:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "python"
      - "automated"
    commit-message:
      prefix: "deps(python)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # =============================================================================
  # FRONTEND - Next.js 16 + React 19 + Bun (App/frontend) -> Sunday 04:00 UTC
  # =============================================================================
  # "bun", not "npm": the npm ecosystem bumps package.json without bun.lock,
  # which breaks every `bun install --frozen-lockfile` job (seen in PR #418).
  - package-ecosystem: "bun"
    directory: "/App/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "frontend"
      - "javascript"
      - "automated"
    commit-message:
      prefix: "deps(frontend)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # =============================================================================
  # DOCKER - Backend & Frontend Base Images -> Sunday 05:00 UTC
  # =============================================================================
  # "/App" holds Dockerfile.cranecloud, the image Crane Cloud and the HF Space
  # actually run; it was not covered, so its base images never got bumped.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/App"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "05:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker"
      - "automated"
    commit-message:
      prefix: "deps(docker)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/App/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "05:30"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker"
      - "frontend"
      - "automated"
    commit-message:
      prefix: "deps(docker-frontend)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # =============================================================================
  # GITHUB ACTIONS - Workflow Actions -> Sunday 06:00 UTC
  # =============================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "ci"
      - "automated"
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
