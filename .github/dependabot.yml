# Dependabot Configuration for URA AI Taxpayer Chatbot
# Runs weekly on Sundays, staggered by hour to avoid runner queue starvation
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Every entry carries a cooldown: a release must be public for 7 days (30 for
# a major) before Dependabot proposes it. Minor/patch PRs are auto-merged on
# green CI (dependabot-automerge.yml), so without it a hijacked release — the
# pattern of the March 2026 trivy-action and 2025 npm worm compromises — could
# land within hours. Cooldown never delays *security* updates.

version: 2
updates:
  # =============================================================================
  # CRAWLER - hash-locked, read-only job (App/ml/requirements-crawl.txt) -> Sunday 01:00 UTC
  # =============================================================================
  - package-ecosystem: "pip"
    directory: "/App/ml"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "01:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "python"
      - "automated"
    commit-message:
      prefix: "deps(crawl)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # =============================================================================
  # BACKEND - Python 3.11 / FastAPI (App/backend) -> Sunday 02:00 UTC
  # =============================================================================
  - package-ecosystem: "pip"
    directory: "/App/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "02:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "backend"
      - "python"
      - "automated"
    commit-message:
      prefix: "deps(backend)"
    # App/requirements.txt pins these exactly, and CI installs it with the production
    # lock as constraints, so they must move in the root list and the backend files in
    # one PR. The /App job edits both; moved here alone they broke CI's install (#785).
    # pydantic-core is pinned exactly by pydantic; the OpenTelemetry family moves together.
    ignore:
      - dependency-name: "fastapi"
      - dependency-name: "uvicorn"
      - dependency-name: "pydantic"
      - dependency-name: "pydantic-core"
      - dependency-name: "openpyxl"
      - dependency-name: "opentelemetry-*"
      # pipecat-ai 1.15.0 requires soundfile<0.14.
      - dependency-name: "soundfile"
        versions: [">=0.14"]
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # =============================================================================
  # ROOT TOOLS - Python Root Requirements -> Sunday 03:00 UTC
  # =============================================================================
  - package-ecosystem: "pip"
    directory: "/App"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "03:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "python"
      - "automated"
    commit-message:
      prefix: "deps(python)"
    # This job also edits the backend and crawler files under /App, so it owns the
    # packages the root list pins exactly (see the /App/backend entry).
    ignore:
      # pipecat-ai 1.15.0 requires soundfile<0.14.
      - dependency-name: "soundfile"
        versions: [">=0.14"]
    groups:
      # The first group whose patterns match takes the update.
      fastapi-stack:
        patterns:
          - "fastapi*"
          - "uvicorn*"
          - "starlette*"
          - "pydantic*"
        update-types:
          - "minor"
          - "patch"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # =============================================================================
  # FRONTEND - Next.js 16 + React 19 + Bun (App/frontend) -> Sunday 04:00 UTC
  # =============================================================================
  # "bun", not "npm": the npm ecosystem bumps package.json without bun.lock,
  # which breaks every `bun install --frozen-lockfile` job (seen in PR #418).
  - package-ecosystem: "bun"
    directory: "/App/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
      semver-major-days: 30
    # Three, not two: a next pull request can wait for the blog's bump, and the two
    # other groups still need a slot each.
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "frontend"
      - "javascript"
      - "automated"
    commit-message:
      prefix: "deps(frontend)"
    groups:
      # vitest and its plugins release together, and each plugin's peer range is the exact vitest
      # version. Bumped alone, @vitest/coverage-v8 5 ran on vitest 4 (#771). Listed first: a
      # package joins the first group that matches it.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # App/blog must carry the frontend's exact next (test_blog_nextjs_stays_in_step_with_frontend)
      # and no job covers the blog, so a next bump is red until the blog gets the same bump by
      # hand on that branch. In the shared group it held eight other updates (#814).
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # =============================================================================
  # DOCKER - Backend & Frontend Base Images -> Sunday 05:00 UTC
  # =============================================================================
  # "/App" holds Dockerfile.cranecloud, the image Crane Cloud and the HF Space
  # actually run; it was not covered, so its base images never got bumped.
  - package-ecosystem: "docker"
    directories:
      - "/App"
      - "/App/backend"
      - "/App/backend/orpheus_sidecar"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "05:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker"
      - "automated"
    commit-message:
      prefix: "deps(docker)"
    # The shipped Node major is the one in App/frontend/.nvmrc, which CI tests with
    # (test_shipped_frontend_runtimes_match_ci_and_are_digest_pinned). A major bump is a change to
    # .nvmrc and both images together, so it is not proposed one image at a time (#768, #769).
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # Bun is the version in App/frontend/.bun-version, in CI and in both images, so a bump is a
      # change to that file and both Dockerfiles together (#805).
      - dependency-name: "oven/bun"
      # The Python minor is the one the lock files are compiled for and CI audits on. 3.14 to 3.15
      # is a new interpreter, not a patch, and it arrived inside the minor-and-patch group (#807).
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/App/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "05:30"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker"
      - "frontend"
      - "automated"
    commit-message:
      prefix: "deps(docker-frontend)"
    # The shipped Node major is the one in App/frontend/.nvmrc, which CI tests with
    # (test_shipped_frontend_runtimes_match_ci_and_are_digest_pinned). A major bump is a change to
    # .nvmrc and both images together, so it is not proposed one image at a time (#768, #769).
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # Bun is the version in App/frontend/.bun-version, in CI and in both images, so a bump is a
      # change to that file and both Dockerfiles together (#805).
      - dependency-name: "oven/bun"
      # The Python minor is the one the lock files are compiled for and CI audits on. 3.14 to 3.15
      # is a new interpreter, not a patch, and it arrived inside the minor-and-patch group (#807).
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # =============================================================================
  # GITHUB ACTIONS - Workflow Actions -> Sunday 06:00 UTC
  # =============================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "ci"
      - "automated"
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
