# ===========================================================================
# URA Taxpayer Chatbot — standalone MCP servers (MCP 2026-07-28)
# ===========================================================================
# One container per server: the statutory calculators, the URA account
# server, and the six system connectors. This is the shape for a deployment
# that puts each system behind its own network policy. For a single-host
# stack, App/docker-compose.connectors.yml serves the six connectors from one
# process instead.
#
# Usage:
#   export MCP_LINK_TOKEN=$(openssl rand -hex 32)
#   docker compose -f docker-compose.yml -f docker-compose.mcp.yml up -d
#
# MCP_LINK_TOKEN is the shared secret both ends of every link are given
# below. It is never written to a file by this stack; keep it in the shell
# or the platform's secret store. Without it the servers start LOCKED — they
# answer /health and refuse everything else — and the API lists the
# connectors as unavailable.
#
# The six connectors are SIMULATORS over fixture data. They are labelled as
# demo data in chat, and under APP_ENV=production they serve no tools and
# the API does not offer them.
# ===========================================================================

x-mcp-server: &mcp-server
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
  image: ${DOCKER_IMAGE:-landwind/ura-chatbot-api}:${IMAGE_TAG:-latest}
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
    # The simulators keep their fixture databases here and seed them on first
    # use. In memory on purpose: nothing a simulator holds is a URA record,
    # and a restart returning it to the fixtures is the right behaviour.
    # Owned by the image's appuser: a bare entry mounts root:root 0755, which
    # the read-only appuser container cannot write (G296).
    - /app/data_store:uid=10001,gid=10001
  networks:
    - ura-network

# The image's ENTRYPOINT starts the chat API and ignores `command`, so each
# server replaces the entrypoint. The image has no curl; the health check is
# the same Python one-liner the API uses.
x-mcp-healthcheck: &mcp-healthcheck
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 20s

services:
  api:
    environment:
      # Opens the taxpayer-chat connector surface. With no server bound it
      # lists nothing, and it never lists a simulator in production.
      - FLAG_ENTERPRISE_CONNECTORS=${FLAG_ENTERPRISE_CONNECTORS:-true}
      - MCP_SERVER_URL_EFRIS=http://mcp-efris:8933
      - MCP_SERVER_TOKEN_EFRIS=${MCP_LINK_TOKEN:-}
      - MCP_SERVER_URL_DIGITAL_TAX_STAMPS=http://mcp-dts:8934
      - MCP_SERVER_TOKEN_DIGITAL_TAX_STAMPS=${MCP_LINK_TOKEN:-}
      - MCP_SERVER_URL_PAYMENT_SYSTEM=http://mcp-payment:8935
      - MCP_SERVER_TOKEN_PAYMENT_SYSTEM=${MCP_LINK_TOKEN:-}
      - MCP_SERVER_URL_TIN_REGISTRATION=http://mcp-tin:8936
      - MCP_SERVER_TOKEN_TIN_REGISTRATION=${MCP_LINK_TOKEN:-}
      - MCP_SERVER_URL_URSB=http://mcp-ursb:8937
      - MCP_SERVER_TOKEN_URSB=${MCP_LINK_TOKEN:-}
      - MCP_SERVER_URL_BWIMS=http://mcp-bwims:8938
      - MCP_SERVER_TOKEN_BWIMS=${MCP_LINK_TOKEN:-}
      # The calculators and the account server are NOT bound here: binding
      # them moves tools the chat already serves in-process. To move one, add
      #   MCP_SERVER_URL_TAX_CALCULATOR=http://mcp-tax-calculator:8931
      #   MCP_SERVER_TOKEN_TAX_CALCULATOR=${MCP_LINK_TOKEN}

  mcp-tax-calculator:
    <<: *mcp-server
    container_name: ura-mcp-tax-calculator
    entrypoint: ["python", "-m", "app.mcp.servers.tax_calculator", "--http", "--port", "8931"]
    environment:
      - APP_ENV=${APP_ENV:-development}
      - MCP_SERVER_TOKEN_TAX_CALCULATOR=${MCP_LINK_TOKEN:-}
    ports:
      - "127.0.0.1:8931:8931"
    healthcheck:
      <<: *mcp-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8931/health', timeout=4).status == 200 else 1)"]

  mcp-ura-account:
    <<: *mcp-server
    container_name: ura-mcp-ura-account
    entrypoint: ["python", "-m", "app.mcp.servers.ura_account", "--http", "--port", "8932"]
    environment:
      - APP_ENV=${APP_ENV:-development}
      - URA_ACCOUNT_API_MODE=${URA_ACCOUNT_API_MODE:-mock}
      - MCP_SERVER_TOKEN_URA_ACCOUNT=${MCP_LINK_TOKEN:-}
    ports:
      - "127.0.0.1:8932:8932"
    healthcheck:
      <<: *mcp-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8932/health', timeout=4).status == 200 else 1)"]

  mcp-efris:
    <<: *mcp-server
    container_name: ura-mcp-efris
    entrypoint: ["python", "-m", "app.mcp.servers.efris", "--http", "--port", "8933"]
    environment:
      - APP_ENV=${APP_ENV:-development}
      - MCP_SERVER_TOKEN_EFRIS=${MCP_LINK_TOKEN:-}
    ports:
      - "127.0.0.1:8933:8933"
    healthcheck:
      <<: *mcp-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8933/health', timeout=4).status == 200 else 1)"]

  mcp-dts:
