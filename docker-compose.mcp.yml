# ===========================================================================
# URA Taxpayer Chatbot — Standalone FastMCP Microservices (2026 Standards)
# ===========================================================================
# Deploys out-of-process FastMCP server containers for statutory calculators,
# DMZ URA account integration, and EFRIS fiscal services.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.mcp.yml up -d
# ===========================================================================

version: "3.8"

services:
  mcp-tax-calculator:
    build:
      context: .
      dockerfile: App/deploy/Dockerfile
    container_name: ura-mcp-tax-calculator
    restart: unless-stopped
    command: python3 -m app.mcp.servers.tax_calculator --http --port 8931
    environment:
      - APP_ENV=${APP_ENV:-production}
      - PYTHONPATH=/app/App/backend:/app
    ports:
      - "8931:8931"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8931/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - default

  mcp-ura-account:
    build:
      context: .
      dockerfile: App/deploy/Dockerfile
    container_name: ura-mcp-ura-account
    restart: unless-stopped
    command: python3 -m app.mcp.servers.ura_account --http --port 8932
    environment:
      - APP_ENV=${APP_ENV:-production}
      - PYTHONPATH=/app/App/backend:/app
      - URA_ACCOUNT_API_MODE=${URA_ACCOUNT_API_MODE:-mock}
    ports:
      - "8932:8932"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8932/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - default

  mcp-efris:
    build:
      context: .
      dockerfile: App/deploy/Dockerfile
    container_name: ura-mcp-efris
    restart: unless-stopped
    command: python3 -m app.mcp.servers.efris --http --port 8933
    environment:
      - APP_ENV=${APP_ENV:-production}
      - PYTHONPATH=/app/App/backend:/app
    ports:
      - "8933:8933"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8933/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - default
