# =============================================================================
# URA Chatbot — Prometheus alerting rules + SLOs
# =============================================================================
# Wire this into Prometheus via `rule_files:` in prometheus.yml.  Each
# alert covers a specific failure mode and ties to an Alertmanager route.
#
# SLOs (targets against which error budgets are computed):
#   1. Chat p95 latency    < 3s
#   2. HTTP error rate     < 1%
#   3. Faithfulness mean   ≥ 0.5
#   4. Qdrant availability ≥ 99.9%
#   5. LLM circuit breaker never OPEN > 5m sustained
# =============================================================================

groups:
  # ---------------------------------------------------------------------------
  # Availability / correctness
  # ---------------------------------------------------------------------------
  - name: ura-chatbot.availability
    interval: 30s
    rules:
      - alert: UraApiDown
        expr: up{job="ura-chatbot-api"} == 0
        for: 2m
        labels:
          severity: critical
          service: ura-chatbot
        annotations:
          summary: "URA Chatbot API unreachable"
          description: "The /metrics endpoint has been unreachable for 2 minutes."
          runbook: "https://github.com/mpairweLandwind/FinalYearProject/blob/main/docs/MONITORING.md#ura-api-down"

      - alert: UraHighErrorRate
        expr: |
          (
            sum(rate(http_errors_total[5m]))
            /
            sum(rate(http_requests_total[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: critical
          service: ura-chatbot
        annotations:
          summary: "HTTP error rate above 1%"
          description: "5m error-rate is {{ $value | humanizePercentage }} — SLO is 1%."

      - alert: UraRetrievalModeDegraded
        expr: |
          sum(rate(retrieval_mode_total{mode="keyword"}[10m]))
          /
          sum(rate(retrieval_mode_total[10m]))
          > 0.2
        for: 10m
        labels:
          severity: warning
          service: ura-chatbot
        annotations:
          summary: "Retrieval degraded to keyword mode"
          description: "More than 20% of requests are using keyword fallback over the last 10m — check Qdrant health."

  # ---------------------------------------------------------------------------
  # Latency
  # ---------------------------------------------------------------------------
  - name: ura-chatbot.latency
    interval: 30s
    rules:
      - alert: UraChatLatencyP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(chat_response_time_ms_bucket[5m]))) > 3000
        for: 10m
        labels:
          severity: warning
          service: ura-chatbot
        annotations:
          summary: "Chat p95 latency above 3s"
          description: "p95 latency = {{ $value }}ms over the last 5m — SLO is 3s."

      - alert: UraChatLatencyP99High
        expr: histogram_quantile(0.99, sum by (le) (rate(chat_response_time_ms_bucket[5m]))) > 8000
        for: 10m
        labels:
          severity: critical
          service: ura-chatbot
        annotations:
          summary: "Chat p99 latency above 8s"
          description: "p99 latency = {{ $value }}ms over the last 5m."

  # ---------------------------------------------------------------------------
  # AI quality signals
  # ---------------------------------------------------------------------------
  - name: ura-chatbot.quality
    interval: 60s
    rules:
      - alert: UraFaithfulnessLow
        expr: avg_over_time(faithfulness_score[30m]) < 0.5
        for: 30m
        labels:
          severity: warning
          service: ura-chatbot
        annotations:
          summary: "Faithfulness score below 0.5"
          description: "30m moving average faithfulness = {{ $value }}. The model is hallucinating or the retrieved contexts are poor."

      - alert: UraEvalRegression
        expr: ura_eval_metric_passed == 0
        for: 1m
        labels:
          severity: warning
          service: ura-chatbot
        annotations:
          summary: "Ragas eval regression: {{ $labels.name }}"
          description: "The nightly evaluation job reported {{ $labels.name }} below the SLO threshold."

      - alert: UraEscalationSpike
        expr: rate(escalation_required_total[10m]) > 0.1
        for: 15m
        labels:
          severity: warning
          service: ura-chatbot
        annotations:
          summary: "Escalation rate spike"
          description: "More than 0.1 escalations/s for 15m — check topic_tag distribution and feedback comments."

  # ---------------------------------------------------------------------------
  # Resource health
  # ---------------------------------------------------------------------------
  - name: ura-chatbot.resources
    interval: 30s
    rules:
      - alert: UraQdrantDown
        expr: up{job="qdrant"} == 0
        for: 2m
        labels:
          severity: critical
          service: qdrant
        annotations:
          summary: "Qdrant unreachable"
          description: "Qdrant has been unreachable for 2 minutes — the circuit breaker will have tripped."

      - alert: UraRedisDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis unreachable — rate limit / cache backend is offline"
