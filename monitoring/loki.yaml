# Grafana Loki (single binary) — log store for the `monitoring` profile.
# The API's logs arrive over OTLP from the Collector. Retention is 93 days and
# enforced by the compactor; the audit seal witness lines (event=audit.seal)
# live here too. Loki on a local volume is not write-once storage — for
# production evidence, ship the same stream to object storage with an object
# lock (docs/runbooks/audit-trail.md#seals).
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 2232h
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
