# Local-only document/PDF analysis and evaluation override.
#
# Combine with the base stack and the optional OCR sidecar:
#   docker compose -f docker-compose.yml -f docker-compose.local-documents.yml \
#     -f docker-compose.ocr.yml --profile ocr up -d --build redis qdrant api ocr
#
# This file intentionally disables every configured remote-capable inference,
# fallback, speech, telemetry, and external-token path for this workflow. The
# OCR URL is supplied by docker-compose.ocr.yml and resolves only on Docker's
# private app-network.
services:
  api:
    # Compose !override requires Docker Compose v2.24.4 or later. It replaces
    # (rather than appends to) the base port entry, keeping the API loopback-only.
    ports: !override
      - "127.0.0.1:${LOCAL_DOCUMENT_API_PORT:-8083}:8000"
    environment:
      # Keep the document/evaluation API local and independent of the normal
      # chat runtime. The base Compose file still provides Redis/Qdrant as
      # local containers; Qdrant is disabled for this narrow workflow.
      APP_ENV: development
      WORKERS: "1"
      CORS_ORIGINS: "http://localhost:3032,http://127.0.0.1:3032"
      LLM_ENABLED: "false"
      LLM_BACKEND: "local"
      LLM_DEVICE: "cpu"
      VLLM_BASE_URL: ""
      VLLM_API_KEY: ""
      VLLM_HTTP_TIMEOUT: "6"
      HF_HUB_OFFLINE: "1"
      QDRANT_ENABLED: "false"
      DENSE_FALLBACK_BACKEND: ""
      LLM_FALLBACK_BACKEND: ""
      FLAG_CLOUDFLARE_FALLBACK: "false"
      CLOUDFLARE_ACCOUNT_ID: ""
      CLOUDFLARE_API_TOKEN: ""
      CF_AIG_GATEWAY: ""
      CF_AIG_TOKEN: ""
      VECTORIZE_INDEX: ""
      GEMINI_API_KEY: ""
      SPEECH_ENABLED: "false"
      STT_FALLBACK_BACKEND: ""
      TTS_FALLBACK_BACKEND: ""
      TRANSLATE_FALLBACK_BACKEND: ""
      SUNBIRD_API_URL: ""
      SUNBIRD_API_TOKEN: ""
      SUNBIRD_FALLBACK_API_TOKEN: ""
      OTEL_ENABLED: "false"

      # Local document/PDF processing bounds and durable local-only storage.
      ANALYTICS_BACKEND: sqlite
      ANALYTICS_DB_DIR: /tmp/ura-analytics
      DOCUMENT_STORE_DIR: /tmp/ura-document-store
      DOCUMENT_MAX_BYTES: "41943040"
      DOCUMENT_OCR_TIMEOUT_SECONDS: "20"
      DOCUMENT_MAX_PDF_RENDER_PIXELS: "12000000"
      DOCUMENT_RATE_LIMIT: "10/minute"
      EXPORT_RATE_LIMIT: "10/minute"

  # This service is optional for the focused command above, but if an operator
  # starts the whole profile it must remain local as well.
  frontend:
    ports: !override
      - "127.0.0.1:${LOCAL_DOCUMENT_FRONTEND_PORT:-3032}:3000"
