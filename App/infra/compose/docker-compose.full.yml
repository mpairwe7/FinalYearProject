# =============================================================================
# URA Chatbot — the image-based, hardened variant of the base stack (an overlay)
#
# Not a stack of its own: it layers on docker-compose.yml, which defines every
# service but one. This file changes four of them: redis, qdrant, api and
# frontend run from published images, read-only and with dropped capabilities,
# and publish the ports named in .env. It also adds vllm (profile: vllm).
#
#   cd App && docker compose -f docker-compose.yml -f infra/compose/docker-compose.full.yml up -d
#   export COMPOSE_FILE=App/docker-compose.yml:App/infra/compose/docker-compose.full.yml   # from the root
#
# Needs Docker Compose v2.24.4 or later, for `!override`.
#
# A full stack started before this layout runs on the old `ura-network`. Stop it
# once with `docker compose -p app down`, before the first `up`: it needs no Compose file, stops
# the containers of every profile, removes the old network and keeps the volumes.
#
# `!override` replaces the base's value outright, where Compose would otherwise
# merge the two lists. `!reset` removes a key the base sets. Dropping either tag
# lets the base's settings into this variant (ADR-0064).
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Redis — shared rate-limit buckets + distributed semantic cache
  # (multi-worker / multi-replica correctness)
  # ---------------------------------------------------------------------------
  redis:
    container_name: ura-redis
    command: !override ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # Run as the image's own redis user (999:1000) rather than starting as root
    # and dropping down.
    #
    # The entrypoint's root branch does `find . \! -user redis -exec chown redis`
    # over /data before switching users. Root normally walks any directory via
    # CAP_DAC_OVERRIDE — but `cap_drop: ALL` removes it, and the `appendonlydir`
    # redis itself creates is mode 0700. So the very first restart after redis
    # had written an AOF failed with
    #     find: ./appendonlydir: Permission denied
    # and exited 1, into a crash loop. Wiping the volume does not fix it: the
    # next AOF write recreates the same 0700 directory and the next restart
    # fails again.
    #
    # Starting as the target user skips that branch entirely — nothing needs to
    # chown anything — so CHOWN/SETGID/SETUID are no longer needed either. This
    # is a strictly smaller capability set than before, not a relaxation.
    user: "999:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ---------------------------------------------------------------------------
  # Qdrant Vector Store (first-class RAG dependency)
  # ---------------------------------------------------------------------------
  qdrant:
    container_name: ura-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes: !override
      - qdrant_data:/qdrant/storage
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # ---------------------------------------------------------------------------
  # Backend API Service
  # ---------------------------------------------------------------------------
  api:
    image: ${DOCKER_IMAGE:-landwind/ura-chatbot-api}:${IMAGE_TAG:-latest}
    container_name: ura-chatbot-api
    ports: !override
      - "${API_PORT:-8000}:8000"
    environment: !override
      - APP_ENV=${APP_ENV:-development}
      - PORT=8000
      - WORKERS=${WORKERS:-2}
      - HF_MODEL_REPO=${HF_MODEL_REPO:-mpairweLandwind/ura-chatbot}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ANALYTICS_DB_DIR=/app/data_store
      - QDRANT_URL=http://qdrant:6333
      # Contradiction grounding. Defaulted here, not only in .env.example, so
      # a deployment whose .env predates this setting still gets the semantic
      # check instead of silently running the numeric-only fallback. Loading
      # is lazy and degrades to numeric-only if the model is unavailable.
      - ENTAILMENT_MODEL=${ENTAILMENT_MODEL:-cross-encoder/nli-deberta-v3-small}
      # Redis-backed rate limit + semantic cache (Phase 7)
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SLOWAPI_STORAGE_URI=${SLOWAPI_STORAGE_URI:-redis://redis:6379/1}
      - CACHE_BACKEND=${CACHE_BACKEND:-redis}
      # Telemetry (App/docs/MONITORING.md): OTLP goes to the monitoring profile's
      # Collector when OTEL_ENABLED=true; METRICS_TOKEN comes from .env.
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      # Written out, not read from App/.env: that file's values are for a process on the
      # host (localhost, text logs), and this container reaches the collector by service name.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - LOG_FORMAT=json
    read_only: true
    # Owned by the image's appuser (10001). A bare tmpfs entry mounts root:root
    # 0755 over the image's appuser-owned directory, so the API — which runs as
    # appuser on a read-only root — could not create /app/data_store/analytics.db:
    # conversations, workflow state, tombstones and discrepancy reports all
    # failed at startup with "unable to open database file" (G296).
    tmpfs: !override
      - /tmp
      - /app/cache:uid=10001,gid=10001
      - /app/data_store:uid=10001,gid=10001
    volumes: !override
      - ../artifacts/models:/app/models:ro
      - ../artifacts/offline:/app/offline:ro
      - ../artifacts/quantized:/app/quantized:ro
      - api_logs:/app/logs
      # analytics_data volume removed — /app/data_store is already mounted as
      # tmpfs (required for the read_only container). A named volume and tmpfs
      # cannot share the same target path in Docker Compose.
    healthcheck: !override
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    extra_hosts: !reset null  # the base sets it; this variant does not
    deploy: !reset null  # the base sets it; this variant does not

  # ---------------------------------------------------------------------------
  # Frontend Service
  # ---------------------------------------------------------------------------
  frontend:
    build: !override
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: ${DOCKER_IMAGE_FRONTEND:-landwind/ura-chatbot-frontend}:${IMAGE_TAG:-latest}
    container_name: ura-chatbot-frontend
    ports: !override
      - "${FRONTEND_PORT:-3000}:3000"
    environment: !override
      - NODE_ENV=production

  # ---------------------------------------------------------------------------
  # vLLM — high-throughput LLM inference server (profile: vllm)
  # Enable with: docker compose --profile vllm up
  # Then set in .env: LLM_BACKEND=vllm VLLM_BASE_URL=http://vllm:8001/v1
  # Requires an NVIDIA GPU + nvidia-container-toolkit on the host.
  # ---------------------------------------------------------------------------
  vllm:
    image: vllm/vllm-openai:v0.17.1
    container_name: ura-vllm
    command: >
      --model ${LLM_MODEL:-Sunbird/Sunflower-Qwen3.5-9B}
      --port 8001
      --max-model-len ${VLLM_MAX_MODEL_LEN:-262144}
      --gpu-memory-utilization ${VLLM_GPU_MEM_UTIL:-0.85}
      --dtype ${VLLM_DTYPE:-auto}
      --enable-prefix-caching
      --enable-chunked-prefill
      --max-num-batched-tokens ${VLLM_MAX_BATCH_TOKENS:-16384}
      --max-num-seqs ${VLLM_MAX_SEQS:-64}
      --enable-auto-tool-choice
      --tool-call-parser hermes
    ports:
      - "${VLLM_PORT:-8001}:8001"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/v1/models', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - vllm
    networks:
      - app-network

volumes:
  hf_cache:
