id: tin_registration
name: TIN Registration Guide
version: "2"
description: >
  Give privacy-preserving guidance for preparing a TIN application. This
  workflow does not collect identity details or submit a registration.
requires_auth: false

trigger_phrases:
  - "register for a tin"
  - "get a tin"
  - "tin registration"
  - "obtain a tin"
  - "apply for tin"
  - "i need a tin"
  - "how do i get a tin"

steps:
  - id: collect_type
    title: "Applicant type"
    question: >
      Which application are you preparing for: an **individual**, a **company**,
      or an **NGO**? Please do not share your NIN, passport number, date of birth,
      phone number, or company documents in this chat.
    slot: taxpayer_type
    validator: "enum[individual,company,ngo]"

  - id: collect_documents_ready
    title: "Documents"
    question: >
      Do you have the original identification or organization registration
      documents ready to use in the secure URA portal? (yes/no)
    slot: documents_ready
    validator: boolean

  - id: summary
    title: "Continue securely"
    question: >
      This chat has not created or submitted a TIN application. Continue at the
      official URA portal: https://ura.go.ug → eServices → TIN Registration.
      Use the individual route for a personal TIN, or the non-individual route
      for a company or NGO. Keep your original documents ready. Do not share
      passwords, one-time codes, or payment details in chat.
    slot: ""
    validator: text
    portal_action: tin_application
    resources:
      - tin_individual
      - tin_non_individual
      - starter_pack
