id: tax_clearance
name: Tax Clearance Certificate
version: "1"
description: >
  Check the four conditions URA applies before approving a tax clearance
  certificate, route each unmet one to its fix, then guide the application,
  tracking and authenticity check.
# Conditions and certificate types from https://ura.go.ug/en/tax-clearance/
# (read 2026-09-29): profile up to date, every return filed, associated
# persons' returns filed, returns satisfactory, tax paid or under an
# instalment agreement. Annual certificates go to clients monitored as
# compliant for 3+ years; a transactional one expires once submitted.
requires_auth: false

trigger_phrases:
  - "tax clearance"
  - "clearance certificate"
  - "apply for a tcc"
  - "get a tcc"
  - "need a tcc"

steps:
  - id: collect_taxpayer_type
    title: "Taxpayer type"
    question: >
      Is the certificate for an **individual**, a **company** or a
      **partnership**?
    slot: taxpayer_type
    validator: "enum[individual,company,partnership]"

  - id: collect_certificate_type
    title: "Certificate type"
    question: >
      Do you need it for **one transaction** (for example a tender, a work
      permit or a licence renewal) or an **annual** certificate?
    slot: certificate_type
    validator: "enum[one transaction,annual]"

  - id: annual_note
    title: "Annual certificates"
    question: >
      URA issues annual certificates to taxpayers it has monitored as
      compliant for three years or more. If you are newer than that, apply
      for a one-transaction certificate instead.
    when: "certificate_type == annual"
    slot: ""
    validator: text
    resources:
      - tax_clearance

  - id: collect_returns_filed
    title: "Returns filed"
    question: >
      Have you filed every return for all the tax types you are registered
      for? (yes/no)
    slot: returns_filed
    validator: boolean

  - id: returns_guidance
    title: "File missing returns"
    question: >
      URA will not approve the certificate while any return is outstanding.
      File the missing returns first; say **help me file my return** and I
      will guide you through it.
    when: "returns_filed == False"
    slot: ""
    validator: text
    resources:
      - file_return

  - id: collect_directors_filed
    title: "Directors' returns"
    question: >
      URA also checks the company's directors. Has every director filed
      their own returns? (yes/no)
    when: "taxpayer_type == company"
    slot: associates_filed
    validator: boolean

  - id: collect_partners_filed
    title: "Partners' returns"
    question: >
      URA also checks the partners. Has every partner filed their own
      returns? (yes/no)
    when: "taxpayer_type == partnership"
    slot: associates_filed
    validator: boolean

  - id: associates_guidance
    title: "Associates must file"
    question: >
      Each director or partner with an outstanding return must file it
      before the certificate can be approved. They can use the same filing
      guide: **help me file my return**.
    when: "associates_filed == False"
    slot: ""
    validator: text

  - id: collect_tax_paid
    title: "Tax paid"
    question: >
      Is all tax due paid, or covered by an instalment agreement with URA?
      (yes/no)
    slot: tax_paid
    validator: boolean

  - id: payment_guidance
    title: "Pay or agree instalments"
    question: >
      Pay the outstanding tax first by generating a PRN, or ask URA for an
      instalment agreement. Either one clears this condition.
    when: "tax_paid == False"
    slot: ""
    validator: text
    portal_action: make_payment
    resources:
      - payment_status

  - id: apply
    title: "Apply in eTax"
    question: >
      Sign in to eTax with your TIN and password, open the tax clearance
      application, choose the certificate type, state the purpose and
      submit. Keep the reference number it gives you.
    slot: ""
    validator: text
    portal_action: etax_login
    resources:
      - tax_clearance

  - id: summary
    title: "Track, download, verify"
    question: >
      Follow the application on **Track Application Status**. When it is
      approved, download the certificate from eTax and check it on
      **Document Authentication**, the same check the receiving organisation
      uses. A one-transaction certificate expires once you hand it over.
    slot: ""
    validator: text
    portal_action: track_application_status
    resources:
      - document_authentication
