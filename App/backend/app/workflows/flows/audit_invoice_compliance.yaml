id: audit_invoice_compliance
name: Tax Invoice & EFRIS Document Review
version: "1"
description: >
  Guided collection of visible tax-invoice fields and taxpayer-reported amounts.
  This chat does not calculate VAT, query EFRIS, verify a fiscal signature,
  check TIN status, or determine input tax-credit eligibility.
requires_auth: false

trigger_phrases:
  - "audit an invoice"
  - "verify my invoice"
  - "invoice compliance check"
  - "efris invoice verification"
  - "check vat on invoice"
  - "verify input tax"
  - "is this invoice valid"

steps:
  - id: collect_document_category
    question: >
      What type of document are you auditing: an **efris invoice**, a **standard tax invoice**,
      a **fiscal receipt**, or a **withholding certificate**?
    slot: doc_category
    validator: "enum[efris invoice,standard tax invoice,fiscal receipt,withholding certificate]"

  - id: collect_supplier_tin_present
    question: >
      Does the invoice show the supplier's TIN? Please answer yes or no; do not paste the number here.
    slot: supplier_tin_present
    validator: boolean

  - id: collect_buyer_tin_present
    question: >
      Does the invoice show the buyer's TIN? Please answer yes or no; do not paste the number here.
    slot: buyer_tin_present
    validator: boolean

  - id: collect_net_amount
    question: >
      What is the net chargeable amount (excluding VAT) in UGX?
    slot: net_amount
    validator: "number[min=0]"

  - id: collect_vat_amount
    question: >
      What is the VAT amount shown on the invoice in UGX? (Enter 0 if zero-rated or exempt)
    slot: vat_amount
    validator: "number[min=0]"

  - id: collect_efris_serial
    question: >
      Does the invoice show an FDN and verification code or QR code? Please answer yes or no; this chat cannot validate them against EFRIS.
    slot: has_efris_code
    validator: boolean

  - id: efris_warning
    question: >
      This chat cannot validate the invoice with EFRIS. Use the official URA portal or EFRIS app to check its FDN and date before relying on it.
    when: "has_efris_code == False"
    slot: ""
    validator: text

  - id: summary
    question: >
      Review complete: this guide recorded visible fields and amounts you reported. It did not calculate VAT, check whether either TIN is active, authenticate an EFRIS signature, or determine input-tax eligibility. For an EFRIS invoice, validate the FDN and date in the official URA portal or EFRIS app. Ask a tax adviser or URA if you are unsure whether the expense qualifies for input tax.
    slot: ""
    validator: text
    portal_action: efris_portal
    resources:
      - efris_fdn_validation
      - efris_portal
