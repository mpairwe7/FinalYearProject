id: payment_assistance
name: Payment Assistance
version: "1"
description: >
  Guide a taxpayer through the details needed to make a URA payment or
  generate a PRN-linked payment plan. This guide does not generate a PRN or
  process a payment.
requires_auth: false

trigger_phrases:
  - "make a payment"
  - "pay my tax"
  - "how do i pay ura"
  - "generate a prn"
  - "payment registration number"
  - "pay a tax bill"
  - "payment help"

steps:
  - id: collect_tax_type
    title: "Tax type"
    question: >
      Which tax type or liability are you paying for?
    slot: tax_type
    validator: text

  - id: collect_reference_kind
    title: "Reference type"
    question: >
      Do you already have a **PRN**, a **return** reference, an **assessment**
      reference, or is it **unknown**?
    slot: reference_kind
    validator: "enum[prn,return,assessment,unknown]"

  - id: collect_amount_known
    title: "Amount"
    question: >
      Do you already know the exact amount to pay? (yes/no)
    slot: amount_known
    validator: boolean

  - id: collect_amount
    title: "Amount due"
    question: >
      What amount do you expect to pay? You can enter the figure in UGX.
    slot: payment_amount
    validator: text
    when: "amount_known == True"

  - id: collect_channel
    title: "Payment channel"
    question: >
      Which payment channel do you prefer: **bank**, **mobile money**,
      **online card**, or **other**?
    slot: payment_channel
    validator: "enum[bank,mobile money,online card,other]"

  - id: amount_warning
    title: "Confirm the amount"
    question: >
      If the amount is not confirmed yet, generate or review the PRN first in the
      URA portal so the amount, tax head, and period all match before payment.
    when: "amount_known == False"
    slot: ""
    validator: text

  - id: summary
    title: "Pay and keep proof"
    question: >
      This chat has not generated a PRN or processed a payment. Sign in to the
      official URA portal, confirm the tax head, period, and amount, then generate
      or review the PRN before paying through a listed channel. Keep the receipt
      and check that the payment is reflected against the correct obligation.
      Never share your password, PIN, one-time code, or full card details in chat.
    slot: ""
    validator: text
    # Ids in app/verified_resources.py — every link there was checked live.
    portal_action: make_payment
    resources:
      - payment_status
      - reactivate_prn
