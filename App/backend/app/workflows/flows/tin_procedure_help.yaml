id: tin_procedure_help
name: TIN Registration Help
version: "1"
description: >-
  One-question clarification (individual vs organisation) before giving the
  matching curated TIN registration steps. Started programmatically by the
  TIN fast path when the ask names neither type; completion is special-cased
  in service._maybe_handle_workflow to return the curated template.
requires_auth: false
trigger_phrases: []

steps:
  - id: ask_kind
    question: >-
      To register for a TIN with URA in Uganda:
      1. Visit the official URA web portal at https://ura.go.ug
      2. Navigate to **eServices** > **TIN Registration**
      3. Complete the online application form and submit.

      Are you registering as an **individual** (requires your National ID/NIN) or an **organisation** (requires Certificate of Incorporation)?
    slot: taxpayer_kind
    validator: "enum[individual,organisation]"
