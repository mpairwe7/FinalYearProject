<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#003087"/>
      <stop offset="100%" stop-color="#001A4D"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F9C74F"/>
      <stop offset="100%" stop-color="#D4A843"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00A88F"/>
      <stop offset="100%" stop-color="#2EC4A8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: rounded shield shape -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#shield)"/>

  <!-- Subtle inner border -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none"
        stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Main chat bubble (gold) -->
  <path d="M 140 150
           C 140 125, 160 108, 185 108
           L 327 108
           C 352 108, 372 125, 372 150
           L 372 255
           C 372 280, 352 297, 327 297
           L 220 297
           L 175 340
           L 185 297
           L 185 297
           C 160 297, 140 280, 140 255
           Z"
        fill="url(#bubble)" opacity="0.95"/>

  <!-- AI sparkle dots inside bubble (navy) -->
  <circle cx="210" cy="195" r="16" fill="#003087" opacity="0.8"/>
  <circle cx="256" cy="195" r="16" fill="#003087" opacity="0.8"/>
  <circle cx="302" cy="195" r="16" fill="#003087" opacity="0.8"/>

  <!-- Animated thinking dots - slightly offset vertically -->
  <circle cx="210" cy="195" r="10" fill="white" opacity="0.9"/>
  <circle cx="256" cy="195" r="10" fill="white" opacity="0.7"/>
  <circle cx="302" cy="195" r="10" fill="white" opacity="0.5"/>

  <!-- Teal accent bar at bottom -->
  <rect x="140" y="370" width="232" height="6" rx="3" fill="url(#tealGrad)" opacity="0.9"/>

  <!-- "AI" text badge -->
  <rect x="330" y="340" width="56" height="32" rx="16" fill="url(#tealGrad)"/>
  <text x="358" y="361" font-family="system-ui,-apple-system,sans-serif" font-size="18"
        font-weight="700" fill="white" text-anchor="middle">AI</text>

  <!-- Subtle sparkle/star (gold) top-right of bubble -->
  <g transform="translate(380, 100)" filter="url(#glow)">
    <path d="M 0 -14 L 4 -4 L 14 0 L 4 4 L 0 14 L -4 4 L -14 0 L -4 -4 Z"
          fill="#F9C74F" opacity="0.9"/>
  </g>

  <!-- Small Uganda flag colors accent (bottom strip) -->
  <rect x="140" y="392" width="58" height="4" rx="2" fill="#1A1A1A"/>
  <rect x="198" y="392" width="58" height="4" rx="2" fill="#F9C74F"/>
  <rect x="256" y="392" width="58" height="4" rx="2" fill="#CE1126"/>
  <rect x="314" y="392" width="58" height="4" rx="2" fill="#1A1A1A"/>
</svg>
