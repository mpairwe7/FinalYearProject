# Local GPU overlay — Sunbird SALT speech backends baked in.
#
# Layers on top of docker-compose.yml + docker-compose.local-sunflower.yml:
# builds `api` from Dockerfile.gpu (repo root) instead of the base Dockerfile
# so Spark-TTS-SALT's BiCodec checkout is present (SPARK_TTS_REPO_DIR) and
# torch comes from the cu128 index instead of requirements.txt's CUDA-13 pin.
#
# Both SALT tiers run on the GPU. They previously ran on cpu here because
# the image's torch==2.12.1 is a CUDA-13 build and this host's driver
# reports CUDA 12.2, so torch.cuda.is_available() was False. That was a
# wheel problem, not a driver problem — CUDA minor-version compatibility
# means any cu12x build runs on a >=525 driver, and vllm proves it on this
# very host with torch 2.6.0+cu124. Dockerfile.gpu now pins a matched
# cu128 torch/torchaudio pair; see its header and
# docs/runbooks/salt-speech-backends.md.
#
#   cd App && GPU_ID=2 docker compose \
#     -f docker-compose.yml -f docker-compose.local-retrieval.yml \
#     -f docker-compose.local-sunflower.yml \
#     -f docker-compose.gpu-salt.yml up -d --build
services:
  api:
    build:
      dockerfile: Dockerfile.gpu
    image: ${DOCKER_IMAGE_API:-app-api}:gpu
    environment:
      # docker-compose.local-retrieval.yml is an INDEXING profile: it turns the
      # LLM and the whole speech pipeline off so a corpus rebuild never loads
      # them. This overlay sits after it in the chain and is the serving
      # profile, so it has to turn both back on — otherwise `api` comes up with
      # LLM_ENABLED=false (every answer retrieval-only, vLLM never called
      # despite running) and SPEECH_ENABLED=false (startup leaves
      # app.state.speech as None, so get_speech_model raises 503 and neither
      # SALT tier is ever constructed — /v1/asr and /v1/tts stop serving
      # entirely rather than degrading). Same reason
      # the QDRANT_* values below are restated: a preceding overlay's default
      # is not a safe default for this one.
      - LLM_ENABLED=true
      - SPEECH_ENABLED=true
      - WORKERS=1
      - RECEPTIONIST_ENGINE=${RECEPTIONIST_ENGINE:-gemini_live}
      # Multilingual receptionist (en/sw on Gemini Live, lg on the cascaded
      # engine). Default on with Gemini Live; brings up the Orpheus voice
      # below (`--profile multilingual`) with ORPHEUS_TTS_URL pointed at it.
      - FLAG_RECEPTIONIST_LANGUAGE_DETECTION=${FLAG_RECEPTIONIST_LANGUAGE_DETECTION:-true}
      - ORPHEUS_TTS_URL=${ORPHEUS_TTS_URL:-http://orpheus-tts:8100}
      - FLAG_VOICE_RECEPTIONIST=true
      - FLAG_VOICE_CONSENT=true
      - FLAG_TICKET_QUEUE=true
      - FLAG_HANDOFF_SUMMARIES=true
      # cuda:0 — the container sees exactly one card (device_ids below), so
      # index 0 inside is GPU_ID outside. Same convention the base file's
      # RETRIEVER_DENSE_DEVICE already uses.
      - WHISPER_SALT_DEVICE=${SPEECH_DEVICE:-cuda:0}
      - SPARK_TTS_DEVICE=${SPEECH_DEVICE:-cuda:0}
      # The base file pins the reranker to cpu to dodge a GPU-0 startup stall
      # on the shared box. This overlay already reserves one specific card, so
      # that hazard doesn't apply — and with a working CUDA build the reranker
      # is one of the two CPU-bound stages that made a cold hybrid answer take
      # ~37s. Cross-encoder reranking is exactly the small-batch GPU work a
      # card this size absorbs for free next to vLLM.
      - RERANKER_DEVICE=${RERANKER_DEVICE:-cuda:0}
      # Pin this GPU profile to the staged local Qdrant alias. The local
      # retrieval overlay supplies the indexer and persistent index state;
      # repeating the serving values here makes an accidental Vectorize
      # selection impossible even if Cloudflare credentials are in .env.
      - QDRANT_ENABLED=true
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=ura_knowledge_base_jsonl_active
      - DENSE_FALLBACK_BACKEND=none
      # Everything this stack can serve from a locally cached model, it does:
      # ASR is Whisper-SALT and non-English TTS is Spark-TTS-SALT (both baked
      # in above, both on the GPU), and retrieval-time translation runs as
      # prompted MT through the already-loaded Sunflower rather than calling
      # out to Sunbird. Cloud translate was measured timing out at its full
      # 30s here, and because the retrieval rescue treats translation as
      # best-effort, that silently abstained every Luganda/Kiswahili question.
      # English TTS still falls through to edge-tts: Spark-TTS-SALT ships no
      # English speaker id and no local piper voice is present in artifacts/.
      - RETRIEVAL_MT_BACKEND=${RETRIEVAL_MT_BACKEND:-local}
      - REPLY_MT_BACKEND=${REPLY_MT_BACKEND:-local}
      # Same value the app defaults to, exposed here so a capacity run can
      # raise it. Note what this limit actually is through the tunnel: slowapi
      # keys on get_remote_address, and TRUSTED_PROXY_HOSTS defaults to
      # loopback only, so the frontend container is not a trusted proxy and
      # every public request is attributed to that one container IP. All
      # tunnel traffic therefore shares ONE 30/minute bucket regardless of how
      # many distinct callers there are. Raise it (e.g. RATE_LIMIT=10000/minute,
      # matching docs/traceability/capacity-envelope-2026-08-19.md) to measure
      - RATE_LIMIT=${RATE_LIMIT:-10000/minute}
      - NVIDIA_VISIBLE_DEVICES=${GPU_ID:-2}
      # BAAI/bge-m3 (dense retriever) and the reranker are not in the NAS
      # cache — HF_HUB_OFFLINE=1 (base file) silently pushed dense retrieval
      # to the Cloudflare Vectorize fallback instead of local Qdrant. Allow
      # one-time network fetch; the NAS mount below is read-write so it
      # persists for the next run instead of re-downloading every time.
      - HF_HUB_OFFLINE=0
    volumes:
      - type: bind
        source: /mnt/nas1/caches/huggingface_cache
        target: /app/hf_cache
    deploy:
      resources:
        reservations:
          # The base profile reserves every GPU. Replace—not append to—that
          # list, otherwise Docker exposes all cards despite
          # NVIDIA_VISIBLE_DEVICES and a local-GPU run can contend with other
          # workloads on the host.
          devices: !override
            - driver: nvidia
              device_ids: ["${GPU_ID:-2}"]
              capabilities: [gpu]

  # The local-retrieval overlay supplies this one-shot staged indexer. Give it
  # the same CUDA-capable image and one visible card so a first corpus build
  # does not take the CPU-only path before the GPU API can serve it.
  qdrant-indexer:
    build:
      dockerfile: Dockerfile.gpu
    image: ${DOCKER_IMAGE_API:-app-api}:gpu
    environment:
      - RETRIEVER_DENSE_DEVICE=cuda:0
      - NVIDIA_VISIBLE_DEVICES=${GPU_ID:-2}
      # Dockerfile.gpu does not set HF_HOME. Without this, the one-shot
      # indexer downloads bge-m3 under /root and discards it on exit despite
      # the mounted cache below.
      - HF_HOME=/app/hf_cache
      - HF_HUB_OFFLINE=0
    volumes:
      - type: bind
        source: /mnt/nas1/caches/huggingface_cache
        target: /app/hf_cache
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ["${GPU_ID:-2}"]
              capabilities: [gpu]

  # Orpheus-3B (Sunbird multilingual) — the receptionist's Luganda voice.
  # Its own vLLM, so its own image (App/backend/orpheus_sidecar); weight-only
  # FP8 because at bf16 an A6000 only just keeps up with real time
  # (evals/reports/orpheus_tts_2026-09-24_*.json). Needs ~6 GB of weights plus
  # KV cache: give it a card of its own when one is free (ORPHEUS_GPU_ID) —
  # Sunflower, Whisper-SALT and Orpheus together are too much for one 24 GB
  # card, though they fit one 48 GB A6000.
  #   ORPHEUS_GPU_ID=7 ORPHEUS_TTS_URL=http://orpheus-tts:8100 \
  #   FLAG_RECEPTIONIST_LANGUAGE_DETECTION=true docker compose ... --profile multilingual up -d
  orpheus-tts:
    profiles: ["multilingual"]
    build:
      context: ./backend/orpheus_sidecar
    image: ${DOCKER_IMAGE_ORPHEUS:-app-orpheus-tts}:latest
    container_name: ura-app-orpheus-tts
    environment:
      - HF_HOME=/app/hf_cache
      - HF_HUB_OFFLINE=0
      - ORPHEUS_GPU_MEM_UTIL=${ORPHEUS_GPU_MEM_UTIL:-0.35}
      - ORPHEUS_QUANTIZATION=${ORPHEUS_QUANTIZATION:-fp8}
      - NVIDIA_VISIBLE_DEVICES=${ORPHEUS_GPU_ID:-${VLLM_GPU_ID:-${GPU_ID:-2}}}
    volumes:
      - type: bind
        source: /mnt/nas1/caches/huggingface_cache
        target: /app/hf_cache
    ipc: host
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ORPHEUS_GPU_ID:-${VLLM_GPU_ID:-${GPU_ID:-2}}}"]
              capabilities: [gpu]
    networks:
      - app-network

  vllm:
    environment:
      - NVIDIA_VISIBLE_DEVICES=${VLLM_GPU_ID:-${GPU_ID:-2}}
    deploy:
      resources:
        reservations:
          # Replace the Sunflower profile's default GPU reservation as well;
          # otherwise Compose appends it and vLLM can reserve two cards.
          devices: !override
            - driver: nvidia
              device_ids: ["${VLLM_GPU_ID:-${GPU_ID:-2}}"]
              capabilities: [gpu]
