# =============================================================================
# URA Chatbot App — Docker Compose (backend + frontend + deps)
#
# The one stack, and the only Compose file in this folder. Every file in
# infra/compose/ is an overlay on it and is listed after it, so the paths in an
# overlay are read from this folder. infra/compose/docker-compose.full.yml turns
# it into the image-based, hardened variant (ADR-0064).
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: ura-app-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # Qdrant Vector Store
  # ---------------------------------------------------------------------------
  qdrant:
    # Keep the server on the actively maintained v1.19 release line. Upgrades
    # of an existing qdrant_data volume must follow Qdrant's documented
    # one-minor-version-at-a-time path; see App/docs/runbooks/qdrant-staged-rebuild.md.
    image: qdrant/qdrant:v1.19.0
    container_name: ura-app-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
      # Downloaded, checksummed snapshots are stored on a separate named
      # volume beneath Qdrant's approved snapshots directory. It is read-only
      # to Qdrant and is used only for restore drills.
      - qdrant_backups:/qdrant/snapshots/restore:ro
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 'passed' <&3"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # Backend API
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: App/Dockerfile
      target: runtime
    container_name: ura-app-api
    ports:
      - "8083:8000"
    environment:
      - APP_ENV=development
      - PORT=8000
      - WORKERS=4
      - LOG_LEVEL=info
      - RATE_LIMIT=${RATE_LIMIT:-10000/minute}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - SLOWAPI_STORAGE_URI=redis://redis:6379/1
      - CACHE_BACKEND=redis
      - CORS_ORIGINS=http://localhost:3032,https://struttingly-nongeological-briella.ngrok-free.dev
      # Fast local generation: API connects directly to the containerized vLLM Sunflower service
      - LLM_BACKEND=vllm
      - LLM_MODEL=Sunbird/Sunflower-14B-FP8
      - VLLM_BASE_URL=http://vllm:8001/v1
      - VLLM_API_KEY=not-needed
      - VLLM_HTTP_TIMEOUT=90
      - LLM_MAX_TOKENS=512
      - LLM_DEVICE=cpu
      - LLM_LOAD_IN_4BIT=false
      - RETRIEVER_DENSE_DEVICE=cpu
      - RERANK_ENABLED=false
      - RERANKER_DEVICE=cpu
      # --- Qwen3-8B LoRA adapters ---
      - LORA_ADAPTER_LG=/app/adapters/luganda-lora
      - LORA_ADAPTER_SW=/app/adapters/sw-lora
      - LORA_ADAPTER_NYN=/app/adapters/nyn-lora
      - LORA_ADAPTER_ACH=/app/adapters/ach-lora
      - NVIDIA_VISIBLE_DEVICES=2
      - PROJECT_ROOT=/app
      - HF_HOME=/app/hf_cache
      - HF_HUB_OFFLINE=1
      - INDEX_API_KEY=dev-index-key
      # --- Fine-tuned Whisper LoRA adapters ---
      - WHISPER_ADAPTER_LG=/app/adapters/whisper-lg
      - WHISPER_ADAPTER_SW=/app/adapters/whisper-sw
      - WHISPER_ADAPTER_NYN=/app/adapters/whisper-nyn
      - WHISPER_DEVICE=cpu
      # --- Prompted local MT via the already-loaded Qwen backend ---
      - SPEECH_MT_BACKEND=prompted
      # --- Speech pipeline ---
      - SPEECH_ENABLED=true
      - SPEECH_ASR_BACKEND=auto
      - SPEECH_TTS_BACKEND=auto
      - SPEECH_WARMUP=false
      # --- Phase 28: Native voice-to-voice + Vision ---
      - FLAG_VOICE_STREAMING=true
      - FLAG_NATIVE_VOICE=true
      - FLAG_STREAMING_TTS_V2=true
      - FLAG_VOICE_VISION_V2=true
      - FLAG_VOICE_RECEPTIONIST=true
      - FLAG_RECEPTIONIST_LANGUAGE_DETECTION=${FLAG_RECEPTIONIST_LANGUAGE_DETECTION:-true}
      - ORPHEUS_TTS_URL=${ORPHEUS_TTS_URL:-http://orpheus-tts:8100}
      - FLAG_SPECULATIVE_PREFETCH=true
    env_file:
      - .env
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      # appuser-owned: a bare entry is root:root 0755, unwritable by the API (G296)
      - /app/cache:uid=10001,gid=10001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Data/dataset:/app/Data/dataset:ro
      - ./Data/pdfs:/app/Data/pdfs:ro
      - ./Model:/app/Model:ro
      - ../artifacts:/app/artifacts:ro
      - ./Model/adapters:/app/adapters:ro
      - ./ml:/app/ml:ro
      - ./plugins:/app/plugins:ro
      - ./backend/app:/app/app
      - api_logs:/app/logs
      - ../data_store:/app/data_store
      - /mnt/nas1/caches/huggingface_cache:/app/hf_cache:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 8m
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0","1","2","3","4","5","6","7"]
              capabilities: [gpu]
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        INTERNAL_API_URL: http://api:8000
        NEXT_PUBLIC_OIDC_ISSUER: ${NEXT_PUBLIC_OIDC_ISSUER:-https://dev-s16d7m00eyrksjy2.us.auth0.com/}
        NEXT_PUBLIC_OIDC_CLIENT_ID: ${NEXT_PUBLIC_OIDC_CLIENT_ID:-jjOlcY4Td9AmmaQZIPkxEY6dLO60YagX}
        NEXT_PUBLIC_OIDC_AUDIENCE: ${NEXT_PUBLIC_OIDC_AUDIENCE:-https://ura-chatbot/api}
        NEXT_PUBLIC_OIDC_SCOPE: ${NEXT_PUBLIC_OIDC_SCOPE:-openid profile email}
        # Registered at Auth0 under "Allowed Logout URLs", matched exactly.
        # The HF Space is registered as <origin>/signin; the ngrok tunnel as
        # the bare origin, so a local tunnel run sets this to "".
        #
        # `-` and not `:-`: an EXPLICIT empty value is a real choice here (it
        # means "the origin, no path"), and `:-` would silently replace it with
        # the default — sending an unregistered URL that the provider refuses.
        NEXT_PUBLIC_OIDC_POST_LOGOUT_PATH: ${NEXT_PUBLIC_OIDC_POST_LOGOUT_PATH-/signin}
        NEXT_PUBLIC_DEV_SIGNIN: ${NEXT_PUBLIC_DEV_SIGNIN:-true}
    container_name: ura-app-frontend
    ports:
      - "3032:3000"
    environment:
      - NODE_ENV=production
      - INTERNAL_API_URL=http://api:8000
      - NEXT_PUBLIC_OIDC_ISSUER=${NEXT_PUBLIC_OIDC_ISSUER:-https://dev-s16d7m00eyrksjy2.us.auth0.com/}
      - NEXT_PUBLIC_OIDC_CLIENT_ID=${NEXT_PUBLIC_OIDC_CLIENT_ID:-jjOlcY4Td9AmmaQZIPkxEY6dLO60YagX}
      - NEXT_PUBLIC_OIDC_AUDIENCE=${NEXT_PUBLIC_OIDC_AUDIENCE:-https://ura-chatbot/api}
      - NEXT_PUBLIC_OIDC_SCOPE=${NEXT_PUBLIC_OIDC_SCOPE:-openid profile email}
      - NEXT_PUBLIC_OIDC_POST_LOGOUT_PATH=${NEXT_PUBLIC_OIDC_POST_LOGOUT_PATH-/signin}
      - NEXT_PUBLIC_DEV_SIGNIN=${NEXT_PUBLIC_DEV_SIGNIN:-true}
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-network

  # ===========================================================================
  # Optional services. Each sits behind a profile, so none starts unless its
  # profile is named: postgres, dev, tls, monitoring, monitoring-gpu.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # PostgreSQL — optional multi-replica analytics store
  # Enable with: docker compose --profile postgres up
  # Then set in .env: ANALYTICS_BACKEND=postgres, POSTGRES_PASSWORD, and
  # POSTGRES_DSN=postgresql://ura:<POSTGRES_PASSWORD>@postgres:5432/ura_analytics
  # The API does not wait for this service, so on a cold start it can exit and
  # restart until Postgres accepts connections.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16.6-alpine
    container_name: ura-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ura}
      # No committed default: set POSTGRES_PASSWORD (e.g. `openssl rand -base64 24`).
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - POSTGRES_DB=${POSTGRES_DB:-ura_analytics}
    ports:
      # Loopback only: the API reaches it over the Compose network (G676).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ura} -d $${POSTGRES_DB:-ura_analytics}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles:
      - postgres
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # Development API (with hot-reload)
  # ---------------------------------------------------------------------------
  api-dev:
    build:
      context: ..
      dockerfile: App/Dockerfile
      target: runtime
    image: ${DOCKER_IMAGE:-landwind/ura-chatbot-api}:dev
    container_name: ura-chatbot-api-dev
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_ENV=development
      - PORT=8000
      - LOG_LEVEL=debug
      # The source mount hides the image's /app/data_store, and /app is read-only.
      - ANALYTICS_DB_DIR=/tmp/ura-data
    volumes:
      - ./backend:/app:ro
      - ../artifacts/models:/app/models:ro
    # The image's entrypoint ignores `command` and starts workers without --reload.
    entrypoint: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    profiles:
      - dev
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # Caddy — automatic-TLS reverse proxy (profile: tls)
  # Enable with: docker compose --profile tls up
  # Point DNS at the host; Caddy auto-provisions Let's Encrypt certs.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: ura-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 QUIC
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-localhost}
      - CADDY_ACME_EMAIL=${CADDY_ACME_EMAIL:-admin@example.com}
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    profiles:
      - tls
    networks:
      - app-network

  # ===========================================================================
  # Observability stack (profile: monitoring) — App/docs/MONITORING.md
  #   docker compose --profile monitoring up -d
  # Required env: METRICS_TOKEN (>=32 chars; the API and Prometheus share it),
  # GRAFANA_PASSWORD, ALERTMANAGER_WEBHOOK_URL. UIs bind to 127.0.0.1 only;
  # reach them through an SSH tunnel or a reverse proxy with auth.
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v3.13.4
    container_name: ura-prometheus
    profiles: [monitoring]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/recording-rules.yml:/etc/prometheus/recording-rules.yml:ro
      - ./infra/monitoring/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - ura_metrics_token
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app-network

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: ura-alertmanager
    profiles: [monitoring]
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    secrets:
      - alertmanager_webhook_url
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app-network

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: ura-blackbox-exporter
    profiles: [monitoring]
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    volumes:
      - ./infra/monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app-network

  redis-exporter:
    image: oliver006/redis_exporter:v1.93.0
    container_name: ura-redis-exporter
    profiles: [monitoring]
    environment:
      - REDIS_ADDR=redis://redis:6379
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app-network

  # Host filesystem metrics let the Qdrant volume's capacity be alerted on.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: ura-node-exporter
    profiles: [monitoring]
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    read_only: true
    pid: host
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app-network

  # GPU metrics for the inference cards (needs nvidia-container-toolkit).
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.5.2-4.8.1-ubuntu22.04
    container_name: ura-dcgm-exporter
    profiles: [monitoring-gpu]
    cap_add:
      - SYS_ADMIN
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - app-network

  # The API exports traces, logs and GenAI metrics here over OTLP
  # (OTEL_ENABLED=true, OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    container_name: ura-otel-collector
    profiles: [monitoring]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app-network

  loki:
    image: grafana/loki:3.7.8
    container_name: ura-loki
    profiles: [monitoring]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./infra/monitoring/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app-network

  # Traces from the Collector. In-memory storage: a restart drops them, which
  # suits the demo stack; keep traces you need as evidence in an export.
  # Pinned to 2.20: 2.21 removed the /api/* query API that Grafana's Jaeger
  # data source calls (its health check returns 404 against 2.21).
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: ura-jaeger
    profiles: [monitoring]
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app-network

  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: ura-grafana
    profiles: [monitoring]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      # No committed default: set GRAFANA_PASSWORD (e.g. `openssl rand -base64 24`).
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # The six simulated system connectors as one HTTP server (App/plugins).
  # Not part of the chat stack: `docker compose --profile plugins up ura-plugins-server`.
  # ---------------------------------------------------------------------------
  ura-plugins-server:
    profiles: [plugins]
    build:
      context: ..
      dockerfile: App/Dockerfile.plugins
    container_name: ura-enterprise-plugins
    ports:
      - "8200:8200"
    environment:
      - PORT=8200
      - EFRIS_DB_PATH=/app/data_store/efris_system.db
      - DTS_DB_PATH=/app/data_store/dts_system.db
      - URSB_DB_PATH=/app/data_store/ursb_system.db
      - BWIMS_DB_PATH=/app/data_store/bwims_system.db
      - TIN_DB_PATH=/app/data_store/tin_system.db
      - PAYMENT_DB_PATH=/app/data_store/payments_system.db
      - PLUGINS_API_KEY=${PLUGINS_API_KEY:-}
    volumes:
      - ../data_store:/app/data_store
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/health"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  app-network:
    driver: bridge

volumes:
  redis_data:
  qdrant_data:
  qdrant_backups:
  api_logs:
  postgres_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:

# -----------------------------------------------------------------------------
# Secrets (monitoring profile) — read from the environment, never committed.
# -----------------------------------------------------------------------------
secrets:
  ura_metrics_token:
    environment: METRICS_TOKEN
  alertmanager_webhook_url:
    environment: ALERTMANAGER_WEBHOOK_URL
