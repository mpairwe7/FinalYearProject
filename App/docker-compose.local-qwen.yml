services:
  vllm:
    image: vllm/vllm-openai:v0.8.5
    container_name: ura-app-vllm
    command:
      - --model
      - ${QWEN_MODEL:-Qwen/Qwen3-8B}
      - --port
      - "8001"
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.70"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
    ports:
      - "8011:8001"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ${QWEN_LOCAL_MODEL_DIR:-${HOME}/.cache/huggingface}:/models/local-qwen:ro
    ipc: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=${QWEN_GPU_ID:-4}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/v1/models', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 6m
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${QWEN_GPU_ID:-4}"]
              capabilities: [gpu]
    networks:
      - app-network

  api:
    environment:
      - LLM_BACKEND=vllm
      - LLM_MODEL=${QWEN_MODEL:-Qwen/Qwen3-8B}
      - VLLM_BASE_URL=http://vllm:8001/v1
      - VLLM_API_KEY=not-needed
      - VLLM_HTTP_TIMEOUT=120
      - LLM_MAX_TOKENS=512
      - ANALYTICS_DB_DIR=/tmp/ura-analytics
    depends_on:
      vllm:
        condition: service_healthy
