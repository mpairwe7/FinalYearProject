# Crane Cloud single-container nginx configuration.
#
# All public traffic enters at port 8080 (the only port Crane Cloud
# exposes per app).  Behind nginx:
#   * 127.0.0.1:8081 -> uvicorn-chat  (FastAPI backend, see supervisord.conf)
#   * 127.0.0.1:8082 -> uvicorn-calls (the same app: the one process that owns calls)
#   * 127.0.0.1:3000 -> next.js standalone server
#
# A live call lives in the memory of one process, so every call path goes to the
# single-worker call process and nowhere else.  The other API paths go to the
# "api" upstream, which lists both, because the call process serves the whole
# app; the chat role refuses a call path that reaches it (G306).
#
# Classes of route, in priority order (nginx takes the FIRST regex location
# that matches, so the order of the location blocks below is behaviour):
#   0. Call paths — the taxpayer call socket, the staff console under
#      /admin/calls and officer presence.  Always the call process.
#   1. WebSocket upgrades — voice (V1/V2) and the Phase 29 chat WS at
#      /v2/chat/stream.  These need proxy_http_version 1.1 + Upgrade
#      headers and very long read timeouts.
#   2. SSE streaming chat — /v1/chat/stream.  Disables proxy buffering
#      so tokens flush as they arrive, but does NOT need Upgrade headers.
#      Non-streaming chat (/v1/chat) and document analysis get their own
#      generous-but-bounded read timeouts too — a plain 60s default is
#      not enough headroom for a request that walks a multi-backend LLM
#      fallback chain before returning.
#   3. All other backend paths — nginx's compiled-in default timeouts.
#   4. Frontend — everything else falls through to Next.js.

worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 75;
    server_tokens off;

    log_format access '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log access;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    # Every call path: the call process alone.
    upstream calls    { server 127.0.0.1:8082; keepalive 32; }
    # Everything else the API serves: both roles.  Every location that proxies here
    # sets `proxy_next_upstream error;`: nginx's default (error timeout) would send a
    # request that timed out to the other process, doing its work twice and answering
    # 504 after the full timeout.  Only a refused connection (a process that is down)
    # moves on to the other server.
    upstream api      { server 127.0.0.1:8081; server 127.0.0.1:8082; keepalive 32; }
    upstream frontend { server 127.0.0.1:3000; keepalive 32; }

    # Only a WebSocket upgrade is passed on. Any other Upgrade value (h2c above
    # all) is dropped and the connection closed, so a client cannot open a
    # channel to a backend that bypasses these locations' rules.
    map $http_upgrade $websocket_upgrade {
        ~*^websocket$ websocket;
        default       "";
    }
    map $websocket_upgrade $connection_upgrade {
        websocket upgrade;
        default   close;
    }

    server {
        listen 8080 default_server;
        server_name _;

        # Reasonable upload limit; voice frames are capped server-side too.
        client_max_body_size 16m;

        # --- 0. Call paths (taxpayer call socket, staff console, presence) --
        # The regex is app.process_role.NGINX_CALL_LOCATION and a test keeps
        # them equal; the app-side twin (CALL_PATH_RE) is the same paths after
        # the /api strip below.  It must stay the first regex location, ahead of
        # the generic API block, and it is not /calls: that is the frontend page.
        # One block carries both the WebSocket upgrade and the plain HTTP
        # requests, as the generic API block does.
        location ~ ^/(api/(v1/)?|v1/)(calls/stream|admin/calls(/.*)?|admin/officers/(me/)?presence)$ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://calls;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $websocket_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- 1. WebSocket endpoints (Voice, Chat, Tickets) --------------
        # The call sockets are in block 0.
        location ~ ^/(api/)?(v1|v2)/(voice/chat/stream|chat/stream|admin/tickets/stream)$ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api;
            proxy_next_upstream error;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $websocket_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- 2. SSE streaming chat ------------------------------------
        location ~ ^/(v1/chat/stream|api/v1/chat/stream)$ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api;
            proxy_next_upstream error;
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # --- 2b. Non-streaming chat -------------------------------------
        # No override here used to mean nginx's compiled-in 60s default,
        # which was fine while a reply always came from a single backend
        # call. It stopped being enough once the truncation-retry chain
        # (service._llm_cloud_fallback) could walk local -> Gemini -> up to
        # three Workers AI models in sequence on one request — each hop has
        # its own ~30s budget, so a request that keeps getting short replies
        # can legitimately take well past 60s to finish. Give it the same
        # order-of-magnitude headroom as the streaming route rather than
        # let nginx 504 a request the backend would have completed.
        location ~ ^/(v1/chat|api/v1/chat)$ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api;
            proxy_next_upstream error;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        # --- 2c. Document analysis -----------------------------------
        # The API has a 10 MiB file cap plus multipart overhead. Enforce a
        # slightly larger limit before request buffering/parsing so PDF and
        # Office-file attacks cannot consume an arbitrary worker body.
        location ~ ^/(v1/documents/analyze|api/v1/documents/analyze)$ {
            rewrite ^/api/(.*)$ /$1 break;
            client_max_body_size 11m;
            client_body_timeout 20s;
            proxy_pass http://api;
            proxy_next_upstream error;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 45s;
            proxy_send_timeout 45s;
        }

        # --- 3. All other backend paths (including /api/* via Next.js rewrites) ---
        location ~ ^/(health|ready|metrics|classify|tags|faq/|v1/|v2/|api/|internal/) {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api;
            proxy_next_upstream error;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $websocket_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- 4. Frontend (Next.js standalone) -------------------------
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
