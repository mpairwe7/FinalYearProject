# Crane Cloud single-container nginx configuration.
#
# All public traffic enters at port 8080 (the only port Crane Cloud
# exposes per app).  Behind nginx:
#   * 127.0.0.1:8081 -> uvicorn (FastAPI backend, see supervisord.conf)
#   * 127.0.0.1:3000 -> next.js standalone server
#
# Three classes of route, in priority order:
#   1. WebSocket upgrades — voice (V1/V2) and the Phase 29 chat WS at
#      /v2/chat/stream.  These need proxy_http_version 1.1 + Upgrade
#      headers and very long read timeouts.
#   2. SSE streaming chat — /v1/chat/stream.  Disables proxy buffering
#      so tokens flush as they arrive, but does NOT need Upgrade headers.
#   3. All other backend paths.
#   4. Frontend — everything else falls through to Next.js.

worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 75;
    server_tokens off;

    log_format access '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log access;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    upstream backend  { server 127.0.0.1:8081; keepalive 32; }
    upstream frontend { server 127.0.0.1:3000; keepalive 32; }

    server {
        listen 8080 default_server;
        server_name _;

        # Reasonable upload limit; voice frames are capped server-side too.
        client_max_body_size 16m;

        # --- 1. Voice WebSocket endpoints (Phase 23 + 28) ---------------
        location ~ ^/(v1|v2)/voice/chat/stream$ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # --- 1b. Text WebSocket endpoint (Phase 29 — /v2/chat/stream) ---
        # Mirrors the voice block.  60-min upper bound matches the
        # server-side session cap in chat_ws_v2.
        location = /v2/chat/stream {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- 2. SSE streaming chat ------------------------------------
        location ~ ^/(v1/chat/stream|api/v1/chat/stream)$ {
            proxy_pass http://backend;
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # --- 3. All other backend paths (including /api/* via Next.js rewrites) ---
        location ~ ^/(health|ready|metrics|classify|tags|faq/|v1/|v2/|api/|internal/) {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- 4. Frontend (Next.js standalone) -------------------------
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
