; Crane Cloud / HF Space single-container process supervisor.
;
; Six managed processes:
;   * qdrant         (6333, internal) — vector store sidecar, sparse-only collection
;   * redis          (6379, internal) — response cache + rate-limit store sidecar
;   * nginx          (8080, public) — routes WS/SSE/HTTP to the API or the frontend
;   * uvicorn-chat   (8081, internal) — FastAPI backend, everything but calls
;   * uvicorn-calls  (8082, internal) — the same app as the one process that owns calls
;   * next.js        (3000, internal) — Next.js standalone server
;
; The qdrant sidecar exists because neither a managed Qdrant nor Cloudflare is
; reachable from these deployments, which left retrieval on the FAQ-only keyword
; fallback — it never saw a PDF or crawl chunk. Running Qdrant in-container puts
; the whole corpus back behind the retriever. It serves a SPARSE-ONLY collection:
; a BM25 query vector is computed from bm25_state.json in pure Python, whereas a
; dense query would need bge-m3 and this image ships no torch.
;
; All processes log to stdout/stderr so the log pane shows everything in one
; stream.  autorestart=true keeps the pod healthy under transient backend boot
; failures (e.g. cold Redis connect).

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; Starts before uvicorn (lower priority number) so the collection is usually
; available by the time HybridRetriever.initialize() runs. If it is not, the
; retriever falls through to its own fallback chain and Qdrant is picked up on a
; later reinitialise rather than the pod failing to boot.
[program:qdrant]
command=/usr/local/bin/qdrant
directory=/app/qdrant
environment=QDRANT__STORAGE__STORAGE_PATH="/app/qdrant/storage",QDRANT__SERVICE__HTTP_PORT="6333",QDRANT__SERVICE__HOST="127.0.0.1",QDRANT__TELEMETRY_DISABLED="true",QDRANT__LOG_LEVEL="WARN"
autostart=true
autorestart=true
priority=5
startsecs=3
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Response cache + rate-limit store, shared by all uvicorn workers. Pure cache:
; persistence is off, so a restart loses entries and costs nothing but a few
; recomputations — there is no state here worth a volume. maxmemory with LRU
; eviction keeps it from competing with Qdrant and the model for the Space's RAM.
;
; No readiness gate: cache.py falls back to in-process memory when Redis is
; unreachable, so a late or dead Redis degrades rather than breaks.
[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no --maxmemory %(ENV_REDIS_MAXMEMORY)s --maxmemory-policy allkeys-lru --daemonize no --loglevel warning
autostart=true
autorestart=true
priority=6
startsecs=2
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Two roles of the same app, started by uvicorn-role.sh (see it for the worker
; arithmetic and the environment each role gets). A live call lives in the memory of
; the process that accepted it, so one single-worker process owns every call path and
; nginx sends them all there (nginx.conf); the chat role takes everything else.
;
; Each is gated on the sidecar's /healthz: priority alone only orders the starts, and
; uvicorn winning the race means the retriever initialises with no Qdrant and
; serves FAQ-only keyword results until something triggers a re-init. The wrapper
; is bounded and never fail-closed — see wait-for-qdrant.sh. The script execs it and
; wait-for-qdrant.sh execs uvicorn, so signals and supervisord's stop handling still
; reach the real process.
;
; The script also empties the Prometheus multiprocess directory before the workers
; start: each worker writes its samples there and /metrics adds them up
; (app/analytics.py), so files left by a previous run would be counted twice. It does
; that once per container, not once per program start: the other role's workers write
; there too, so a restart of one program must leave the samples alone.
;
; Both roles must share PROMETHEUS_MULTIPROC_DIR, or /metrics sees only half the process.
[program:uvicorn-chat]
command=/usr/local/bin/uvicorn-role.sh chat
directory=/app/backend
environment=PYTHONUNBUFFERED="1",PYTHONDONTWRITEBYTECODE="1",PATH="/opt/venv/bin:/usr/local/bin:/usr/bin:/bin",PROMETHEUS_MULTIPROC_DIR="/tmp/ura-prometheus"
autostart=true
autorestart=true
priority=20
; Must exceed the readiness wait: supervisord treats an exit before startsecs as a
; failed start, and the wrapper legitimately runs for up to QDRANT_WAIT_SECONDS
; before uvicorn takes over.
startsecs=5
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:uvicorn-calls]
command=/usr/local/bin/uvicorn-role.sh calls
directory=/app/backend
environment=PYTHONUNBUFFERED="1",PYTHONDONTWRITEBYTECODE="1",PATH="/opt/venv/bin:/usr/local/bin:/usr/bin:/bin",PROMETHEUS_MULTIPROC_DIR="/tmp/ura-prometheus"
autostart=true
autorestart=true
priority=20
; As for uvicorn-chat: longer than the Qdrant readiness wait.
startsecs=5
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:next]
command=node server.js
directory=/app/frontend
; INTERNAL_API_URL is nginx (8080), never an API process: 8081 is the chat role, which refuses call paths, and Next's case-insensitive /api rewrite would send /API/v1/admin/calls past nginx's call location to it.
environment=NODE_ENV="production",PORT="3000",HOSTNAME="127.0.0.1",INTERNAL_API_URL="http://127.0.0.1:8080"
autostart=true
autorestart=true
priority=30
startsecs=3
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
