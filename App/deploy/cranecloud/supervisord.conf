; Crane Cloud single-container process supervisor.
;
; Three managed processes:
;   * nginx     (8080, public) — routes WS/SSE/HTTP to backend or frontend
;   * uvicorn   (8081, internal) — FastAPI backend
;   * next.js   (3000, internal) — Next.js standalone server
;
; All processes log to stdout/stderr so Crane Cloud's log pane shows
; everything in one stream.  autorestart=true keeps the pod healthy
; under transient backend boot failures (e.g. cold Redis connect).

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:uvicorn]
command=/opt/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8081 --workers %(ENV_UVICORN_WORKERS)s --log-level %(ENV_LOG_LEVEL)s --proxy-headers --forwarded-allow-ips=*
directory=/app/backend
environment=PYTHONUNBUFFERED="1",PYTHONDONTWRITEBYTECODE="1",PATH="/opt/venv/bin:/usr/local/bin:/usr/bin:/bin"
autostart=true
autorestart=true
priority=20
startsecs=5
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:next]
command=node server.js
directory=/app/frontend
environment=NODE_ENV="production",PORT="3000",HOSTNAME="127.0.0.1",INTERNAL_API_URL="http://127.0.0.1:8081"
autostart=true
autorestart=true
priority=30
startsecs=3
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
