# Local GPU dev overlay — Sunbird/Sunflower-Qwen3.5-9B (or Sunflower-Qwen3.8-27B) via vLLM.
#
# Standalone local vLLM service with on-the-fly FP8 quantization (--quantization fp8),
# FP8 KV cache (--kv-cache-dtype fp8), --dtype auto, and 64K-262K long-context support
# (native max_position_embeddings=262144 on Sunflower-Qwen3.5-9B & Sunflower-Qwen3.8-27B).
#
#   cd App && docker compose -f docker-compose.yml -f docker-compose.local-sunflower.yml up -d
services:
  vllm:
    image: vllm/vllm-openai:v0.17.1
    container_name: ura-app-vllm-sunflower
    command:
      - --model
      - /model
      - --served-model-name
      - "${SUNFLOWER_MODEL:-Sunbird/Sunflower-Qwen3.5-9B}"
      - --quantization
      - "${SUNFLOWER_QUANTIZATION:-fp8}"
      - --kv-cache-dtype
      - "${SUNFLOWER_KV_CACHE_DTYPE:-fp8}"
      - --dtype
      - "${SUNFLOWER_DTYPE:-auto}"
      - --port
      - "8001"
      - --max-model-len
      - "${SUNFLOWER_MAX_MODEL_LEN:-262144}"
      - --gpu-memory-utilization
      - "${SUNFLOWER_GPU_MEM_UTIL:-0.90}"
      - --max-num-seqs
      - "${SUNFLOWER_MAX_NUM_SEQS:-12}"
      - --limit-mm-per-prompt
      - '{"image": 0, "video": 0}'
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --max-num-batched-tokens
      - "${SUNFLOWER_MAX_BATCH_TOKENS:-16384}"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
    ports:
      - "8011:8001"
    volumes:
      - ${SUNFLOWER_LOCAL_MODEL_DIR:?Set SUNFLOWER_LOCAL_MODEL_DIR to the local model snapshot directory}:/model:ro
    ipc: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=${SUNFLOWER_GPU_ID:-4}
      - HF_HUB_OFFLINE=1
      - VLLM_NO_USAGE_STATS=1
      - DO_NOT_TRACK=1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/v1/models', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 6m
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${SUNFLOWER_GPU_ID:-4}"]
              capabilities: [gpu]
    networks:
      - app-network

  api:
    environment:
      - LLM_BACKEND=vllm
      - LLM_MODEL=${SUNFLOWER_MODEL:-Sunbird/Sunflower-Qwen3.5-9B}
      - VLLM_BASE_URL=http://vllm:8001/v1
      - VLLM_API_KEY=not-needed
      - VLLM_HTTP_TIMEOUT=120
      - LLM_CONTEXT_WINDOW=${LLM_CONTEXT_WINDOW:-262144}
      - LLM_MAX_CONCURRENCY=${LLM_MAX_CONCURRENCY:-12}
      - LLM_MAX_TOKENS=768
      - ANALYTICS_DB_DIR=/tmp/ura-analytics
      # G126: Restore dense model on GPU and cross-encoder reranker on GPU overlay
      - RETRIEVER_DENSE_DEVICE=${RETRIEVER_DENSE_DEVICE:-cuda:0}
      - RERANK_ENABLED=${RERANK_ENABLED:-true}
      - RERANKER_DEVICE=${RERANKER_DEVICE:-cuda:0}
    depends_on:
      vllm:
        condition: service_healthy
