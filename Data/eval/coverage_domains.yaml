# Corpus-coverage domain registry (issue #303).
#
# The unit of reporting is a *taxpayer-facing domain*, not a CSV file: a
# taxpayer asking "how do I register for a TIN" does not know the answer is
# split across ura_instant_tin_application_faqs.csv,
# ura_taxpayer_starter_pack_faqs.csv and the handbook. Coverage is therefore
# measured per domain and each domain names the corpus files that are allowed
# to answer for it.
#
# Every ura_*_faqs.csv in Data/dataset MUST appear under exactly one or more
# domains here. A new corpus file with no domain — and no question in
# Data/eval/coverage_bank.jsonl — fails the gate (acceptance criterion 6).
#
# `floor` is the fraction of that domain's bank questions that must be
# answered on-target. Floors are set *below* the measured rate with headroom,
# the same convention as SELF_RETRIEVAL_FLOOR in
# App/backend/tests/test_retrieval_regression_gate.py: a gate that trips on a
# single new near-duplicate FAQ gets disabled rather than fixed.
#
# `review` is the domain-owner sign-off (acceptance criterion 5). `by` and
# `role` record who reviewed the question bank for this domain; `date` is when.
# `role: ura_domain_owner` is the only value that counts as URA sign-off —
# see docs/runbooks/corpus-coverage.md for the sign-off procedure.

version: 1

# Whole-bank floor, gated alongside the per-domain ones. With 105 questions it
# has the resolution the per-domain figures lack (a four-question domain moves
# in 25-point steps), so this is what catches slow aggregate drift while the
# per-domain floors catch a single domain falling over.
# Measured 85.7% English on 2026-08-20; 0.80 leaves ~6 questions of headroom.
overall_floor: 0.80

# Bank-wide defaults; a domain may override any of them. Every domain sets its
# own `floor`, one question below its measured rate — the resolution the bank
# actually has. This default only applies to a domain added without one.
defaults:
  floor: 0.60
  review:
    by: engineering
    role: engineering
    date: "2026-08-20"
    note: "Drafted from URA contact-centre themes; awaiting URA domain-owner sign-off."

