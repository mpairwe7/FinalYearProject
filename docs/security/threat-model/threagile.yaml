threagile_version: 1.0.0

title: URA AI Taxpayer Chatbot - Threat Model
date: 2026-08-29
author:
  name: URA AI Security Team
  homepage: https://github.com/mpairwe7/FinalYearProject

management_overview_comment: >
  Threat model for the official AI-powered Taxpayer Assistant for the
  Uganda Revenue Authority (URA). Covers hybrid retrieval-augmented generation
  (RAG), Merkle audit logging, PII sanitization, and staff ticket escalation.

business_criticality: critical

shared_runtimes: {}

business_overview:
  description: >
    Official AI-powered Taxpayer Assistant for Uganda Revenue Authority (URA).
    Enables Ugandan taxpayers to query tax laws, rates, filing procedures,
    exemption status, and calculate tax obligations with zero hallucination
    via hybrid RAG (dense + BM25 + DeBERTa cross-encoder reranker).
  images: []

technical_overview:
  description: >
    Next.js 16 frontend + FastAPI backend service containerized on Crane Cloud,
    Qdrant vector database for hybrid semantic search, vLLM / HuggingFace
    inference engine (Sunbird Sunflower-14B / Qwen3-8B-AWQ), SQLite/PostgreSQL
    for analytics & audit logging, Redis for caching & rate limiting,
    and Cloudflare CDN/Tunnel edge proxy.
  images: []

questions:
  Where is taxpayer data processed?: >
    Backend processing in Crane Cloud (Uganda / East Africa region) with
    strict data sovereignty. PII is redacted at edge and output filters.
  How is prompt injection and hallucination prevented?: >
    Multi-layered InputGuard / OutputGuard delimiters, semantic similarity
    checks, DeBERTa NLI cross-encoder grounding, and human ticket escalation.

abuse_cases:
  tax-evasion-prompt-injection: >
    An adversary submits crafted adversarial prompts attempting to force the
    chatbot to give erroneous tax evasion guidance or disclose internal rules.
  pii-exfiltration: >
    An adversary attempts to extract other taxpayers' TINs, NIDs, or phone
    numbers via training data inversion or context leakage.
  rag-corpus-tampering: >
    An adversary attempts to inject malicious tax advice into ingested PDF
    laws or publications to manipulate retrieval results.

# ---------------------------------------------------------------------------
# Tags
# ---------------------------------------------------------------------------
tags_available:
  - next.js
  - react
  - fastapi
  - python
  - qdrant
  - vector-db
  - vllm
  - huggingface
  - redis
  - postgresql
  - sqlite
  - crane-cloud
  - cloudflare

# ---------------------------------------------------------------------------
# Security Requirements
# ---------------------------------------------------------------------------
security_requirements:
  Input Validation: Strict InputGuard validation on all taxpayer queries
  Authentication: JWT / API key authentication for staff and admin endpoints
  Authorization: RBAC for staff triage, admin overrides, and MCP tool execution
  Data Protection: Automatic PII redaction and cryptographic Merkle audit logging
  Grounding: Cross-encoder DeBERTa NLI grounding verification (>0.65 threshold)

# ---------------------------------------------------------------------------
# Trust Boundaries
# ---------------------------------------------------------------------------
trust_boundaries:
  internet-to-edge:
    id: internet-to-edge
    type: network-cloud-provider
    description: Public Internet to Cloudflare Edge / CDN.
    technical_assets_inside:
      - nextjs-frontend
      - cloudflare-proxy
    trust_boundaries_nested: []

  edge-to-backend:
    id: edge-to-backend
    type: network-cloud-provider
    description: Cloudflare Tunnel to Crane Cloud internal VPC network.
    technical_assets_inside:
      - fastapi-api
      - qdrant-vectordb
      - redis-cache
      - database-store
      - vllm-inference
    trust_boundaries_nested: []

# ---------------------------------------------------------------------------
# Data Assets
# ---------------------------------------------------------------------------
data_assets:
  taxpayer-queries:
    id: taxpayer-queries
    description: Inbound tax inquiries submitted by taxpayers (pre-redaction)
    usage: business
    origin: taxpayer-users
    owner: security-team
    confidentiality: strictly-confidential
    integrity: critical
    availability: important
    quantity: many
    justification_cia_rating: >
      Taxpayer queries may contain sensitive personal data (TIN, NID, salary).
      Integrity is critical to ensure accurate guidance.

  tax-law-corpus:
    id: tax-law-corpus
    description: Statutory acts, practice notes, and tariffs ingested into vector DB
    usage: business
    origin: ura-publications
    owner: legal-team
    confidentiality: internal
    integrity: mission-critical
    availability: mission-critical
    quantity: many
    justification_cia_rating: >
      Tax law grounding is the single source of truth for all calculations.
      Tampering could cause systemic miscalculation of taxes.

  audit-ledger:
    id: audit-ledger
    description: Cryptographically hashed Merkle-tree interaction & triage ledger
    usage: business
    origin: fastapi-api
    owner: security-team
    confidentiality: confidential
    integrity: mission-critical
    availability: important
    quantity: many
    justification_cia_rating: >
      Required for regulatory compliance and dispute resolution under Uganda NDPA 2019.

  user-credentials:
    id: user-credentials
    description: Staff JWT tokens, admin passwords, and session keys
    usage: business
    origin: staff-users
    owner: security-team
    confidentiality: strictly-confidential
    integrity: critical
    availability: important
    quantity: few

  api-keys-and-secrets:
    id: api-keys-and-secrets
    description: JWT_SECRET_KEY, CLOUDFLARE_API_TOKEN, DATABASE_URL, SUNBIRD_API_KEY
    usage: business
    origin: devops-team
    owner: security-team
    confidentiality: strictly-confidential
    integrity: mission-critical
    availability: mission-critical
    quantity: few

