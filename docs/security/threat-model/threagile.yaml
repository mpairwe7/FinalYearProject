# ---------------------------------------------------------------------------
# Risk Tracking (overrides for auto-detected risks)
# ---------------------------------------------------------------------------
risk_tracking:
  server-side-request-forgery@cloudflare-proxy@nextjs-frontend@cloudflare-proxy>tunnel-to-frontend:
    status: mitigated
    justification: "Cloudflare Tunnel connector (cloudflared) creates outbound-only encrypted tunnel; frontend endpoint is private and not directly internet-routable."
    ticket: "SEC-SSRF-01"
    date: "2026-08-29"
    checked_by: "URA AI Security Team"

  server-side-request-forgery@fastapi-api@vllm-inference@fastapi-api>api-to-vllm:
    status: mitigated
    justification: "Fixed internal VPC URL routing; strict outbound URL allowlist in mcp/policy.py blocks RFC 1918 and loopback/link-local ranges."
    ticket: "SEC-SSRF-02"
    date: "2026-08-29"
    checked_by: "URA AI Security Team"

  server-side-request-forgery@nextjs-frontend@fastapi-api@nextjs-frontend>frontend-to-backend-api:
    status: mitigated
    justification: "Hardcoded backend proxy target with no user-controlled URL redirection on server-side requests."
    ticket: "SEC-SSRF-03"
    date: "2026-08-29"
    checked_by: "URA AI Security Team"

  missing-cloud-hardening@edge-to-backend:
    status: mitigated
    justification: "Encrypted zero-trust Cloudflare Tunnel with strict mTLS and origin CA certificate verification."
    ticket: "SEC-CLOUD-01"
    date: "2026-08-29"
    checked_by: "URA AI Security Team"

  missing-cloud-hardening@internet-to-edge:
    status: mitigated
    justification: "Cloudflare Enterprise edge with managed WAF rulesets, DDoS L3/L4/L7 mitigation, and TLS 1.3 enforcement."
    ticket: "SEC-CLOUD-02"
    date: "2026-08-29"
    checked_by: "URA AI Security Team"

  unguarded-access-from-internet@fastapi-api@nextjs-frontend@nextjs-frontend>frontend-to-backend-api:
    status: mitigated
    justification: "FastAPI is isolated in private VPC; requests mediated through Next.js BFF with SlowAPI rate limiting and JWT auth."
    ticket: "SEC-NET-01"
    date: "2026-08-29"
    checked_by: "URA AI Security Team"

  missing-authentication@cloudflare-proxy>tunnel-to-frontend@cloudflare-proxy@nextjs-frontend:
    status: mitigated
    justification: "Tunnel connector authenticated via cryptographic Cloudflare Tunnel tokens and Cloudflare Access service tokens."
    ticket: "SEC-AUTH-01"
    date: "2026-08-29"
    checked_by: "URA AI Security Team"

  missing-file-validation@fastapi-api:
    status: mitigated
    justification: "Fail-closed pdf_guards.py and documents.py validate MIME/magic bytes, reject macros and active scripts, enforce xref/page caps."
    ticket: "SEC-FILE-01"
    date: "2026-08-29"
    checked_by: "URA AI Security Team"

  missing-file-validation@nextjs-frontend:
    status: mitigated
    justification: "Client-side MIME type allowlist, extension verification, and 10MB file size ceiling before dispatch."
    ticket: "SEC-FILE-02"
    date: "2026-08-29"
    checked_by: "URA AI Security Team"

  missing-hardening@database-store:
    status: mitigated
    justification: "Container runs as non-root (UID 10001), drop all capabilities, read-only rootfs, isolated VPC network."
    ticket: "SEC-HARD-01"
    date: "2026-08-29"
    checked_by: "URA AI Security Team"

  missing-hardening@fastapi-api:
    status: mitigated
    justification: "Container runs as non-root (UID 10001), no-new-privileges flag set, security headers (CSP, HSTS) enforced."
    ticket: "SEC-HARD-02"
    date: "2026-08-29"
    checked_by: "URA AI Security Team"

  cross-site-scripting@nextjs-frontend:
    status: mitigated
    justification: "OutputGuard HTML sanitization on backend, DOMPurify + rehype-sanitize in Markdown renderer, strict CSP."
    ticket: "SEC-XSS-01"
    date: "2026-08-29"
    checked_by: "URA AI Security Team"

  sql-nosql-injection@fastapi-api@database-store@fastapi-api>api-to-database:
    status: mitigated
    justification: "All database queries use parameterized SQL bindings (?, %s) or strict whitelist-validated identifiers."
    ticket: "SEC-SQL-01"
    date: "2026-08-29"
    checked_by: "URA AI Security Team"

  sql-nosql-injection@fastapi-api@qdrant-vectordb@fastapi-api>api-to-qdrant:
    status: mitigated
    justification: "Qdrant search requests use structured gRPC / typed Pydantic models with parameterized filter clauses."
    ticket: "SEC-SQL-02"
    date: "2026-08-29"
    checked_by: "URA AI Security Team"

  sql-nosql-injection@fastapi-api@redis-cache@fastapi-api>api-to-redis:
