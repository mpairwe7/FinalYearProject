    cwe: "CWE-250"

  # ===========================================================================
  # 8. Enterprise Connectors & Autonomous Agent Workflows
  # ===========================================================================
  - id: T-CON-01
    element: Connectors Orchestrator
    framework: STRIDE
    stride_category: E
    threat: Server-Side Request Forgery (SSRF) via remote MCP connector registration
    severity: High
    cvss: "8.6"
    existing_controls: Runtime registration and configuration are disabled (410 Gone); remote MCP endpoints come only from deployment configuration, must be http(s) without embedded credentials and https in production, and redirects are never followed
    status: Mitigated
    mitigation_target: Shipped
    owner: backend-team
    cwe: "CWE-918"
    owasp_llm: "LLM06"
    mitre_atlas: "AML.T0052"

  - id: T-CON-02
    element: Autonomous Vision Agent
    framework: STRIDE
    stride_category: T
    threat: Indirect prompt injection in uploaded National ID OCR images manipulating TIN registration
    severity: Medium
    cvss: "6.8"
    existing_controls: Strict regex-based entity isolation (14-char NIN, phone), document classification priority gate, input guard sanitization before tool dispatch
    status: Mitigated
    mitigation_target: Shipped
    owner: ai-team
    cwe: "CWE-20"
    owasp_llm: "LLM01"
    mitre_atlas: "AML.T0051"

  - id: T-CON-03
    element: Standalone Portals
    framework: STRIDE
    stride_category: S
    threat: Automated credential stuffing and unescaped database XSS on enterprise node web dashboards
    severity: Medium
    cvss: "6.5"
    existing_controls: Mandatory Auth Gate on GET /, dynamic server-validated HTML5 canvas CAPTCHA with Bezier distortion curves, HTML entity escaping on all rendered fields, non-root appuser in Dockerfile.plugins
    status: Mitigated
    mitigation_target: Shipped
    owner: frontend-team
    cwe: "CWE-79"
    owasp_llm: "LLM05"

  - id: T-CON-04
    element: Enterprise Datastores
    framework: STRIDE
    stride_category: T
    threat: State tampering via credit note over-crediting, unvalidated stamp activations, or unauthenticated stock releases
    severity: High
    cvss: "8.2"
    existing_controls: Cumulative credited balance tracking, invoice status cancellation checks, order payment checks, exact matching on taxpayer lookups, non-idempotent tool flags
    status: Mitigated
    mitigation_target: Shipped
    owner: backend-team
    cwe: "CWE-840"
    owasp_llm: "LLM06"

  - id: T-CON-05
    element: Connector MCP Servers
    framework: STRIDE
    stride_category: S
    threat: Unauthenticated access to a connector MCP server, or role escalation by asserting a caller identity in the request body or replaying a token issued for another server
    severity: High
    cvss: "8.1"
    existing_controls: Every HTTP request authenticated (audience-bound OAuth 2.1 RS256 token, or a deployment-managed shared token of at least 32 characters compared in constant time); a server with no credential is locked; body identity honoured only when authenticated; per-system credentials; Origin allow-list; header and body must agree
    status: Mitigated
    mitigation_target: Shipped
    owner: backend-team
    cwe: "CWE-306"
    owasp_llm: "LLM06"
    mitre_atlas: "AML.T0052"
