  # ===========================================================================
  # 4. LLM & Inference Engine (vLLM / HuggingFace)
  # ===========================================================================
  - id: T-LLM-01
    element: LLM Inference
    framework: STRIDE
    stride_category: T
    threat: Direct jailbreak / prompt injection overriding system prompt and safety policies
    severity: High
    cvss: "8.6"
    existing_controls: InputGuard regex & semantic injection filter, system prompt boundary isolation, OutputGuard verification
    status: Mitigated
    mitigation_target: Shipped
    owner: ai-team
    cwe: "CWE-74"
    owasp_llm: "LLM01"
    mitre_atlas: "AML.T0054"

  - id: T-LLM-02
    element: LLM Inference
    framework: STRIDE
    stride_category: I
    threat: PII leakage (Uganda TIN, National ID, Phone, Email, Bank info) in generated output
    severity: Critical
    cvss: "9.0"
    existing_controls: OutputGuard PII regex & entity redaction with automatic masking ([TIN-REDACTED], [PHONE-REDACTED])
    status: Mitigated
    mitigation_target: Shipped
    owner: ai-team
    cwe: "CWE-359"
    owasp_llm: "LLM02"
    mitre_atlas: "AML.T0024.001"

  - id: T-LLM-03
    element: LLM Inference
    framework: STRIDE
    stride_category: T
    threat: Hallucination of tax rates, penalties, or legal deadlines
    severity: High
    cvss: "8.1"
    existing_controls: DeBERTa cross-encoder entailment grounding check; automatic abstention/escalation when confidence < 0.65
    status: Mitigated
    mitigation_target: Shipped
    owner: ai-team
    cwe: "CWE-392"
    owasp_llm: "LLM09"

  - id: T-LLM-04
    element: LLM Inference
    framework: STRIDE
    stride_category: D
    threat: GPU resource exhaustion via quadratic attention token exhaustion (denial of service)
    severity: Medium
    cvss: "6.8"
    existing_controls: Max token length limits (max_model_len=8192, max_output_tokens=1024), request queue caps
    status: Mitigated
    mitigation_target: Shipped
    owner: infra-team
    cwe: "CWE-400"
    owasp_llm: "LLM10"

  # ===========================================================================
  # 5. MCP Tools & Agentic Execution (MAESTRO Framework)
  # ===========================================================================
  - id: M-AGT-01
    element: MCP Agent
    framework: MAESTRO
    stride_category: E
    threat: Excessive agency / unauthorized tool invocation (e.g. executing arbitrary tax adjustments)
    severity: Critical
    cvss: "9.4"
    existing_controls: Strict tool policy gating (mcp/policy.py), human-in-the-loop for ticket escalation, read-only tools by default
    status: Mitigated
    mitigation_target: Shipped
    owner: backend-team
    cwe: "CWE-863"
    owasp_llm: "LLM06"
    mitre_atlas: "AML.T0040"

  - id: M-AGT-02
    element: MCP Agent
    framework: MAESTRO
    stride_category: T
    threat: Tool parameter tampering / SSRF via malicious URL parameters in external scrapers
    severity: High
    cvss: "8.7"
    existing_controls: Strict URL scheme allowlist (HTTPS only, official URA domains), private IP range blocking (10.0.0.0/8, 127.0.0.0/8, 169.254.0.0/16)
    status: Mitigated
    mitigation_target: Shipped
    owner: backend-team
    cwe: "CWE-918"
    owasp_llm: "LLM07"

  - id: M-AGT-03
    element: MCP Agent
    framework: MAESTRO
    stride_category: I
    threat: Sensitive memory / system context leakage to untrusted third-party subagents
    severity: Medium
    cvss: "6.5"
    existing_controls: Memory isolation between conversation sessions, ephemeral subagent contexts
    status: Mitigated
    mitigation_target: Shipped
    owner: backend-team
    cwe: "CWE-200"
    owasp_llm: "LLM08"

  - id: M-AGT-04
    element: MCP Client & Registry
    framework: MAESTRO
    stride_category: T
    threat: MCP tool poisoning, full-schema poisoning, or post-approval rug-pull descriptor mutation (SAFE-MCP SAF-T1001/SAF-T1201)
    severity: High
    cvss: "8.8"
    existing_controls: Canonical SHA-256 descriptor fingerprinting (compute_descriptor_sha256), inspect_descriptor_integrity prompt-override & bidi scan, and TTL/version-scoped descriptor pinning in MCPClient
    status: Mitigated
    mitigation_target: Shipped
    owner: backend-team
    cwe: "CWE-345"
    owasp_llm: "LLM03"
    mitre_atlas: "AML.T0110"

  - id: M-AGT-05
    element: MCP Client & Transports
    framework: MAESTRO
    stride_category: E
    threat: Cross-server MCP tool shadowing and namespace hijacking by a remote MCP server (SAFE-MCP SAF-T1301)
    severity: High
    cvss: "8.5"
    existing_controls: MCPClient._check_cross_namespace_shadowing enforces canonical ToolRegistry namespace ownership and blocks cross-tool shadowing directives
    status: Mitigated
    mitigation_target: Shipped
    owner: backend-team
    cwe: "CWE-290"
    owasp_llm: "LLM06"
    mitre_atlas: "AML.T0073"

  - id: M-AGT-06
    element: MCP Output Boundary
    framework: MAESTRO
    stride_category: I
    threat: Indirect prompt injection, Unicode control smuggling, and credential harvesting via MCP tool responses (SAFE-MCP SAF-T1102/SAF-T1504)
    severity: High
    cvss: "8.6"
    existing_controls: screen_tool_result normalizes zero-width/bidi characters, quarantines chat-template control tokens and raw JWT/API secrets, and scrubs prompt-override directives
    status: Mitigated
    mitigation_target: Shipped
    owner: backend-team
    cwe: "CWE-74"
    owasp_llm: "LLM01"
    mitre_atlas: "AML.T0098"

  - id: M-AGT-07
    element: Cognitive Memory Tools
    framework: MAESTRO
    stride_category: T
    threat: Confused-deputy persistent memory implant and cross-tenant fact poisoning via tool arguments (SAFE-MCP SAF-T1204/SAF-T1307)
    severity: High
    cvss: "8.4"
    existing_controls: memory_store and memory_discard require personalization consent or verified role; ToolRegistry.call strips argument-supplied user_id/tenant_id and injects only verified caller identity from _meta
    status: Mitigated
    mitigation_target: Shipped
    owner: backend-team
    cwe: "CWE-863"
    owasp_llm: "LLM06"
    mitre_atlas: "AML.T0080"

  - id: M-AGT-08
    element: MCP Multi Round-Trip State (MRTR)
    framework: MAESTRO
    stride_category: T
    threat: Unsigned alg=none or stripped-signature requestState forgery across multi-turn MCP elicitations (OWASP MCP07, RFC 8725)
    severity: High
    cvss: "8.2"
    existing_controls: mrtr.py refuses alg=none and requires >=32-char HMAC-SHA256 secret in production; MCPClient enforces unwrap_request_state on all non-null requestState payloads
    status: Mitigated
    mitigation_target: Shipped
    owner: backend-team
    cwe: "CWE-347"
    owasp_llm: "LLM06"
    mitre_atlas: "AML.T0053"

  - id: M-AGT-09
    element: MCP HTTP Transport
    framework: MAESTRO
    stride_category: D
    threat: Remote MCP server oversized response memory exhaustion, unbounded ttlMs cache pinning, or link-local metadata SSRF in production (MAESTRO L4)
    severity: High
    cvss: "7.8"
    existing_controls: HttpTransport enforces MAX_MCP_RESPONSE_BYTES (2 MiB), clamps _cache_seconds to 86400s, and blocks loopback/link-local metadata IPs in production
    status: Mitigated
    mitigation_target: Shipped
    owner: backend-team
    cwe: "CWE-400"
    owasp_llm: "LLM10"
    mitre_atlas: "AML.T0029"

