name: ura_chatbot
description: "URA Chatbot — AI-powered tax assistant for Uganda Revenue Authority"
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State management + routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.3.0                # declarative routing + deep linking ready

  # Networking
  dio: ^5.7.0

  # Local storage
  shared_preferences: ^2.5.3

  # Voice input
  speech_to_text: ^7.0.0

  # Utilities
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.0.0        # real app version + build number
  connectivity_plus: ^6.0.5        # live network status for offline banner
  intl: ^0.19.0                    # date formatting for message timestamps

  # UI
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0                  # loading skeleton placeholders

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
