name: ura_chatbot
description: "URA Chatbot — AI-powered tax assistant for Uganda Revenue Authority"
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Local storage
  shared_preferences: ^2.5.3

  # Voice input
  speech_to_text: ^7.0.0

  # Utilities
  uuid: ^4.5.1
  url_launcher: ^6.3.1

  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
