name: ura_chatbot
description: "URA Chatbot — AI-powered tax assistant for Uganda Revenue Authority"
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State management + routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.3.0                # declarative routing + deep linking ready

  # Networking
  dio: ^5.7.0

  # Local storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.2    # consent grants (Phase A)
  sqflite: ^2.3.3                   # local hash-chained audit ledger
  path_provider: ^2.1.5             # app-support dir for ledger + models
  path: ^1.9.0                      # sqflite path join

  # Crypto for the audit ledger + TTS cache keys
  crypto: ^3.0.6

  # Voice input — legacy OS fallback (Phase C keeps this for English only)
  speech_to_text: ^7.0.0

  # --- Phase B/C/D: on-device speech stack -------------------------------
  # sherpa-onnx provides one unified native runtime for Silero VAD +
  # Whisper ASR + VITS TTS. Flutter package bundles libs for both
  # Android (arm64/armv7) and iOS (arm64) targets.
  sherpa_onnx: ^1.10.30
  record: ^5.1.2                    # PCM16 streaming audio capture
  just_audio: ^0.9.40               # TTS playback
  flutter_tts: ^4.2.0               # last-resort native TTS fallback
  permission_handler: ^11.3.1       # runtime mic + notification grants

  # Utilities
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.0.0        # real app version + build number
  connectivity_plus: ^6.0.5        # live network status for offline banner
  intl: ^0.19.0                    # date formatting for message timestamps

  # UI
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0                  # loading skeleton placeholders

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/speech/
    - assets/speech/eval/
