# Dart / Flutter analyzer configuration for the URA Chatbot app.
#
# We extend ``flutter_lints`` (the Google-recommended baseline) with a
# curated set of SAFETY-CRITICAL rules. Pure-style rules (constructor
# ordering, required-named-params-first, etc.) are intentionally left
# off so the signal-to-noise ratio stays high.
#
# Every rule here either:
#   1. Catches a latent bug (discarded futures, async context gaps), or
#   2. Enforces a performance best practice (const constructors), or
#   3. Enforces a cross-version API contract (avoid_web_libraries_in_flutter).

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    invalid_use_of_visible_for_testing_member: warning
    invalid_override_of_non_virtual_member: error
    deprecated_member_use: info
    deprecated_member_use_from_same_package: info

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    # --- Correctness (safety-critical) ---
    avoid_empty_else: true
    avoid_slow_async_io: true
    avoid_type_to_string: true
    avoid_web_libraries_in_flutter: true
    cancel_subscriptions: true
    close_sinks: true
    control_flow_in_finally: true
    hash_and_equals: true
    no_adjacent_strings_in_list: true
    no_duplicate_case_values: true
    prefer_void_to_null: true
    throw_in_finally: true
    unnecessary_statements: true
    use_build_context_synchronously: true   # prevents leaked context after await
    valid_regexps: true

    # --- Performance (real impact) ---
    avoid_unnecessary_containers: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_fields: true
    prefer_final_locals: true
    sized_box_for_whitespace: true
    use_decorated_box: true
    use_colored_box: true

    # --- Hygiene ---
    avoid_redundant_argument_values: true
    unnecessary_lambdas: true
    unnecessary_parenthesis: true
    use_super_parameters: true
    use_key_in_widget_constructors: true

    # --- Flutter specifics ---
    avoid_print: true            # prefer dart:developer log / AppErrorHandler

    # --- Deliberately OFF (pure style, high noise, low value) ---
    # sort_constructors_first: false
    # always_put_required_named_parameters_first: false
    # discarded_futures: false               # analytics fire-and-forget is intentional
    # unawaited_futures: false               # same rationale
    # avoid_positional_boolean_parameters: false
    # require_trailing_commas: false         # conflicts with long generic signatures
    # prefer_single_quotes: false            # existing code uses double quotes consistently
    # sort_child_properties_last: false
    # always_declare_return_types: false     # inferred return types are fine
