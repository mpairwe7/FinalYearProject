# TruffleHog OSS Configuration — URA AI Taxpayer Chatbot
# https://github.com/trufflesecurity/trufflehog

detectors:
  - name: huggingface-token
    keywords:
      - "hf_"
      - "HF_TOKEN"
    regex:
      adjective: "HuggingFace Token"
      value: "hf_[a-zA-Z0-9]{34,}"
    verify: []

  - name: uganda-tin-number
    keywords:
      - "tin"
      - "taxpayer_tin"
      - "TIN"
    regex:
      adjective: "Uganda TIN Number"
      value: "(?i)tin[:=\\s]{1,3}[1-9][0-9]{9}"
    verify: []

  - name: mobile-money-api-key
    keywords:
      - "momo"
      - "mtn_momo"
      - "airtel_money"
    regex:
      adjective: "Uganda Mobile Money Key"
      value: "(momo|mtn|airtel)[_-]?(api[_-]?key|secret|token)[_-]?=\\s*['\"][a-zA-Z0-9]{20,}['\"]"
    verify: []

  - name: gcp-service-account-json
    keywords:
      - "private_key_id"
      - "client_email"
    regex:
      adjective: "GCP Service Account"
      value: '"private_key":\s*"-----BEGIN [A-Z ]+ KEY-----'
    verify: []
